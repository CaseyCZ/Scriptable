name: README release audit once

on:
  push:
    paths:
      - '.github/workflows/readme-release-audit-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Install shared release metadata sync
        shell: bash
        run: |
          cat > .github/scripts/sync_release_metadata.py <<'PY'
          from pathlib import Path
          import json
          import re

          ROOT_CZ = Path('README.md')
          ROOT_EN = Path('README_EN.md')
          SITE = Path('index.html')

          APPS = [
              {
                  'name': 'LockScreen Generator',
                  'source': Path('apps/LockScreenGenerator/LockScreenGenerator.js'),
                  'version_json': Path('apps/LockScreenGenerator/version.json'),
                  'readmes': [Path('apps/LockScreenGenerator/README.md'), Path('apps/LockScreenGenerator/README_EN.md')],
                  'site': True,
              },
              {
                  'name': 'Sports Info',
                  'source': Path('apps/Sports-Info/Sports Info.js'),
                  'version_json': Path('apps/Sports-Info/version.json'),
                  'readmes': [Path('apps/Sports-Info/README.md'), Path('apps/Sports-Info/README_EN.md')],
                  'site': True,
              },
              {
                  'name': 'Sideload Watch',
                  'source': Path('apps/Sideload-Watch/Sideload Watch.js'),
                  'version_json': Path('apps/Sideload-Watch/version.json'),
                  'readmes': [Path('apps/Sideload-Watch/README.md'), Path('apps/Sideload-Watch/README_EN.md')],
                  'site': True,
              },
              {
                  'name': 'Home Dashboard',
                  'source': Path('apps/Home-Dashboard/Home Dashboard.js'),
                  'version_json': Path('apps/Home-Dashboard/version.json'),
                  'readmes': [Path('apps/Home-Dashboard/README.md'), Path('apps/Home-Dashboard/README_EN.md')],
                  'site': True,
              },
              {
                  'name': 'Homebridge Status',
                  'source': Path('apps/Homebridge-Status/Homebridge Status.js'),
                  'version_json': Path('apps/Homebridge-Status/version.json'),
                  'readmes': [Path('apps/Homebridge-Status/README.md'), Path('apps/Homebridge-Status/README_EN.md')],
                  'site': False,
              },
          ]

          def version_from_source(path: Path) -> str:
              text = path.read_text(encoding='utf-8')
              match = re.search(r'const APP_VERSION\s*=\s*["\']([^"\']+)["\']', text)
              if not match:
                  raise SystemExit(f'APP_VERSION missing: {path}')
              return match.group(1)

          def write_if_changed(path: Path, content: str) -> None:
              old = path.read_text(encoding='utf-8') if path.exists() else None
              if old != content:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(content, encoding='utf-8')

          def sync_root(content: str, name: str, version: str) -> str:
              pattern = rf'(<tr><td><strong>{re.escape(name)}</strong></td><td><code>)([^<]+)(</code></td>)'
              content, count = re.subn(pattern, rf'\g<1>v{version}\g<3>', content, count=1)
              if count != 1:
                  raise SystemExit(f'Root README row missing: {name}')
              return content

          def sync_app_readme(content: str, version: str) -> str:
              replacements = [
                  (r'(img\.shields\.io/badge/VERZE-v)[0-9A-Za-z._-]+(-38BDF8)', rf'\g<1>{version}\g<2>'),
                  (r'(img\.shields\.io/badge/VERSION-v)[0-9A-Za-z._-]+(-38BDF8)', rf'\g<1>{version}\g<2>'),
                  (r'(Aktuální testovací verze:\s*\*\*v)[0-9A-Za-z._-]+(\*\*)', rf'\g<1>{version}\g<2>'),
                  (r'(Current testing version:\s*\*\*v)[0-9A-Za-z._-]+(\*\*)', rf'\g<1>{version}\g<2>'),
                  (r'(alt="[^"]*\bverze )[0-9A-Za-z._-]+(")', rf'\g<1>{version}\g<2>'),
                  (r'(alt="[^"]*\bversion )[0-9A-Za-z._-]+(")', rf'\g<1>{version}\g<2>'),
              ]
              changed = content
              hits = 0
              for pattern, replacement in replacements:
                  changed, count = re.subn(pattern, replacement, changed, count=1)
                  hits += count
              if hits == 0:
                  raise SystemExit('No version marker found in app README')
              return changed

          root_cz = ROOT_CZ.read_text(encoding='utf-8')
          root_en = ROOT_EN.read_text(encoding='utf-8')
          site = SITE.read_text(encoding='utf-8')

          versions = {}
          for app in APPS:
              version = version_from_source(app['source'])
              versions[app['name']] = version
              write_if_changed(app['version_json'], json.dumps({'version': version}, ensure_ascii=False, indent=2) + '\n')

              root_cz = sync_root(root_cz, app['name'], version)
              root_en = sync_root(root_en, app['name'], version)

              for readme in app['readmes']:
                  text = readme.read_text(encoding='utf-8')
                  write_if_changed(readme, sync_app_readme(text, version))

              if app['site']:
                  pattern = rf"(\{{name:'{re.escape(app['name'])}',version:')[^']+(')"
                  site, count = re.subn(pattern, rf'\g<1>{version}\g<2>', site, count=1)
                  if count != 1:
                      raise SystemExit(f'Website card missing: {app["name"]}')

          marker = '<!-- App versions are synchronized automatically from APP_VERSION in each production script. -->'
          if marker not in root_cz:
              root_cz = root_cz.replace('## Aplikace\n', '## Aplikace\n\n' + marker + '\n', 1)
          if marker not in root_en:
              root_en = root_en.replace('## Apps\n', '## Apps\n\n' + marker + '\n', 1)

          root_cz = root_cz.replace('Homebridge monitoring s LAN → VPN fallbackem, vlastním vzhledem, notifikacemi a více velikostmi widgetu.', 'Testovací Homebridge monitoring s LAN → VPN fallbackem, vlastním vzhledem, notifikacemi a více velikostmi widgetu.')
          root_en = root_en.replace('Homebridge monitoring with automatic LAN → VPN fallback, customizable appearance, notifications and multiple widget sizes.', 'Testing Homebridge monitor with automatic LAN → VPN fallback, customizable appearance, notifications and multiple widget sizes.')

          write_if_changed(ROOT_CZ, root_cz)
          write_if_changed(ROOT_EN, root_en)
          write_if_changed(SITE, site)

          for name, version in versions.items():
              print(f'{name}: v{version}')
          PY

          cat > .github/scripts/build_scriptable_package.py <<'PY'
          from pathlib import Path
          import json
          import re

          APP_DIR = Path('apps/LockScreenGenerator')
          SRC = APP_DIR / 'LockScreenGenerator.js'
          PACKAGE = APP_DIR / 'LockScreenGenerator.scriptable'

          script = SRC.read_text(encoding='utf-8')
          version_match = re.search(r'const APP_VERSION\s*=\s*"([^"]+)"', script)
          assert version_match, 'APP_VERSION missing from LockScreenGenerator.js'
          version = version_match.group(1)

          package = {
              'always_run_in_app': False,
              'icon': {'color': 'deep-blue', 'glyph': 'magic'},
              'name': 'LockScreen Generator',
              'script': script,
              'share_sheet_inputs': [],
          }
          PACKAGE.write_text(json.dumps(package, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'LockScreen Generator v{version} package synchronized')
          PY

          cat > .github/scripts/build_sports_info_package.py <<'PY'
          from pathlib import Path
          import json
          import re

          APP_DIR = Path('apps/Sports-Info')
          SRC = APP_DIR / 'Sports Info.js'
          PACKAGE = APP_DIR / 'Sports Info.scriptable'

          script = SRC.read_text(encoding='utf-8')
          assert 'const APP_NAME = "Sports Info";' in script
          version_match = re.search(r'const APP_VERSION\s*=\s*"([^"]+)"', script)
          assert version_match, 'APP_VERSION missing from Sports Info.js'
          version = version_match.group(1)

          package = {
              'always_run_in_app': False,
              'icon': {'color': 'deep-blue', 'glyph': 'trophy'},
              'name': 'Sports Info',
              'script': script,
              'share_sheet_inputs': [],
          }
          PACKAGE.write_text(json.dumps(package, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Sports Info v{version} package synchronized')
          PY

          cat > .github/scripts/build_sideload_watch_package.py <<'PY'
          from pathlib import Path
          import json
          import re

          APP_DIR = Path('apps/Sideload-Watch')
          SRC = APP_DIR / 'Sideload Watch.js'
          PACKAGE = APP_DIR / 'Sideload Watch.scriptable'

          script = SRC.read_text(encoding='utf-8')
          assert 'const APP_NAME = "Sideload Watch";' in script
          version_match = re.search(r'const APP_VERSION\s*=\s*"([^"]+)"', script)
          assert version_match, 'APP_VERSION missing from Sideload Watch.js'
          version = version_match.group(1)

          package = {
              'always_run_in_app': False,
              'icon': {'color': 'deep-blue', 'glyph': 'download'},
              'name': 'Sideload Watch',
              'script': script,
              'share_sheet_inputs': [],
          }
          PACKAGE.write_text(json.dumps(package, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Sideload Watch v{version} package synchronized')
          PY

      - name: Patch release workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Pattern missing in {path}: {old[:80]}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # LockScreen: shared metadata sync + current HTML README validation + EN/version metadata in commit.
          p=Path('.github/workflows/build-scriptable-package.yml'); text=p.read_text(encoding='utf-8')
          text=text.replace('      - name: Validate one-source-of-truth release\n', '      - name: Sync README, website and version metadata\n        run: python .github/scripts/sync_release_metadata.py\n\n      - name: Validate one-source-of-truth release\n',1)
          text=text.replace("assert f'| 🪄 **LockScreen Generator** | ✅ v{version} |' in root_readme, 'root README version mismatch'", "assert f'<strong>LockScreen Generator</strong></td><td><code>v{version}</code>' in root_readme, 'root README version mismatch'")
          text=text.replace("            apps/LockScreenGenerator/README.md \\\n            README.md \\\n            index.html", "            apps/LockScreenGenerator/README.md \\\n            apps/LockScreenGenerator/README_EN.md \\\n            apps/LockScreenGenerator/version.json \\\n            README.md \\\n            README_EN.md \\\n            index.html")
          p.write_text(text,encoding='utf-8')

          # Sports Info: shared metadata sync, badge validation, current HTML root row and EN/version metadata.
          p=Path('.github/workflows/build-sports-info-package.yml'); text=p.read_text(encoding='utf-8')
          text=text.replace('      - name: Render and validate settings WebView JavaScript\n', '      - name: Sync README, website and version metadata\n        run: python .github/scripts/sync_release_metadata.py\n\n      - name: Render and validate settings WebView JavaScript\n',1)
          text=text.replace("assert f'**Sports Info v{version} — Production**' in app_readme", "assert f'VERZE-v{version}-38BDF8' in app_readme")
          text=text.replace("assert f'| 🏆 **Sports Info** | ✅ v{version} |' in root_readme", "assert f'<strong>Sports Info</strong></td><td><code>v{version}</code>' in root_readme")
          text=text.replace("            'apps/Sports-Info/README.md' \\\n            'README.md' \\\n            'index.html'", "            'apps/Sports-Info/README.md' \\\n            'apps/Sports-Info/README_EN.md' \\\n            'apps/Sports-Info/version.json' \\\n            'README.md' \\\n            'README_EN.md' \\\n            'index.html'")
          p.write_text(text,encoding='utf-8')

          # Home Dashboard: sync README/version metadata too.
          p=Path('.github/workflows/build-home-dashboard-package.yml'); text=p.read_text(encoding='utf-8')
          text=text.replace('      - name: Validate package parity\n', '      - name: Sync README, website and version metadata\n        run: python .github/scripts/sync_release_metadata.py\n\n      - name: Validate package parity\n',1)
          text=text.replace("            'apps/Home-Dashboard/Home Dashboard.scriptable' \\\n            index.html", "            'apps/Home-Dashboard/Home Dashboard.scriptable' \\\n            'apps/Home-Dashboard/README.md' \\\n            'apps/Home-Dashboard/README_EN.md' \\\n            'apps/Home-Dashboard/version.json' \\\n            README.md \\\n            README_EN.md \\\n            index.html")
          p.write_text(text,encoding='utf-8')

          # Homebridge Status: dynamic version validation and README/version metadata.
          p=Path('.github/workflows/build-homebridge-status-package.yml'); text=p.read_text(encoding='utf-8')
          text=text.replace('      - name: Validate package parity\n', '      - name: Sync README and version metadata\n        run: python .github/scripts/sync_release_metadata.py\n\n      - name: Validate package parity\n',1)
          text=text.replace("assert vm and vm.group(1)=='0.1.13'", "assert vm, 'APP_VERSION missing'\n          version=vm.group(1)")
          text=text.replace("print('Homebridge Status v0.1.13: Large centered 2x2 API layout; public card hidden')", "print(f'Homebridge Status v{version}: Large centered 2x2 API layout; public card hidden')")
          text=text.replace("            'apps/Homebridge-Status/Homebridge Status.scriptable' \\\n            index.html", "            'apps/Homebridge-Status/Homebridge Status.scriptable' \\\n            'apps/Homebridge-Status/README.md' \\\n            'apps/Homebridge-Status/README_EN.md' \\\n            'apps/Homebridge-Status/version.json' \\\n            README.md \\\n            README_EN.md \\\n            index.html")
          p.write_text(text,encoding='utf-8')
          PY

          cat > .github/workflows/build-sideload-watch-package.yml <<'YML'
          name: Build Sideload Watch package

          on:
            push:
              branches: [Master]
              paths:
                - 'apps/Sideload-Watch/Sideload Watch.js'
                - '.github/scripts/build_sideload_watch_package.py'
                - '.github/workflows/build-sideload-watch-package.yml'
            workflow_dispatch:

          permissions:
            contents: write

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                  with:
                    ref: Master

                - name: Validate JavaScript syntax
                  run: |
                    cp 'apps/Sideload-Watch/Sideload Watch.js' /tmp/SideloadWatch.mjs
                    node --check /tmp/SideloadWatch.mjs

                - name: Build package
                  run: python .github/scripts/build_sideload_watch_package.py

                - name: Sync README, website and version metadata
                  run: python .github/scripts/sync_release_metadata.py

                - name: Validate release parity
                  run: |
                    python - <<'PY'
                    import json,re
                    from pathlib import Path
                    app=Path('apps/Sideload-Watch')
                    src=(app/'Sideload Watch.js').read_text(encoding='utf-8')
                    pkg=json.loads((app/'Sideload Watch.scriptable').read_text(encoding='utf-8'))
                    vm=re.search(r'const APP_VERSION\s*=\s*"([^"]+)"',src)
                    assert vm, 'APP_VERSION missing'
                    version=vm.group(1)
                    assert pkg['name']=='Sideload Watch'
                    assert pkg['script']==src
                    assert json.loads((app/'version.json').read_text(encoding='utf-8'))['version']==version
                    assert f'VERZE-v{version}-38BDF8' in (app/'README.md').read_text(encoding='utf-8')
                    assert f'VERSION-v{version}-38BDF8' in (app/'README_EN.md').read_text(encoding='utf-8')
                    assert f'<strong>Sideload Watch</strong></td><td><code>v{version}</code>' in Path('README.md').read_text(encoding='utf-8')
                    assert f"{{name:'Sideload Watch',version:'{version}'" in Path('index.html').read_text(encoding='utf-8')
                    print(f'Sideload Watch v{version}: release surfaces synchronized')
                    PY

                - name: Commit synchronized release files
                  run: |
                    git config user.name "CaseyCZ"
                    git config user.email "25530709+CaseyCZ@users.noreply.github.com"
                    git add \
                      'apps/Sideload-Watch/Sideload Watch.scriptable' \
                      'apps/Sideload-Watch/README.md' \
                      'apps/Sideload-Watch/README_EN.md' \
                      'apps/Sideload-Watch/version.json' \
                      README.md \
                      README_EN.md \
                      index.html
                    if git diff --cached --quiet; then
                      echo "Sideload Watch release surfaces already synchronized"
                      exit 0
                    fi
                    git commit -m "Sync Sideload Watch release surfaces"
                    git push origin HEAD:Master
          YML

      - name: Synchronize current releases
        shell: bash
        run: |
          python .github/scripts/build_scriptable_package.py
          python .github/scripts/build_sports_info_package.py
          python .github/scripts/build_sideload_watch_package.py
          python .github/scripts/build_home_dashboard_package.py
          python .github/scripts/build_homebridge_status_package.py
          python .github/scripts/sync_release_metadata.py

      - name: Validate README audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          apps=[
            ('LockScreen Generator','apps/LockScreenGenerator/LockScreenGenerator.js','apps/LockScreenGenerator/version.json'),
            ('Sports Info','apps/Sports-Info/Sports Info.js','apps/Sports-Info/version.json'),
            ('Sideload Watch','apps/Sideload-Watch/Sideload Watch.js','apps/Sideload-Watch/version.json'),
            ('Home Dashboard','apps/Home-Dashboard/Home Dashboard.js','apps/Home-Dashboard/version.json'),
            ('Homebridge Status','apps/Homebridge-Status/Homebridge Status.js','apps/Homebridge-Status/version.json'),
          ]
          cz=Path('README.md').read_text(encoding='utf-8')
          en=Path('README_EN.md').read_text(encoding='utf-8')
          site=Path('index.html').read_text(encoding='utf-8')
          for name,src_path,json_path in apps:
              src=Path(src_path).read_text(encoding='utf-8')
              m=re.search(r'const APP_VERSION\s*=\s*"([^"]+)"',src); assert m,name
              v=m.group(1)
              assert json.loads(Path(json_path).read_text(encoding='utf-8'))['version']==v
              marker=f'<strong>{name}</strong></td><td><code>v{v}</code>'
              assert marker in cz, f'CZ root mismatch: {name}'
              assert marker in en, f'EN root mismatch: {name}'
              if name!='Homebridge Status':
                  assert f"{{name:'{name}',version:'{v}'" in site, f'site mismatch: {name}'
          assert 'Aktuální testovací verze: **v0.1.1**' not in Path('apps/Homebridge-Status/README.md').read_text(encoding='utf-8')
          assert 'VERSION-v0.2.12-' not in Path('apps/Sideload-Watch/README_EN.md').read_text(encoding='utf-8')
          print('README and release metadata audit OK')
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/readme-release-audit-once.yml

      - name: Commit and push
        run: |
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add -A
          git commit -m "Audit and automate README release metadata"
          git push origin Master
