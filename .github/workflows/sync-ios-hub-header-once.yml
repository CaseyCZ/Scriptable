name: Sync iOS Hub header once

on:
  push:
    paths:
      - '.github/workflows/sync-ios-hub-header-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Sync header
        run: python .github/scripts/sync_ios_hub_header_once.py

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.rfind('<script>')
          end = html.find('</script>', start)
          assert start >= 0 and end > start
          Path('/tmp/scriptable-inline.js').write_text(html[start + 8:end], encoding='utf-8')
          PY
          node --check /tmp/scriptable-inline.js

      - name: Remove one-time files
        run: git rm .github/workflows/sync-ios-hub-header-once.yml .github/scripts/sync_ios_hub_header_once.py

      - name: Commit and push
        run: |
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add -A
          git commit -m "Match Scriptable header to iOS Hub"
          git push origin Master
