name: Probe SofaScore floorball API

on:
  push:
    paths:
      - '.github/workflows/probe-sofascore-floorball.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        shell: bash
        run: |
          set -u
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'
          for base in 'https://api.sofascore.com/api/v1' 'https://www.sofascore.com/api/v1'; do
            echo "=== $base /unique-tournament/829/seasons ==="
            curl -sS -L \
              -H "User-Agent: $UA" \
              -H 'Accept: application/json' \
              -H 'Accept-Language: en-US,en;q=0.9' \
              -H 'Referer: https://www.sofascore.com/' \
              -H 'Origin: https://www.sofascore.com' \
              -w '\nHTTP %{http_code}\n' \
              "$base/unique-tournament/829/seasons" | head -c 5000
            echo
          done
          echo '=== Livesport Superliga HTML ==='
          curl -sS -L \
            -H "User-Agent: $UA" \
            -H 'Accept: text/html,application/xhtml+xml,*/*;q=0.8' \
            -H 'Accept-Language: en-US,en;q=0.9,cs;q=0.8' \
            -H 'Referer: https://www.livesport.com/' \
            -w '\nHTTP %{http_code}\n' \
            'https://www.livesport.com/floorball/czech-republic/livesport-superliga/' | head -c 2500
          echo
          echo '=== Czech Floorball FIS page ==='
          curl -sS -L \
            -H "User-Agent: $UA" \
            -w '\nHTTP %{http_code}\n' \
            'https://www.ceskyflorbal.cz/souteze/livesport-superliga' | head -c 2500
          echo
