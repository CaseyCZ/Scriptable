name: Temporary Sideload Watch medium fit fix

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/zz-temp-sideload-medium-fit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master

      - name: Patch Sideload Watch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          app=Path('apps/Sideload-Watch')
          p=app/'Sideload Watch.js'
          s=p.read_text(encoding='utf-8')

          s=s.replace('// Sideload Watch v0.2.16','// Sideload Watch v0.2.17',1)
          s=s.replace('const APP_VERSION = "0.2.16";','const APP_VERSION = "0.2.17";',1)

          s=s.replace('''  const header=w.addStack();header.centerAlignContent();\n  if(family==="medium")header.addSpacer();''','''  const header=w.addStack();header.centerAlignContent();''',1)
          s=s.replace('''  w.addSpacer(family==="small"?8:10);''','''  w.addSpacer(family==="small"?8:(family==="medium"?5:10));''',1)

          old='''  }else if(status.total===0){\n    const body=w.addStack();body.layoutVertically();body.addSpacer();\n    const ok=body.addText("✓");ok.font=Font.boldSystemFont(family==="small"?24:30);ok.textColor=c.green;ok.centerAlignText();\n    body.addSpacer(4);\n    const msg=body.addText(W.upToDate);msg.font=Font.semiboldSystemFont(family==="small"?11:13);msg.textColor=c.text;msg.centerAlignText();msg.lineLimit=2;\n    if(family==="medium"){\n      const summary=mediumSummary(status,settings);\n      body.addSpacer(11);\n      const tracked=body.addText(summary.tracked);tracked.font=Font.boldSystemFont(9);tracked.textColor=c.muted;tracked.centerAlignText();tracked.lineLimit=1;\n      body.addSpacer(3);\n      const watched=body.addText(summary.watchedLine);watched.font=Font.semiboldSystemFont(11);watched.textColor=c.text;watched.centerAlignText();watched.lineLimit=1;watched.minimumScaleFactor=.75;\n      body.addSpacer(2);\n      const online=body.addText(summary.onlineLine);online.font=Font.mediumSystemFont(10);online.textColor=c.muted;online.centerAlignText();online.lineLimit=1;online.minimumScaleFactor=.75;\n    }\n    body.addSpacer();\n  }else{'''
          new='''  }else if(status.total===0){\n    const body=w.addStack();body.layoutVertically();\n    if(family==="medium"){\n      const centered=(value,font,color)=>{\n        const row=body.addStack();row.centerAlignContent();row.addSpacer();\n        const text=row.addText(value);text.font=font;text.textColor=color;text.lineLimit=1;text.minimumScaleFactor=.72;\n        row.addSpacer();return text\n      };\n      centered("✓",Font.boldSystemFont(22),c.green);\n      body.addSpacer(2);\n      centered(W.upToDate,Font.semiboldSystemFont(12),c.text);\n      const summary=mediumSummary(status,settings);\n      body.addSpacer(5);\n      centered(summary.tracked,Font.boldSystemFont(8),c.muted);\n      body.addSpacer(2);\n      centered(summary.watchedLine,Font.semiboldSystemFont(10),c.text);\n      body.addSpacer(1);\n      centered(summary.onlineLine,Font.mediumSystemFont(9),c.muted);\n    }else{\n      body.addSpacer();\n      const ok=body.addText("✓");ok.font=Font.boldSystemFont(family==="small"?24:30);ok.textColor=c.green;ok.centerAlignText();\n      body.addSpacer(4);\n      const msg=body.addText(W.upToDate);msg.font=Font.semiboldSystemFont(family==="small"?11:13);msg.textColor=c.text;msg.centerAlignText();msg.lineLimit=2;\n      body.addSpacer();\n    }\n  }else{'''
          if old not in s: raise SystemExit('zero updates block marker missing')
          s=s.replace(old,new,1)

          s=s.replace('''  w.addSpacer();\n  if(family==="medium"){''','''  if(family==="medium")w.addSpacer(5);else w.addSpacer();\n  if(family==="medium"){''',1)
          s=s.replace('''      w.addSpacer(4);\n      const timeRow=w.addStack();''','''      w.addSpacer(2);\n      const timeRow=w.addStack();''',1)

          p.write_text(s,encoding='utf-8')
          (app/'version.json').write_text(json.dumps({'version':'0.2.17'},indent=2)+'\n',encoding='utf-8')

          pkg_path=app/'Sideload Watch.scriptable'
          if pkg_path.exists():
              pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
              pkg['script']=s
              pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate
        run: |
          cp 'apps/Sideload-Watch/Sideload Watch.js' /tmp/sideload.mjs
          node --check /tmp/sideload.mjs
          grep -q 'const APP_VERSION = "0.2.17";' 'apps/Sideload-Watch/Sideload Watch.js'
          grep -q 'const centered=(value,font,color)' 'apps/Sideload-Watch/Sideload Watch.js'
          grep -q 'family==="medium"?5:10' 'apps/Sideload-Watch/Sideload Watch.js'
          ! grep -q 'if(family==="medium")header.addSpacer();' 'apps/Sideload-Watch/Sideload Watch.js'

      - name: Commit app files
        run: |
          git config user.name 'CaseyCZ'
          git config user.email '25530709+CaseyCZ@users.noreply.github.com'
          git add 'apps/Sideload-Watch/Sideload Watch.js' 'apps/Sideload-Watch/version.json' 'apps/Sideload-Watch/Sideload Watch.scriptable'
          git commit -m 'Fit and center Sideload Watch medium layout'
          git push origin HEAD:Master
