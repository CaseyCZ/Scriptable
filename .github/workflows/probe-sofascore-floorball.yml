name: Probe SofaScore floorball API

on:
  push:
    paths:
      - '.github/workflows/probe-sofascore-floorball.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe direct standings feed
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'
          T='6gJP1e91'
          TS='YseEWnAC'
          urls=(
            "https://500.flashscore.ninja/500/x/feed/ss_1_${T}_${TS}_table_overall"
            "https://www.livesport.com/x/feed/ss_1_${T}_${TS}_table_overall"
            "https://500.flashscore.ninja/500/x/feed/ss_1_${T}_${TS}_table_overall?"
          )
          n=0
          for url in "${urls[@]}"; do
            n=$((n+1)); out="/tmp/feed$n.txt"
            echo "=== $url ==="
            code=$(curl -sS -L \
              -H "User-Agent: $UA" \
              -H 'Accept: */*' \
              -H 'Accept-Language: en-US,en;q=0.9' \
              -H 'Referer: https://www.livesport.com/' \
              -H 'Origin: https://www.livesport.com' \
              -H 'x-fsign: SW9D1eZo' \
              -o "$out" -w '%{http_code}' "$url" || true)
            echo "HTTP $code SIZE $(wc -c < "$out" 2>/dev/null || echo 0)"
            head -c 6000 "$out" || true
            echo
          done
