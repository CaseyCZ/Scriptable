name: Fix Sports Live Homebridge look once

on:
  push:
    paths:
      - '.github/.sports-live-homebridge-look-run'
      - '.github/sports-live-look.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Apply Homebridge Status visual system
        run: python .github/sports-live-look.py

      - name: Validate Sports Live
        shell: bash
        run: |
          node --check 'apps/Sports-Live/Sports-Live,js'
          grep -F 'const APP_VERSION = "0.2.6";' 'apps/Sports-Live/Sports-Live,js'
          grep -F 'function widgetColors(s)' 'apps/Sports-Live/Sports-Live,js'
          grep -F 'function sportsHeader(w,s,d,c,size=15)' 'apps/Sports-Live/Sports-Live,js'

      - name: Remove one-time files
        run: |
          git rm .github/workflows/fix-sports-live-homebridge-look-once.yml
          git rm .github/.sports-live-homebridge-look-run
          git rm .github/sports-live-look.py

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add -A
          git commit -m "Match Sports Live widget to Homebridge Status"
          git push origin Master
