  <rect x="423" y="60" width="82" height="14" rx="7" fill="#ff8576" opacity=".45" filter="url(#glow)"/>
  <rect x="423" y="60" width="82" height="14" rx="7" fill="#ff8576"/>
  <rect x="415" y="347" width="88" height="14" rx="7" fill="#40cfff" opacity=".45" filter="url(#glow)"/>
  <rect x="415" y="347" width="88" height="14" rx="7" fill="url(#blue)"/>
  <g fill="#ffffff" opacity=".25"><circle cx="452" cy="190" r="5"/><circle cx="456" cy="202" r="7"/><circle cx="459" cy="214" r="8"/></g>
  <circle cx="462" cy="225" r="9" fill="#fff"/><circle cx="462" cy="225" r="3.8" fill="#142d3b"/>
