  <rect width="760" height="420" rx="28" fill="url(#bg)"/>
  <text x="106" y="81" font-size="27" font-weight="800" fill="#f5faff" font-family="Arial,sans-serif">⚽ PONG</text>
  <text x="106" y="113" font-size="27" font-weight="800" fill="#f5faff" font-family="Arial,sans-serif">FOTBAL</text>
