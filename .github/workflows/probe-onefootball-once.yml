name: Probe OneFootball once
on:
  push:
    branches: [Master]
    paths: ['.github/workflows/probe-onefootball-once.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Validate football league feeds
        shell: python
        run: |
          import json, urllib.request
          H={'User-Agent':'Mozilla/5.0'}
          leagues={
            'cze.1':(159,39284),'eng.1':(9,39301),'esp.1':(10,39319),'ger.1':(1,39285),
            'ita.1':(13,39325),'fra.1':(23,39245),'uefa.champions':(5,39356),'uefa.europa':(7,39357),
          }
          def get(url):
            req=urllib.request.Request(url,headers=H)
            with urllib.request.urlopen(req,timeout=15) as r: raw=r.read(); status=r.status
            return status,json.loads(raw)
          for key,(cid,sid) in leagues.items():
            su=f'https://feedmonster.onefootball.com/feeds/il/en/competitions/{cid}/{sid}/standings.json'
            mu=f'https://feedmonster.onefootball.com/feeds/il/en/competitions/{cid}/{sid}/matchdaysOverview.json'
            ss,st=get(su); sm,md=get(mu)
            ranking=((st.get('groups') or [{}])[0].get('ranking') or [])
            matchdays=md.get('matchdays') or []
            cur=next((x for x in matchdays if x.get('isCurrentMatchday')),None)
            ok=ss==200 and sm==200 and len(ranking)>0 and len(matchdays)>0 and cur
            print(key,'OK' if ok else 'FAIL','table',len(ranking),'matchdays',len(matchdays),'current',cur and cur.get('id'))
            if not ok: raise SystemExit(1)
