name: Sports Live file backup one-off

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/_sports-live-backup-oneoff.yml'
      - '.github/scripts/_sports_live_backup_oneoff.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master

      - name: Apply Sports Live backup patch
        run: python .github/scripts/_sports_live_backup_oneoff.py

      - name: Validate JavaScript syntax
        run: |
          cp 'apps/Sports-Live/Sports-Live,js' /tmp/SportsLive.mjs
          node --check /tmp/SportsLive.mjs

      - name: Commit update and cleanup
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git rm .github/workflows/_sports-live-backup-oneoff.yml
          git rm .github/scripts/_sports_live_backup_oneoff.py
          git add 'apps/Sports-Live/Sports-Live,js'
          git commit -m "Use file backup and restore in Sports Live"
          git push origin HEAD:Master
