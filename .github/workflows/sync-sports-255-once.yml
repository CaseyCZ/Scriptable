name: Sync Sports Info v2.5.5 once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/sync-sports-255-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Build package and sync metadata
        run: python .github/scripts/build_sports_info_package.py

      - name: Validate synchronized release
        run: |
          cp 'apps/Sports-Info/Sports Info.js' /tmp/SportsInfo.mjs
          node --check /tmp/SportsInfo.mjs
          python - <<'PY'
          import json,re
          from pathlib import Path
          app=Path('apps/Sports-Info')
          src=(app/'Sports Info.js').read_text(encoding='utf-8')
          pkg=json.loads((app/'Sports Info.scriptable').read_text(encoding='utf-8'))
          assert 'const APP_VERSION = "2.5.5";' in src
          assert pkg['script']==src
          assert '**Sports Info v2.5.5 — Production**' in (app/'README.md').read_text(encoding='utf-8')
          assert '| 🏆 **Sports Info** | ✅ v2.5.5 |' in Path('README.md').read_text(encoding='utf-8')
          assert "{name:'Sports Info',version:'2.5.5'" in Path('index.html').read_text(encoding='utf-8')
          print('Sports Info v2.5.5 synchronized')
          PY

      - name: Commit synchronized surfaces
        run: |
          git config user.name "CaseyCZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add 'apps/Sports-Info/Sports Info.scriptable' 'apps/Sports-Info/README.md' README.md index.html
          if git diff --cached --quiet; then
            echo 'Already synchronized'
          else
            git commit -m 'Sync Sports Info v2.5.5 release surfaces'
            git push origin HEAD:Master
          fi
