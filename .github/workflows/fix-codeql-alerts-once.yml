name: Fix CodeQL alerts once

on:
  push:
    paths:
      - '.github/workflows/fix-codeql-alerts-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Fix CodeQL findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('apps/Home-Dashboard/Home Dashboard.js')
          text = home.read_text(encoding='utf-8')
          start = text.index('function decodeHtmlText(v){')
          end = text.index('\nfunction scanJsonName', start)
          replacement = "\n".join([
              'function decodeHtmlText(v){',
              '  const entities={nbsp:" ",amp:"&",quot:\'"\',"#39":"\'",lt:"<",gt:">"};',
              '  return String(v||"")',
              '    .replace(/&(nbsp|amp|quot|#39|lt|gt);/gi,(match,name)=>entities[String(name).toLowerCase()]??match)',
              '    .replace(/\\s+/g," ")',
              '    .trim()',
              '}'
          ])
          text = text[:start] + replacement + text[end:]
          home.write_text(text, encoding='utf-8')

          test = Path('.github/scripts/test_sports_info_layout.cjs')
          text = test.read_text(encoding='utf-8')
          old = r'''const ui=html.match(/<script>([\s\S]*?)<\/script>/)[1];new vm.Script(ui);'''
          new = "\n".join([
              "const scriptStart=html.indexOf('<script>');",
              "const scriptEnd=html.indexOf('</script>',scriptStart+8);",
              "assert.ok(scriptStart>=0&&scriptEnd>scriptStart,'settings HTML contains inline script');",
              "const ui=html.slice(scriptStart+8,scriptEnd);new vm.Script(ui);"
          ])
          if old not in text:
              raise SystemExit('Sports Info test extraction line not found')
          text = text.replace(old, new, 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check 'apps/Home-Dashboard/Home Dashboard.js'
          node .github/scripts/test_sports_info_layout.cjs

      - name: Remove one-time workflow
        run: git rm .github/workflows/fix-codeql-alerts-once.yml

      - name: Commit and push
        run: |
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add -A
          git commit -m "Fix CodeQL security findings"
          git push origin Master
