name: Temporary Sideload Watch source font fix

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/zz-temp-sideload-source-font.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master

      - name: Patch Sideload Watch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          app=Path('apps/Sideload-Watch')
          p=app/'Sideload Watch.js'
          s=p.read_text(encoding='utf-8')

          s=s.replace('// Sideload Watch v0.2.21','// Sideload Watch v0.2.22',1)
          s=s.replace('const APP_VERSION = "0.2.21";','const APP_VERSION = "0.2.22";',1)

          old='const name=row.addText(item.name);name.font=Font.mediumSystemFont(10);name.textColor=item.health===false?c.red:c.text;name.lineLimit=1;name.minimumScaleFactor=.65;'
          new='const name=row.addText(item.name);name.font=Font.mediumSystemFont(10);name.textColor=item.health===false?c.red:c.text;name.lineLimit=1;name.minimumScaleFactor=1;'
          if old not in s:
              raise SystemExit('source name marker missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          (app/'version.json').write_text(json.dumps({'version':'0.2.22'},indent=2)+'\n',encoding='utf-8')

          pkg_path=app/'Sideload Watch.scriptable'
          if pkg_path.exists():
              pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
              pkg['script']=s
              pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate
        run: |
          cp 'apps/Sideload-Watch/Sideload Watch.js' /tmp/sideload.mjs
          node --check /tmp/sideload.mjs
          grep -q 'const APP_VERSION = "0.2.22";' 'apps/Sideload-Watch/Sideload Watch.js'
          grep -q 'name.minimumScaleFactor=1' 'apps/Sideload-Watch/Sideload Watch.js'

      - name: Commit app files
        run: |
          git config user.name 'CaseyCZ'
          git config user.email '25530709+CaseyCZ@users.noreply.github.com'
          git add 'apps/Sideload-Watch/Sideload Watch.js' 'apps/Sideload-Watch/version.json' 'apps/Sideload-Watch/Sideload Watch.scriptable'
          git commit -m 'Keep Sideload Watch source names at fixed size'
          git push origin HEAD:Master
