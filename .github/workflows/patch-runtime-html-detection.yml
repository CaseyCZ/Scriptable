name: Improve runtime HTML detection

on:
  push:
    branches: [Master]
    paths:
      - ".github/workflows/patch-runtime-html-detection.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Patch checker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/update_community_status.py')
          s = p.read_text()

          old1 = '            expects_html = bool(re.search(rf"\\b{re.escape(variable)}\\.loadString\\s*\\(", tail))'
          new1 = '            expects_html = bool(re.search(rf"\\b{re.escape(variable)}\\.loadString\\s*\\(", tail)) or bool(re.search(r"\\.loadString\\s*\\(", tail[:1200]))'
          if old1 not in s:
              raise SystemExit('expects_html target not found')
          s = s.replace(old1, new1, 1)

          old2 = '    for match in re.finditer(r"(?:class|id)\\s*=\\s*[\\\"\']([A-Za-z0-9_-]{5,})[\\\"\']", normalized):'
          new2 = '    for match in re.finditer(r"(?:class|id)[^A-Za-z0-9_-]{1,16}([A-Za-z][A-Za-z0-9_-]{4,})", normalized):'
          if old2 not in s:
              raise SystemExit('html marker target not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s)
          PY

      - name: Commit patch and remove helper
        run: |
          rm .github/workflows/patch-runtime-html-detection.yml
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add tools/update_community_status.py .github/workflows/patch-runtime-html-detection.yml
          git commit -m "Improve HTML scraper runtime checks"
          git push origin HEAD:Master
