name: Fix Sports Live ESPN schedules once

on:
  push:
    paths:
      - '.github/workflows/diag-espn-sports-live-once.yml'
      - '.github/scripts/fix_sports_live_espn_once.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Apply ESPN schedule fix
        run: python .github/scripts/fix_sports_live_espn_once.py

      - name: Validate Sports Live
        run: |
          node --check 'apps/Sports-Live/Sports-Live,js'
          grep -F 'const APP_VERSION = "0.2.4";' 'apps/Sports-Live/Sports-Live,js'
          grep -F 'async function espnTeamSchedule(s)' 'apps/Sports-Live/Sports-Live,js'

      - name: Validate NHL schedule source
        run: |
          python - <<'PY'
          import json, urllib.request
          u='https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/teams/25/schedule'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r:
              d=json.load(r)
          n=len(d.get('events',[]))
          print('NHL team schedule events:',n)
          if n < 1:
              raise SystemExit('No NHL team events')
          PY

      - name: Remove one-time files
        run: git rm .github/workflows/diag-espn-sports-live-once.yml .github/scripts/fix_sports_live_espn_once.py

      - name: Commit and push
        run: |
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add -A
          git commit -m "Fix ESPN team schedules in Sports Live"
          git push origin Master
