name: Fill community widget previews

on:
  workflow_dispatch:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/fill-community-previews.yml'

permissions:
  contents: write
  actions: write

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Find README screenshots and update catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os, re, json, base64, urllib.request, urllib.parse, urllib.error, time

          path = Path('community-extra.js')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          token = os.environ['GH_TOKEN']

          def api(url):
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'CaseyCZ-Scriptable-Preview-Finder'
              })
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode('utf-8'))

          def fetch_ok(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'CaseyCZ-Scriptable-Preview-Finder','Range':'bytes=0-2048'})
                  with urllib.request.urlopen(req, timeout=12) as r:
                      ct = (r.headers.get('Content-Type') or '').lower()
                      return 200 <= getattr(r,'status',200) < 400 and ('image/' in ct or url.lower().split('?')[0].endswith(('.png','.jpg','.jpeg','.webp','.gif')))
              except Exception:
                  return False

          def repo_from_source(source):
              m = re.match(r'https://github\.com/([^/]+)/([^/#?]+)', source or '')
              if not m: return None
              return m.group(1), m.group(2).removesuffix('.git')

          # Load objects safely in a tiny Node helper so we don't need to parse JS arguments ourselves.
          import subprocess, tempfile
          helper = "global.window={}; require('./community-extra.js'); console.log(JSON.stringify(window.communityExtraApps));"
          raw = subprocess.check_output(['node','-e',helper], text=True)
          apps = json.loads(raw)

          bad_words = ('badge','shield','logo','icon','avatar','qr','sponsor','paypal','buymeacoffee','workflow','build','coverage')
          good_words = ('preview','screenshot','screen-shot','widget','demo','example','sample','small','medium','large','homescreen','home-screen','lockscreen','lock-screen')

          replacements = []
          checked = 0
          candidates = [a for a in apps if not a.get('preview') or 'opengraph.githubassets.com' in a.get('preview','')]
          print(f'Generic/missing previews: {len(candidates)}')

          # Keep one run comfortably below API limits.
          for app in candidates[:180]:
              rr = repo_from_source(app.get('source',''))
              if not rr: continue
              owner, repo = rr
              checked += 1
              try:
                  meta = api(f'https://api.github.com/repos/{owner}/{repo}')
                  branch = meta.get('default_branch') or 'main'
                  rd = api(f'https://api.github.com/repos/{owner}/{repo}/readme')
                  md = base64.b64decode(rd.get('content','')).decode('utf-8', errors='replace')
                  readme_path = rd.get('path','README.md')
                  base_dir = readme_path.rsplit('/',1)[0] if '/' in readme_path else ''
              except Exception as e:
                  print('README skip', owner, repo, type(e).__name__)
                  continue

              imgs = []
              # Markdown and HTML images in README, preserving README order.
              for m in re.finditer(r'!\[[^\]]*\]\(([^)\s]+)(?:\s+["\'][^"\']*["\'])?\)|<img[^>]+src=["\']([^"\']+)["\']', md, flags=re.I):
                  u = m.group(1) or m.group(2)
                  if u: imgs.append(u.strip('<>'))

              scored = []
              for u in imgs:
                  low = urllib.parse.unquote(u).lower()
                  if any(w in low for w in bad_words):
                      continue
                  score = 0
                  if any(w in low for w in good_words): score += 8
                  if low.endswith(('.png','.jpg','.jpeg','.webp','.gif')): score += 3
                  if 'raw.githubusercontent.com' in low or '/blob/' in low: score += 1
                  if score < 3: continue

                  if u.startswith('http://') or u.startswith('https://'):
                      resolved = u.replace('https://github.com/','https://raw.githubusercontent.com/').replace('/blob/','/') if 'github.com/' in u and '/blob/' in u else u
                  else:
                      rel = urllib.parse.unquote(u.split('#')[0].split('?')[0])
                      full = '/'.join(x for x in (base_dir, rel) if x)
                      # normalize ./ and ../ reasonably
                      parts=[]
                      for p in full.split('/'):
                          if p in ('','.'): continue
                          if p == '..':
                              if parts: parts.pop()
                          else: parts.append(p)
                      full='/'.join(parts)
                      resolved = f'https://raw.githubusercontent.com/{owner}/{repo}/{branch}/{urllib.parse.quote(full, safe="/")}'
                  scored.append((score, resolved))

              scored.sort(key=lambda x:x[0], reverse=True)
              chosen = None
              for _, url in scored[:8]:
                  if fetch_ok(url):
                      chosen = url
                      break
              if not chosen:
                  continue

              old = app.get('preview','')
              name = app.get('name','')
              source = app.get('source','')
              replacements.append((name, source, old, chosen))
              print('FOUND', name, '->', chosen)
              time.sleep(0.03)

          changed = 0
          for name, source, old, new in replacements:
              for i, line in enumerate(lines):
                  if name in line and source in line and old in line:
                      lines[i] = line.replace(old, new, 1)
                      changed += 1
                      break

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'Checked repositories: {checked}')
          print(f'Real README previews found/replaced: {changed}')
          PY

          node --check community-extra.js

      - name: Commit previews
        run: |
          git config user.name 'CaseyCZ'
          git config user.email '25530709+CaseyCZ@users.noreply.github.com'
          git rm .github/workflows/fill-community-previews.yml
          git add community-extra.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Use real screenshots for community widget previews'
          git push origin Master

      - name: Deploy website
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref Master
