name: Sync Sports Live APIs once

on:
  push:
    paths:
      - '.github/workflows/sync-sports-live-api-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Sync providers from Sports Info
        run: python .github/scripts/sync_sports_live_api_once.py

      - name: Validate JavaScript
        run: |
          node --check 'apps/Sports-Live/Sports-Live,js'
          grep -F 'const APP_VERSION = "0.2.1";' 'apps/Sports-Live/Sports-Live,js'
          grep -F 'async function scoreboardFor' 'apps/Sports-Live/Sports-Live,js'
          grep -F 'async function teamsFor' 'apps/Sports-Live/Sports-Live,js'
          grep -F 'async function standingsFor' 'apps/Sports-Live/Sports-Live,js'

      - name: Remove one-time files
        run: |
          git rm .github/workflows/sync-sports-live-api-once.yml
          git rm .github/scripts/sync_sports_live_api_once.py

      - name: Commit and push
        run: |
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add -A
          git commit -m "Use Sports Info APIs exactly in Sports Live"
          git push origin Master
