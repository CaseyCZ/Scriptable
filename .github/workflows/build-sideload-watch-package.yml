name: Build Sideload Watch package

on:
  push:
    branches: [Master]
    paths:
      - 'apps/Sideload-Watch/Sideload Watch.js'
      - '.github/scripts/build_sideload_watch_package.py'
      - '.github/scripts/patch_sideload_watch_offline.py'
      - '.github/workflows/build-sideload-watch-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Apply one-time offline source fix
        run: python .github/scripts/patch_sideload_watch_offline.py

      - name: Validate JavaScript syntax
        run: |
          cp 'apps/Sideload-Watch/Sideload Watch.js' /tmp/SideloadWatch.mjs
          node --check /tmp/SideloadWatch.mjs

      - name: Build package
        run: python .github/scripts/build_sideload_watch_package.py

      - name: Sync Sideload Watch release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          app = Path('apps/Sideload-Watch')
          src = (app / 'Sideload Watch.js').read_text(encoding='utf-8')
          match = re.search(r'const APP_VERSION\s*=\s*"([^"]+)"', src)
          assert match, 'APP_VERSION missing'
          version = match.group(1)

          (app / 'version.json').write_text(
              json.dumps({'version': version}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          replacements = [
              (r'(img\.shields\.io/badge/VERZE-v)[0-9A-Za-z._-]+(-38BDF8)', rf'\g<1>{version}\g<2>'),
              (r'(img\.shields\.io/badge/VERSION-v)[0-9A-Za-z._-]+(-38BDF8)', rf'\g<1>{version}\g<2>'),
              (r'(alt="[^"]*\bverze )[0-9A-Za-z._-]+(")', rf'\g<1>{version}\g<2>'),
              (r'(alt="[^"]*\bversion )[0-9A-Za-z._-]+(")', rf'\g<1>{version}\g<2>'),
          ]
          for readme in [app / 'README.md', app / 'README_EN.md']:
              text = readme.read_text(encoding='utf-8')
              hits = 0
              for pattern, replacement in replacements:
                  text, count = re.subn(pattern, replacement, text, count=1)
                  hits += count
              assert hits > 0, f'No version marker found: {readme}'
              readme.write_text(text, encoding='utf-8')

          for root in [Path('README.md'), Path('README_EN.md')]:
              text = root.read_text(encoding='utf-8')
              pattern = r'(<tr><td><strong>Sideload Watch</strong></td><td><code>)([^<]+)(</code></td>)'
              text, count = re.subn(pattern, rf'\g<1>v{version}\g<3>', text, count=1)
              assert count == 1, f'Sideload Watch row missing: {root}'
              root.write_text(text, encoding='utf-8')

          print(f'Sideload Watch v{version}: release metadata synchronized')
          PY

      - name: Validate release parity
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          app=Path('apps/Sideload-Watch')
          src=(app/'Sideload Watch.js').read_text(encoding='utf-8')
          pkg=json.loads((app/'Sideload Watch.scriptable').read_text(encoding='utf-8'))
          vm=re.search(r'const APP_VERSION\s*=\s*"([^"]+)"',src)
          assert vm, 'APP_VERSION missing'
          version=vm.group(1)
          assert pkg['name']=='Sideload Watch'
          assert pkg['script']==src
          assert json.loads((app/'version.json').read_text(encoding='utf-8'))['version']==version
          assert f'VERZE-v{version}-38BDF8' in (app/'README.md').read_text(encoding='utf-8')
          assert f'VERSION-v{version}-38BDF8' in (app/'README_EN.md').read_text(encoding='utf-8')
          marker=f'<strong>Sideload Watch</strong></td><td><code>v{version}</code>'
          assert marker in Path('README.md').read_text(encoding='utf-8')
          assert marker in Path('README_EN.md').read_text(encoding='utf-8')
          print(f'Sideload Watch v{version}: package and CZ/EN READMEs synchronized')
          PY

      - name: Commit synchronized release files
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add \
            'apps/Sideload-Watch/Sideload Watch.js' \
            'apps/Sideload-Watch/Sideload Watch.scriptable' \
            README.md README_EN.md \
            apps/Sideload-Watch/README.md apps/Sideload-Watch/README_EN.md \
            apps/Sideload-Watch/version.json
          if git diff --cached --quiet; then
            echo "Sideload Watch release surfaces already synchronized"
            exit 0
          fi
          git commit -m "Fix offline sources in Sideload Watch"
          git push origin HEAD:Master
