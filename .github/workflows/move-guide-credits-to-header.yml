name: Header navigation cleanup

on:
  push:
    branches: [Master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Remove Guide and Credits from footers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': [
                  '          <a href="guide.html">Guide</a>\n',
                  '          <a href="credits.html">Credits</a>\n',
              ],
              'credits.html': [
                  '<a href="guide.html">Guide</a>',
                  '<a href="credits.html" aria-current="page">Credits</a>',
              ],
          }

          for filename, needles in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for needle in needles:
                  text = text.replace(needle, '', 1)
              path.write_text(text)

          # Guide/Credits must remain in the primary header navigation on all public pages.
          for filename in ('index.html', 'guide.html', 'credits.html'):
              text = Path(filename).read_text()
              nav_start = text.index('<nav class="nav"')
              nav_end = text.index('</nav>', nav_start)
              nav = text[nav_start:nav_end]
              assert 'guide.html' in nav, f'Guide missing from header in {filename}'
              assert 'credits.html' in nav, f'Credits missing from header in {filename}'

          # They must no longer appear in the main/credits footers.
          for filename in ('index.html', 'credits.html'):
              text = Path(filename).read_text()
              footer_start = text.index('<footer')
              footer_end = text.index('</footer>', footer_start)
              footer = text[footer_start:footer_end]
              assert 'href="guide.html"' not in footer, f'Guide still in footer in {filename}'
              assert 'href="credits.html"' not in footer, f'Credits still in footer in {filename}'
          PY
      - name: Validate and commit
        run: |
          node tools/audit-community-catalog.cjs
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git rm .github/workflows/move-guide-credits-to-header.yml
          git add index.html credits.html
          git commit -m "Keep Guide and Credits in header navigation"
          git pull --rebase origin Master
          git push origin Master
