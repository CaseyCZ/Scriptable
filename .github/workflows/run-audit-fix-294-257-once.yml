name: Run audited app fixes once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/run-audit-fix-294-257-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
      - name: Apply audited fixes
        run: python .github/scripts/fix_audit_294_257.py
      - name: Syntax check
        run: |
          cp 'apps/LockScreenGenerator/LockScreenGenerator.js' /tmp/LockScreenGenerator.mjs
          cp 'apps/Sports-Info/Sports Info.js' /tmp/SportsInfo.mjs
          node --check /tmp/LockScreenGenerator.mjs
          node --check /tmp/SportsInfo.mjs
      - name: Commit
        run: |
          git config user.name "CaseyCZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/LockScreenGenerator apps/Sports-Info README.md index.html
          git commit -m "Audit LockScreen 2.9.4 and Sports Info 2.5.7"
          git push origin HEAD:Master
