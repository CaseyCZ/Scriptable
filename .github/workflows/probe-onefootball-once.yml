name: Probe OneFootball once
on:
  push:
    branches: [Master]
    paths: ['.github/workflows/probe-onefootball-once.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current public feeds
        shell: python
        run: |
          import json, urllib.request
          urls = {
            'pl_standings':'https://feedmonster.onefootball.com/feeds/il/en/competitions/9/39301/standings.json',
            'pl_matchdays':'https://feedmonster.onefootball.com/feeds/il/en/competitions/9/39301/matchdaysOverview.json',
            'cz_standings':'https://feedmonster.onefootball.com/feeds/il/en/competitions/159/39284/standings.json',
            'cz_matchdays':'https://feedmonster.onefootball.com/feeds/il/en/competitions/159/39284/matchdaysOverview.json',
          }
          for name,url in urls.items():
            print('\n###', name, url)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=15) as r:
                raw=r.read(); print('HTTP',r.status,'bytes',len(raw),'type',r.headers.get('content-type'))
              d=json.loads(raw)
              print('keys', list(d)[:15])
              if 'groups' in d:
                rankings=(d.get('groups') or [{}])[0].get('ranking') or []
                print('ranking',len(rankings),'first',[(x.get('team') or {}).get('name') for x in rankings[:3]])
              if 'matchdays' in d:
                md=d.get('matchdays') or []
                print('matchdays',len(md),'current',[(x.get('id'),x.get('name'),x.get('isCurrentMatchday')) for x in md if x.get('isCurrentMatchday')][:3])
            except Exception as e:
              print('ERROR',type(e).__name__,str(e))
