name: Apply CSP polish

on:
  push:
    paths:
      - tools/apply_csp_polish.py
      - .github/workflows/apply-csp-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Externalize page scripts and enable CSP
        run: python3 tools/apply_csp_polish.py
      - name: Remove one-time helpers
        run: rm -f tools/apply_csp_polish.py tools/apply_release_polish.py .github/workflows/apply-csp-polish.yml .github/workflows/apply-release-polish.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enable CSP and externalize page scripts"
          for attempt in 1 2 3; do
            git pull --rebase origin Master && git push origin HEAD:Master && exit 0
            sleep 3
          done
          exit 1
