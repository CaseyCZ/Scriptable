name: Build Homebridge Status package

on:
  push:
    branches: [Master]
    paths:
      - 'apps/Homebridge-Status/Homebridge Status.js'
      - '.github/scripts/build_homebridge_status_package.py'
      - '.github/workflows/build-homebridge-status-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Apply v0.1.12 Small padding fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/Homebridge-Status/Homebridge Status.js')
          s=p.read_text(encoding='utf-8')
          if 'const APP_VERSION = "0.1.12";' not in s:
              s=s.replace('// Homebridge Status v0.1.11','// Homebridge Status v0.1.12',1)
              s=s.replace('const APP_VERSION = "0.1.11";','const APP_VERSION = "0.1.12";',1)
              old='w.setPadding(14,16,11,16);addHeader(w,s,c,snap,13)'
              new='w.setPadding(14,10,11,10);addHeader(w,s,c,snap,13)'
              if old not in s: raise SystemExit('Small outer padding marker not found')
              s=s.replace(old,new,1)
              old='panel.cornerRadius=12;panel.setPadding(7,8,7,8);'
              new='panel.cornerRadius=12;panel.setPadding(7,4,7,4);'
              if old not in s: raise SystemExit('Small panel padding marker not found')
              s=s.replace(old,new,1)
              old='metricRow.addSpacer(8);addText(metricRow,`RAM ${fmt(ramUsed(snap))}%`'
              new='metricRow.addSpacer(4);addText(metricRow,`RAM ${fmt(ramUsed(snap))}%`'
              if old not in s: raise SystemExit('Small CPU/RAM spacer marker not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          cp 'apps/Homebridge-Status/Homebridge Status.js' /tmp/HomebridgeStatus.mjs
          node --check /tmp/HomebridgeStatus.mjs

      - name: Build package and sync website
        run: python .github/scripts/build_homebridge_status_package.py

      - name: Validate package parity
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          app=Path('apps/Homebridge-Status')
          src=(app/'Homebridge Status.js').read_text(encoding='utf-8')
          pkg=json.loads((app/'Homebridge Status.scriptable').read_text(encoding='utf-8'))
          site=Path('index.html').read_text(encoding='utf-8')
          vm=re.search(r'const APP_VERSION\s*=\s*"([^"]+)"',src)
          assert vm and vm.group(1)=='0.1.12'
          assert pkg['script']==src
          assert "{name:'Homebridge Status'" not in site
          assert 'w.setPadding(14,10,11,10)' in src
          assert 'panel.setPadding(7,4,7,4)' in src
          assert 'metricRow.addSpacer(4);addText(metricRow,`RAM ${fmt(ramUsed(snap))}%`' in src
          assert 'w.setPadding(11,10,9,10)' in src, 'Medium changed unexpectedly'
          assert 'w.setPadding(18,26,15,26)' in src, 'Large changed unexpectedly'
          print('Homebridge Status v0.1.12: Small padding reduced')
          PY

      - name: Commit synchronized release files
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add \
            'apps/Homebridge-Status/Homebridge Status.js' \
            'apps/Homebridge-Status/Homebridge Status.scriptable' \
            index.html
          if git diff --cached --quiet; then
            echo "Homebridge Status release surfaces already synchronized"
            exit 0
          fi
          git commit -m "Fix Homebridge Status Small padding"
          git push origin HEAD:Master
