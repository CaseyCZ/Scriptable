name: Patch Sports Info 2.6.0 once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/patch-sports-info-260-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Apply Sports Info 2.6.0 fluid layout patch
        run: python .github/scripts/patch_sports_info_260.py

      - name: Syntax check
        run: node --check 'apps/Sports-Info/Sports Info.js'

      - name: Synchronize package and release metadata
        run: python .github/scripts/build_sports_info_package.py

      - name: Validate fluid layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          src = Path('apps/Sports-Info/Sports Info.js').read_text(encoding='utf-8')
          pkg = json.loads(Path('apps/Sports-Info/Sports Info.scriptable').read_text(encoding='utf-8'))
          assert 'const APP_VERSION = "2.6.0";' in src
          assert 'function dynamicTableLayout(rows,cols)' in src
          assert 'const TOTAL=300' not in src
          assert 'teamW=106' not in src
          assert 'rowW=284' not in src
          assert 'await teamCell(r,e.home,s,p,family,false,0)' in src
          assert 'scoreW=clamp(tableTextWidth(scoreText,scoreSize,true)' in src
          assert 'dateW=clamp(tableTextWidth(dateText,9,true)' in src
          assert 'const hs=h.addStack();hs.layoutHorizontally();hs.size=new Size(statsWidth,0)' in src
          assert 'const rs=r.addStack();rs.layoutHorizontally();rs.size=new Size(statsWidth,0)' in src
          assert 'football:[["team","TÝM"]' in src
          assert 'hockey:[["team","TÝM"]' in src
          assert 'basketball:[["team","TÝM"]' in src
          assert 'floorball:[["team","TÝM"]' in src
          assert 'baseball:[["team","TÝM"]' in src
          assert pkg['script'] == src
          assert "Sports Info',version:'2.6.0'" in Path('index.html').read_text(encoding='utf-8')
          print('Sports Info 2.6.0 fluid layout validation OK')
          PY

      - name: Commit release
        run: |
          git config user.name 'CaseyCZ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'apps/Sports-Info/Sports Info.js' 'apps/Sports-Info/Sports Info.scriptable' 'apps/Sports-Info/README.md' README.md index.html
          git commit -m 'Sports Info 2.6.0 make layout content-driven across all sports'
          git push origin Master
