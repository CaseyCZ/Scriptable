name: Build Sports Info 2.5.15 layout once

on:
  push:
    branches: [fix/sports-info-2.5.15-per-size-layout]
    paths:
      - '.github/workflows/build-sports-info-2515-layout-once.yml'
      - '.github/scripts/patch_sports_info_2515_layout.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sports-info-2.5.15-per-size-layout
          fetch-depth: 0

      - name: Patch Sports Info
        run: python .github/scripts/patch_sports_info_2515_layout.py

      - name: Validate JavaScript syntax
        run: node --check 'apps/Sports-Info/Sports Info.js'

      - name: Rebuild package and release metadata
        run: python .github/scripts/build_sports_info_package.py

      - name: Validate release
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          src=Path('apps/Sports-Info/Sports Info.js').read_text(encoding='utf-8')
          pkg=json.loads(Path('apps/Sports-Info/Sports Info.scriptable').read_text(encoding='utf-8'))
          app_readme=Path('apps/Sports-Info/README.md').read_text(encoding='utf-8')
          root=Path('README.md').read_text(encoding='utf-8')
          site=Path('index.html').read_text(encoding='utf-8')
          assert 'const APP_VERSION = "2.5.15";' in src
          assert 'const LAYOUT_DEFAULTS=' in src
          assert 'small:{teamWidth:64' in src
          assert 'medium:{teamWidth:128' in src
          assert 'large:{teamWidth:128' in src
          assert 'function tableSlotLayout' in src
          assert 'tableWideWidth:30' in src and 'tableNarrowWidth:23' in src
          assert 'id="layoutSmall"' in src and 'id="layoutMedium"' in src and 'id="layoutLarge"' in src
          assert pkg['name']=='Sports Info' and pkg['script']==src
          assert '**Sports Info v2.5.15 — Production**' in app_readme
          assert '| 🏆 **Sports Info** | ✅ v2.5.15 |' in root
          assert "{name:'Sports Info',version:'2.5.15'" in site
          for sport in ['football','hockey','basketball','floorball','baseball']:
              assert f'{sport}:[[' in src
          print('Sports Info 2.5.15 layout release validated')
          PY

      - name: Commit complete 2.5.15 version
        run: |
          git config user.name 'CaseyCZ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'apps/Sports-Info/Sports Info.js' 'apps/Sports-Info/Sports Info.scriptable' 'apps/Sports-Info/README.md' README.md index.html
          git commit -m 'Build Sports Info 2.5.15 per-size layout'
          git push origin HEAD:fix/sports-info-2.5.15-per-size-layout
