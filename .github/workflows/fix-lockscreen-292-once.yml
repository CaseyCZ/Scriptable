name: Fix LockScreen Generator v2.9.2 once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/fix-lockscreen-292-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Patch LockScreen Generator
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('apps/LockScreenGenerator/LockScreenGenerator.js')
          js = js_path.read_text(encoding='utf-8')

          old = '${repr(PHONE_TEXT.loading)}'
          new = '${JSON.stringify(PHONE_TEXT.loading)}'
          if old not in js:
              raise SystemExit('repr bug marker not found')
          js = js.replace(old, new, 1)

          old_ver = 'const APP_VERSION = "2.9.1";'
          new_ver = 'const APP_VERSION = "2.9.2";'
          if old_ver not in js:
              raise SystemExit('2.9.1 version marker not found')
          js = js.replace(old_ver, new_ver, 1)
          js_path.write_text(js, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = "{name:'LockScreen Generator',version:'2.9.1'"
          if marker not in text:
              raise SystemExit('index LockScreen 2.9.1 marker not found')
          text = text.replace(marker, "{name:'LockScreen Generator',version:'2.9.2'", 1)
          index.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          if 'LockScreen Generator** | ✅ v2.9.1' not in text:
              raise SystemExit('root README version marker not found')
          text = text.replace('LockScreen Generator** | ✅ v2.9.1', 'LockScreen Generator** | ✅ v2.9.2', 1)
          readme.write_text(text, encoding='utf-8')

          app_readme = Path('apps/LockScreenGenerator/README.md')
          text = app_readme.read_text(encoding='utf-8')
          if 'version-2.9.1-0284c7' not in text:
              raise SystemExit('app README version marker not found')
          text = text.replace('version-2.9.1-0284c7', 'version-2.9.2-0284c7', 1)
          app_readme.write_text(text, encoding='utf-8')
          PY

      - name: Build install package
        run: python .github/scripts/build_scriptable_package.py

      - name: Validate source and package
        run: |
          node --check 'apps/LockScreenGenerator/LockScreenGenerator.js'
          python - <<'PY'
          import json
          from pathlib import Path
          app = Path('apps/LockScreenGenerator')
          src = (app/'LockScreenGenerator.js').read_text(encoding='utf-8')
          pkg = json.loads((app/'LockScreenGenerator.scriptable').read_text(encoding='utf-8'))
          assert 'const APP_VERSION = "2.9.2";' in src
          assert '${repr(PHONE_TEXT.loading)}' not in src
          assert pkg['script'] == src
          Path('/tmp/LockScreenGenerator-from-package.js').write_text(pkg['script'], encoding='utf-8')
          print('LockScreen v2.9.2 package OK')
          PY
          node --check '/tmp/LockScreenGenerator-from-package.js'

      - name: Commit fix
        run: |
          git config user.name "CaseyCZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/LockScreenGenerator/LockScreenGenerator.js apps/LockScreenGenerator/LockScreenGenerator.scriptable apps/LockScreenGenerator/README.md README.md index.html
          git commit -m "LockScreen Generator v2.9.2 fix settings source loader"
          git push origin HEAD:Master
