name: Add community status UI

on:
  push:
    paths:
      - '.github/workflows/add-community-status-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Add Online Offline UI
        run: |
          python3 <<'PY'
          from pathlib import Path

          path=Path('index.html')
          text=path.read_text(encoding='utf-8')

          if '.communityAvailability{' not in text:
              css=(
                  '.communityAvailability{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:3px 7px;border:1px solid var(--border);border-radius:999px;font-size:9px;font-weight:850;width:max-content;max-width:100%}'
                  '.communityAvailability.online{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--border));background:color-mix(in srgb,var(--ok) 10%,transparent)}'
                  '.communityAvailability.offline{color:#f87171;border-color:color-mix(in srgb,#ef4444 45%,var(--border));background:color-mix(in srgb,#ef4444 9%,transparent)}'
                  '.communityAvailability.checking{color:var(--muted)}'
                  '.communityHealth{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}'
                  '.communityHealth .communityAvailability{margin:0}'
                  '.communityChecked{color:var(--muted);font-size:10px;margin-left:2px}'
              )
              needle='.tags{display:flex'
              if needle not in text: raise SystemExit('CSS insertion point missing')
              text=text.replace(needle,css+needle,1)

          if 'id="communityHealth"' not in text:
              section=text.index('<section id="community">')
              needle='<div class="catalogBar">'
              pos=text.index(needle,section)
              text=text[:pos]+'<div id="communityHealth" class="communityHealth" aria-live="polite"></div>\n        '+text[pos:]

          marker='communityApps.push(...(window.communityExtraApps||[]));'
          if 'function communityStatusBadge(app)' not in text:
              if marker not in text: raise SystemExit('communityApps marker missing')
              block=(
                  "\n\n    let communityStatus={generatedAt:null,total:0,online:0,offline:0,items:{}};\n"
                  "    function communityStatusFor(app){return communityStatus?.items?.[app.file]||null}\n"
                  "    function communityStatusBadge(app){const item=communityStatusFor(app);if(item?.online===true)return `<span class=\"communityAvailability online\">● Online</span>`;if(item?.checkedAt)return `<span class=\"communityAvailability offline\">● Offline</span>`;return `<span class=\"communityAvailability checking\">● ${tr('Čeká na kontrolu','Checking')}</span>`}\n"
                  "    function renderCommunityHealth(){const host=document.getElementById('communityHealth');if(!host)return;const online=Number.isFinite(communityStatus.online)?communityStatus.online:0;const offline=Number.isFinite(communityStatus.offline)?communityStatus.offline:0;const checked=online+offline;let stamp='';if(communityStatus.generatedAt){const date=new Date(communityStatus.generatedAt);if(!Number.isNaN(date.getTime())){const locale={cs:'cs-CZ',en:'en-GB',de:'de-DE',es:'es-ES',fr:'fr-FR'}[lang]||'en-GB';stamp=new Intl.DateTimeFormat(locale,{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(date)}}host.innerHTML=checked?`<span class=\"communityAvailability online\">● Online ${online}</span><span class=\"communityAvailability offline\">● Offline ${offline}</span>${stamp?`<span class=\"communityChecked\">${tr('Poslední kontrola','Last checked')}: ${stamp}</span>`:''}`:`<span class=\"communityAvailability checking\">● ${tr('Čeká na kontrolu','Checking')}</span>`}\n"
                  "    async function loadCommunityStatus(){try{const response=await fetch('./data/community-status.json',{cache:'no-store'});if(response.ok){const data=await response.json();if(data&&typeof data==='object')communityStatus=data}}catch(_){}renderAll()}\n"
              )
              text=text.replace(marker,marker+block,1)

          if "const availability=external?communityStatusBadge(app):'';" not in text:
              needle='const actions=external?'
              if needle not in text: raise SystemExit('card actions marker missing')
              text=text.replace(needle,"const availability=external?communityStatusBadge(app):'';const actions=external?",1)

          if '${author}${availability}' not in text:
              needle='${author}</div></div><div class="tags">'
              if needle not in text: raise SystemExit('card author marker missing')
              text=text.replace(needle,'${author}${availability}</div></div><div class="tags">',1)

          if 'renderCommunity();renderCommunityHealth()' not in text:
              needle='updateCommunityCount();renderCommunity()}'
              if needle not in text: raise SystemExit('renderAll marker missing')
              text=text.replace(needle,'updateCommunityCount();renderCommunity();renderCommunityHealth()}',1)

          if '\n    loadCommunityStatus();\n' not in text:
              pos=text.rfind('</script>')
              if pos < 0: raise SystemExit('closing script missing')
              text=text[:pos]+'    loadCommunityStatus();\n  '+text[pos:]

          path.write_text(text,encoding='utf-8')
          PY

          python tools/update_community_status.py

          python3 <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          start=text.index('<script>\n    const PAGE_SIZE=20;')+len('<script>\n')
          end=text.index('</script>',start)
          Path('/tmp/scriptable-site.js').write_text(text[start:end],encoding='utf-8')
          assert 'communityAvailability online' in text
          assert 'communityAvailability offline' in text
          assert "fetch('./data/community-status.json'" in text
          assert 'renderCommunityHealth()' in text
          PY
          node --check /tmp/scriptable-site.js

      - name: Commit status UI
        run: |
          git config user.name 'CaseyCZ'
          git config user.email '25530709+CaseyCZ@users.noreply.github.com'
          git rm .github/workflows/add-community-status-ui.yml
          git add index.html data/community-status.json
          git commit -m 'Show community project availability'
          git push origin Master
