name: Temporary Sideload Watch demo updates

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/zz-temp-sideload-demo-updates.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master

      - name: Patch Sideload Watch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          app=Path('apps/Sideload-Watch')
          p=app/'Sideload Watch.js'
          s=p.read_text(encoding='utf-8')

          s=s.replace('// Sideload Watch v0.2.24','// Sideload Watch v0.2.25',1)
          s=s.replace('const APP_VERSION = "0.2.24";','const APP_VERSION = "0.2.25";',1)

          repl={
            'widgetPreview:"Náhled",realPreview:"Reálná data",demoPreview:"Demo vzhledu",':'widgetPreview:"Náhled",realPreview:"Reálná data",demoPreview:"Demo vzhledu",demoUpdates:"Demo aktualizací",',
            'widgetPreview:"Preview",realPreview:"Live data",demoPreview:"Appearance demo",':'widgetPreview:"Preview",realPreview:"Live data",demoPreview:"Appearance demo",demoUpdates:"Updates demo",',
            'widgetPreview:"Vorschau",realPreview:"Echte Daten",demoPreview:"Design-Demo",':'widgetPreview:"Vorschau",realPreview:"Echte Daten",demoPreview:"Design-Demo",demoUpdates:"Update-Demo",',
            'widgetPreview:"Vista previa",realPreview:"Datos reales",demoPreview:"Demo de diseño",':'widgetPreview:"Vista previa",realPreview:"Datos reales",demoPreview:"Demo de diseño",demoUpdates:"Demo de actualizaciones",'
          }
          for old,new in repl.items():
            if old not in s:
              raise SystemExit(f'missing translation marker: {old}')
            s=s.replace(old,new,1)

          old='''  <div class="sectionTitle">${esc(L.demoPreview)}</div>\n  <div class="previewGrid"><button class="previewBtn" onclick="preview('small',true)">${esc(L.small)}</button><button class="previewBtn" onclick="preview('medium',true)">${esc(L.medium)}</button><button class="previewBtn" onclick="preview('large',true)">${esc(L.large)}</button></div>'''
          new='''  <div class="sectionTitle">${esc(L.demoPreview)}</div>\n  <div class="previewGrid"><button class="previewBtn" onclick="preview('small','summary')">${esc(L.small)}</button><button class="previewBtn" onclick="preview('medium','summary')">${esc(L.medium)}</button><button class="previewBtn" onclick="preview('large','summary')">${esc(L.large)}</button></div>\n  <div class="sectionTitle">${esc(L.demoUpdates)}</div>\n  <div class="previewGrid"><button class="previewBtn" onclick="preview('small','updates')">${esc(L.small)}</button><button class="previewBtn" onclick="preview('medium','updates')">${esc(L.medium)}</button><button class="previewBtn" onclick="preview('large','updates')">${esc(L.large)}</button></div>'''
          if old not in s:
            raise SystemExit('preview demo buttons marker missing')
          s=s.replace(old,new,1)

          old='function demoStatus(settings){\n  const state=loadState();'
          new='''function demoStatus(settings,mode="summary"){\n  const state=loadState();\n  if(mode==="updates"){\n    const watched=Array.isArray(settings?.watched)?settings.watched:[];\n    const fallback=[\n      {name:"LiveContainer",version:"3.4.1"},\n      {name:"Stremio",version:"2.1.0"},\n      {name:"Provenance Emulator",version:"3.5.0"}\n    ];\n    const updates=(watched.length?watched.slice(0,3).map((item,i)=>{\n      const prev=state.lastCurrent?.[watchKey(item)]||{};\n      return{name:item.name||fallback[i]?.name||`App ${i+1}`,version:String(prev.version||fallback[i]?.version||"1.0")};\n    }):fallback);\n    return{updates,total:updates.length,current:[],checkedAt:new Date(),offline:false,cached:false,cacheOnly:false,failedSources:[],failedSourceIds:[],demo:true}\n  }'''
          if old not in s:
            raise SystemExit('demoStatus function marker missing')
          s=s.replace(old,new,1)

          old='const status=m.demo?demoStatus(cur):await getLiveStatus(cur),w=await buildWidget(status,cur,family);'
          new='const status=m.demo?demoStatus(cur,m.demo):await getLiveStatus(cur),w=await buildWidget(status,cur,family);'
          if old not in s:
            raise SystemExit('preview native demo marker missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          (app/'version.json').write_text(json.dumps({'version':'0.2.25'},indent=2)+'\n',encoding='utf-8')

          pkg_path=app/'Sideload Watch.scriptable'
          if pkg_path.exists():
              pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
              pkg['script']=s
              pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate
        run: |
          cp 'apps/Sideload-Watch/Sideload Watch.js' /tmp/sideload.mjs
          node --check /tmp/sideload.mjs
          grep -q 'const APP_VERSION = "0.2.25";' 'apps/Sideload-Watch/Sideload Watch.js'
          grep -q 'demoUpdates:"Demo aktualizací"' 'apps/Sideload-Watch/Sideload Watch.js'
          grep -q "preview('medium','updates')" 'apps/Sideload-Watch/Sideload Watch.js'
          grep -q 'function demoStatus(settings,mode="summary")' 'apps/Sideload-Watch/Sideload Watch.js'
          grep -q 'demoStatus(cur,m.demo)' 'apps/Sideload-Watch/Sideload Watch.js'

      - name: Commit app files
        run: |
          git config user.name 'CaseyCZ'
          git config user.email '25530709+CaseyCZ@users.noreply.github.com'
          git add 'apps/Sideload-Watch/Sideload Watch.js' 'apps/Sideload-Watch/version.json' 'apps/Sideload-Watch/Sideload Watch.scriptable'
          git commit -m 'Add Sideload Watch update demo previews'
          git push origin HEAD:Master
