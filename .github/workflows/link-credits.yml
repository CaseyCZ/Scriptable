name: Link Credits across Scriptable site
on:
  push:
    branches: [Master]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
      - name: Add Credits navigation and documentation links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html'); s=p.read_text()
          marker='        <a href="https://scriptable.app" target="_blank" rel="noopener">Scriptable</a>'
          insert='        <a href="guide.html"><span data-cs="Průvodce" data-en="Guide" data-de="Anleitung" data-es="Guía" data-fr="Guide">Průvodce</span></a>\n        <a href="credits.html">Credits</a>\n'+marker
          if 'href="credits.html">Credits</a>' not in s.split('</nav>',1)[0]:
              s=s.replace(marker,insert,1)
          s=s.replace('<a href="guide.html">Guide</a>\n          <a href="CHANGELOG.md">Changelog</a>','<a href="guide.html">Guide</a>\n          <a href="credits.html">Credits</a>\n          <a href="CHANGELOG.md">Changelog</a>',1)
          p.write_text(s)

          p=Path('guide.html'); s=p.read_text()
          marker='        <a href="https://scriptable.app" target="_blank" rel="noopener">Scriptable</a>'
          insert='        <a href="guide.html" aria-current="page"><span data-cs="Průvodce" data-en="Guide" data-de="Anleitung" data-es="Guía" data-fr="Guide">Průvodce</span></a>\n        <a href="credits.html">Credits</a>\n'+marker
          if 'href="credits.html">Credits</a>' not in s.split('</nav>',1)[0]:
              s=s.replace(marker,insert,1)
          s=s.replace('<a href="guide.html">Guide</a><a href="CHANGELOG.md">Changelog</a>','<a href="guide.html">Guide</a><a href="credits.html">Credits</a><a href="CHANGELOG.md">Changelog</a>',1)
          p.write_text(s)

          p=Path('credits.html'); s=p.read_text()
          if '<a href="https://scriptable.app" target="_blank" rel="noopener">Scriptable</a>' not in s.split('</nav>',1)[0]:
              s=s.replace('      <a href="credits.html" aria-current="page">Credits</a>','      <a href="credits.html" aria-current="page">Credits</a>\n      <a href="https://scriptable.app" target="_blank" rel="noopener">Scriptable</a>',1)
          p.write_text(s)

          for name,label in [('README.md','- 🙏 [Credits & poděkování](https://caseycz.github.io/Scriptable/credits.html)'),('README_EN.md','- 🙏 [Credits & acknowledgements](https://caseycz.github.io/Scriptable/credits.html)')]:
              p=Path(name); s=p.read_text()
              guide='- 📘 [Jak začít](https://caseycz.github.io/Scriptable/guide.html)' if name=='README.md' else '- 📘 [Getting started](https://caseycz.github.io/Scriptable/guide.html)'
              if label not in s:
                  s=s.replace(guide,guide+'\n'+label,1)
              p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          node tools/build-credits.cjs
          test -s data/credits.json
          git rm .github/workflows/link-credits.yml
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add index.html guide.html credits.html README.md README_EN.md data/credits.json
          git commit -m "Add Credits navigation and generated acknowledgements"
          git push origin Master
