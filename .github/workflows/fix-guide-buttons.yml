name: Fix Guide button styles

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/fix-guide-buttons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Add shared button styles to Guide
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('guide.html')
          s=p.read_text()
          marker='.guide-back .btn{min-width:160px}'
          css='''.btn{min-height:38px;border-radius:10px;border:1px solid var(--border);padding:0 11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:850;cursor:pointer;transition:.15s ease}.btn:hover{transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));border-color:var(--accent);color:#fff}.btn.secondary{background:var(--panel2);color:var(--text)}'''
          if css not in s:
              if marker not in s:
                  raise SystemExit('Guide CSS marker not found')
              s=s.replace(marker, marker+'\n'+css, 1)
          p.write_text(s)
          PY
          grep -F '.btn.primary{background:linear-gradient' guide.html
          grep -F 'class="btn secondary" href="./"' guide.html
          grep -F 'class="btn primary" href="https://apps.apple.com/app/scriptable/id1405459188"' guide.html

      - name: Commit fix and clean temporary workflow
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          rm .github/workflows/fix-guide-buttons.yml
          git add guide.html .github/workflows/fix-guide-buttons.yml
          git commit -m "Style Guide navigation and App Store buttons"
          git push origin HEAD:Master
