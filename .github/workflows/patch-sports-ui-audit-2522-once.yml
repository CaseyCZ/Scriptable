name: Patch Sports Info 2.5.22 UI audit fixes once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/patch-sports-ui-audit-2522-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Apply Sports Info 2.5.22 fixes
        run: python .github/scripts/patch_sports_ui_audit_2522_once.py

      - name: Validate outer Scriptable JavaScript
        run: |
          cp 'apps/Sports-Info/Sports Info.js' /tmp/SportsInfo.mjs
          node --check /tmp/SportsInfo.mjs

      - name: Build package and release surfaces
        run: python .github/scripts/build_sports_info_package.py

      - name: Render and validate settings UI JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('apps/Sports-Info/Sports Info.js','utf8');
          const marker='let SETTINGS=await firstLanguage(loadSettings());';
          const i=src.indexOf(marker); if(i<0)throw new Error('main marker missing');
          const fm={documentsDirectory:()=>'/tmp',cacheDirectory:()=>'/tmp',joinPath:(a,b)=>a+'/'+b,fileExists:()=>false,readString:()=>'',writeString:()=>{},remove:()=>{},readImage:()=>null,writeImage:()=>{},listContents:()=>[]};
          const ctx={console,FileManager:{local:()=>fm,iCloud:()=>fm},Device:{locale:()=> 'cs-CZ',isUsingDarkAppearance:()=>true},config:{runsInWidget:false},args:{queryParameters:{}},module:{filename:'/tmp/Sports Info.js'}};
          vm.createContext(ctx);
          vm.runInContext(src.slice(0,i)+'\nglobalThis.__AUDIT_HTML=html(merge({...DEFAULTS,language:"cs"}));',ctx);
          fs.writeFileSync('/tmp/sports-settings.html',ctx.__AUDIT_HTML);
          const m=ctx.__AUDIT_HTML.match(/<script>([\s\S]*?)<\/script>/); if(!m)throw new Error('settings script missing');
          fs.writeFileSync('/tmp/sports-settings-ui.js',m[1]);
          NODE
          node --check /tmp/sports-settings-ui.js

      - name: Validate 2.5.22 behavior
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          app=Path('apps/Sports-Info')
          src=(app/'Sports Info.js').read_text(encoding='utf-8')
          pkg=json.loads((app/'Sports Info.scriptable').read_text(encoding='utf-8'))
          assert 'const APP_VERSION = "2.5.22";' in src
          assert pkg['script']==src
          assert "document.querySelectorAll('.previewBtn').forEach(b=>b.disabled=true)" not in src
          assert "function preview(f){state=commitNow();emit('preview'" in src
          assert "state=commitNow();const st=document.getElementById('widgetPresetStatus')" in src
          assert 'cur=merge(m.settings||cur);const l=cur.language||lang()' in src
          assert 'for(const name of fm.listContents(dir))if(name==CACHE_FILE||name.startsWith("SportsInfo_"))' in src
          assert '**Sports Info v2.5.22 — Production**' in (app/'README.md').read_text(encoding='utf-8')
          assert '| 🏆 **Sports Info** | ✅ v2.5.22 |' in Path('README.md').read_text(encoding='utf-8')
          assert "{name:'Sports Info',version:'2.5.22'" in Path('index.html').read_text(encoding='utf-8')
          print('Sports Info 2.5.22 UI audit fixes validated')
          PY

      - name: Run full UI wiring audit
        run: python .github/scripts/audit_sports_info_ui_2521.py

      - name: Commit release
        run: |
          git config user.name "CaseyCZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            'apps/Sports-Info/Sports Info.js' \
            'apps/Sports-Info/Sports Info.scriptable' \
            'apps/Sports-Info/README.md' \
            'README.md' \
            'index.html'
          git commit -m "Sports Info 2.5.22 fix audited UI controls"
          git push origin HEAD:Master
