name: Use widget images once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/use-widget-images-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Use renamed screenshots on website
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/js/index-page.js')
          s = p.read_text(encoding='utf-8')
          old1 = "{name:'Sports Live',version:'0.3.3',icon:'🔴',file:'./apps/Sports-Live/Sports-Live%2Cjs',install:'./apps/Sports-Live/Sports%20Live.scriptable',preview:'./readme-header.svg'"
          new1 = "{name:'Sports Live',version:'0.3.3',icon:'🔴',file:'./apps/Sports-Live/Sports-Live%2Cjs',install:'./apps/Sports-Live/Sports%20Live.scriptable',preview:'./apps/Sports-Live/Sports%20Live.jpg'"
          old2 = "{name:'Homebridge Status',version:'0.1.13',icon:'🌉',file:'./apps/Homebridge-Status/Homebridge%20Status.js',install:'./apps/Homebridge-Status/Homebridge%20Status.scriptable',preview:'./readme-header.svg'"
          new2 = "{name:'Homebridge Status',version:'0.1.13',icon:'🌉',file:'./apps/Homebridge-Status/Homebridge%20Status.js',install:'./apps/Homebridge-Status/Homebridge%20Status.scriptable',preview:'./apps/Homebridge-Status/Homebridge%20Status.jpg'"
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected first-party entries not found')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node tools/audit-community-catalog.cjs
          node tools/audit-web-csp.cjs
          rm .github/workflows/use-widget-images-once.yml
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add -A
          git commit -m "Use widget screenshots on website"
          git push origin HEAD:Master
