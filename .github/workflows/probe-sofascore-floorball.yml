name: Probe SofaScore floorball API

on:
  push:
    paths:
      - '.github/workflows/probe-sofascore-floorball.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Livesport parser
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'
          for pair in \
            'https://www.livesport.com/floorball/czech-republic/livesport-superliga/|/tmp/base.html' \
            'https://www.livesport.com/floorball/czech-republic/livesport-superliga/standings/|/tmp/standings.html'; do
            url=${pair%%|*}; out=${pair#*|}
            curl -sS -L \
              -H "User-Agent: $UA" \
              -H 'Accept: text/html,application/xhtml+xml,*/*;q=0.8' \
              -H 'Accept-Language: en-US,en;q=0.9,cs;q=0.8' \
              -H 'Referer: https://www.livesport.com/' \
              "$url" -o "$out"
          done
          python3 - <<'PY'
          import re
          from pathlib import Path

          def feed(html,name):
              m=re.search(r'cjs\.initialFeeds\["'+re.escape(name)+r'"\]\s*=\s*\{\s*data:\s*`([\s\S]*?)`',html)
              return m.group(1) if m else ''
          def fields(rec):
              out={}
              for part in rec.split('¬'):
                  i=part.find('÷')
                  if i>0: out[part[:i]]=part[i+1:]
              return out
          def events(f):
              out=[]
              for tail in f.split('¬~AA÷')[1:]:
                  x=fields('AA÷'+tail)
                  if x.get('AA') and x.get('AD') and x.get('AE') and x.get('AF'):
                      out.append((x.get('AA'),x.get('AE'),x.get('AF'),x.get('AG'),x.get('AH')))
              return out
          def allfeeds(html):
              return re.findall(r'cjs\.initialFeeds\["([^"]+)"\]\s*=\s*\{\s*data:\s*`([\s\S]*?)`',html)
          def rows(f):
              out=[]; seen=set()
              for raw in f.split('~'):
                  x=fields(raw)
                  if not x.get('TI') or not x.get('TN') or x['TI'] in seen: continue
                  seen.add(x['TI']); out.append((x.get('TR'),x.get('TI'),x.get('TN'),x.get('TM'),x.get('TW'),x.get('TL'),x.get('TP'),x.get('TG')))
              return out

          base=Path('/tmp/base.html').read_text('utf-8','ignore')
          stand=Path('/tmp/standings.html').read_text('utf-8','ignore')
          r=events(feed(base,'summary-results'))
          f=events(feed(base,'summary-fixtures'))
          candidates=[]
          for name,data in allfeeds(stand):
              q=rows(data)
              if q: candidates.append((name,q))
          print('RESULT EVENTS',len(r),r[:3])
          print('FIXTURE EVENTS',len(f),f[:3])
          print('TABLE FEEDS',[(name,len(q)) for name,q in candidates])
          if candidates:
              name,q=max(candidates,key=lambda x:len(x[1]))
              print('BEST TABLE',name,len(q),q[:16])
          if not r and not f: raise SystemExit('No events parsed')
          if not candidates: raise SystemExit('No standings rows parsed')
          PY
