name: Apply iOS Hub mobile menu

on:
  push:
    branches: [Master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Apply mobile menu
        run: python3 tools/apply_ioshub_mobile_menu.py
      - name: Validate catalog
        run: node tools/audit-community-catalog.cjs
      - name: Commit mobile menu
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git rm .github/workflows/apply-ioshub-mobile-menu.yml tools/apply_ioshub_mobile_menu.py
          git add index.html guide.html credits.html ios-hub-visual.css mobile-menu.js
          git commit -m "Match mobile navigation to iOS Hub"
          git pull --rebase origin Master
          git push origin Master
