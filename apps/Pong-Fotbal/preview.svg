    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#092333"/><stop offset="1" stop-color="#08151f"/></linearGradient>
    <linearGradient id="pitch" x2="1" y2="1"><stop stop-color="#146944"/><stop offset="1" stop-color="#0e4f37"/></linearGradient>
    <linearGradient id="blue"><stop stop-color="#28cafa"/><stop offset="1" stop-color="#4fbaff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
