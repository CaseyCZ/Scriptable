name: Scriptable release readiness

on:
  push:
    branches: [Master]
    paths:
      - "tools/release_readiness_patch.py"
      - ".github/workflows/release-readiness.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Apply release readiness patch
        run: python tools/release_readiness_patch.py
      - name: Validate catalog
        run: |
          node --check community-extra.js
          node tools/audit-community-catalog.cjs
      - name: Commit release readiness changes
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add community-extra.js index.html README.md README_EN.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Prepare Scriptable Apps 1.0 public release"
          git push origin HEAD:Master
