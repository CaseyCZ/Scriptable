name: Patch Sports Info typography once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/patch-sports-info-typography-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sports-info-typography-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest Master
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Patch Sports Info typography
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/Sports-Info/Sports Info.js')
          s = path.read_text(encoding='utf-8')

          replacements = [
              ('// Sports Info v2.5.1', '// Sports Info v2.5.2'),
              ('const APP_VERSION = "2.5.1";', 'const APP_VERSION = "2.5.2";'),
              ('''function teamLabel(t,family){\n  const full=t.name||t.short||t.abbr||"";\n  if(family!=="small")return full;\n  return full.length<=18?full:(t.short||t.abbr||full)\n}''', '''function teamLabel(t,family){\n  const full=t.name||t.short||t.abbr||"";\n  if(family==="small")return full;\n  if(full.length<=22)return full;\n  const short=t.short&&t.short!==full?t.short:(t.abbr||full);\n  return short\n}'''),
              ('''  const z=txt(r,teamLabel(t,family),family==="small"?9:11,p.text,true);\n  if(family==="small"){z.lineLimit=2;z.minimumScaleFactor=.5}else z.minimumScaleFactor=.65;''', '''  const z=txt(r,teamLabel(t,family),family==="small"?9:11,p.text,true);\n  if(family==="small"){z.lineLimit=2;z.minimumScaleFactor=1}else{z.lineLimit=1;z.minimumScaleFactor=1}'''),
              ('const widths=family==="small"?[56,18,56]:[124,40,124];', 'const widths=family==="small"?[58,16,58]:[128,36,128];'),
              ('''function lineCell(parent,value,width,p,align="left",bold=false,size=10){const c=parent.addStack();c.layoutHorizontally();c.centerAlignContent();c.size=new Size(width,0);if(align==="right"||align==="center")c.addSpacer();const t=txt(c,value,size,p,bold);t.minimumScaleFactor=.62;if(align==="center"){t.centerAlignText();c.addSpacer()}else if(align==="left")c.addSpacer();return t}\nasync function line(parent,e,s,p,family="large"){const r=parent.addStack();r.layoutHorizontally();r.centerAlignContent();const dateW=45,teamW=family==="medium"?93:96,scoreW=43;lineCell(r,day(s,e.date),dateW,p.muted,"left",true,9);lineCell(r,teamLabel(e.home,family),teamW,p.text,"right",true,10);lineCell(r,score(e)==="–"?time(s,e.date):score(e),scoreW,e.state==="in"?p.live:p.text,"center",true,10);lineCell(r,teamLabel(e.away,family),teamW,p.text,"left",true,10)}''', '''function lineCell(parent,value,width,p,align="left",bold=false,size=10,minScale=.62){const c=parent.addStack();c.layoutHorizontally();c.centerAlignContent();c.size=new Size(width,0);if(align==="right"||align==="center")c.addSpacer();const t=txt(c,value,size,p,bold);t.minimumScaleFactor=minScale;if(align==="center"){t.centerAlignText();c.addSpacer()}else if(align==="left")c.addSpacer();return t}\nasync function line(parent,e,s,p,family="large"){const r=parent.addStack();r.layoutHorizontally();r.centerAlignContent();const dateW=40,teamW=113,scoreW=39;lineCell(r,day(s,e.date),dateW,p.muted,"left",true,9,.8);lineCell(r,teamLabel(e.home,family),teamW,p.text,"right",true,10,1);lineCell(r,score(e)==="–"?time(s,e.date):score(e),scoreW,e.state==="in"?p.live:p.text,"center",true,10,.85);lineCell(r,teamLabel(e.away,family),teamW,p.text,"left",true,10,1)}'''),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected source block not found:\n' + old[:180])
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          Path('.github/workflows/patch-sports-info-typography-once.yml').unlink()
          PY

      - name: Validate JavaScript
        run: |
          cp 'apps/Sports-Info/Sports Info.js' /tmp/SportsInfo.mjs
          node --check /tmp/SportsInfo.mjs

      - name: Sync package and release surfaces
        run: python .github/scripts/build_sports_info_package.py

      - name: Commit release
        run: |
          git config user.name "CaseyCZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Sports Info v2.5.2 consistent team typography"
          git push origin HEAD:Master

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload current site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy current Master content
        uses: actions/deploy-pages@v4
