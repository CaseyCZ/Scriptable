name: Patch Sports Info 2.5.21 logo cache once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/patch-sports-logo-cache-2521-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Apply Sports Info 2.5.21 patch
        run: python .github/scripts/patch_sports_logo_cache_2521_once.py

      - name: Validate JavaScript syntax
        run: |
          cp 'apps/Sports-Info/Sports Info.js' /tmp/SportsInfo.mjs
          node --check /tmp/SportsInfo.mjs

      - name: Build package and release surfaces
        run: python .github/scripts/build_sports_info_package.py

      - name: Validate Sports Info 2.5.21
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          app=Path('apps/Sports-Info')
          src=(app/'Sports Info.js').read_text(encoding='utf-8')
          pkg=json.loads((app/'Sports Info.scriptable').read_text(encoding='utf-8'))
          assert 'const APP_VERSION = "2.5.21";' in src
          assert pkg['script']==src
          assert 'function logoCachePath(url,key)' in src
          assert 'Math.imul(h,16777619)' in src
          assert 'SportsInfo_${safe}_${(h>>>0).toString(36)}.png' in src
          assert 'const p=logoCachePath(url,key)' in src
          assert 'SportsInfo_${String(key).replace' not in src
          assert '**Sports Info v2.5.21 — Production**' in (app/'README.md').read_text(encoding='utf-8')
          assert '| 🏆 **Sports Info** | ✅ v2.5.21 |' in Path('README.md').read_text(encoding='utf-8')
          assert "{name:'Sports Info',version:'2.5.21'" in Path('index.html').read_text(encoding='utf-8')
          print('Sports Info 2.5.21 logo cache validated')
          PY

      - name: Commit release
        run: |
          git config user.name "CaseyCZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            'apps/Sports-Info/Sports Info.js' \
            'apps/Sports-Info/Sports Info.scriptable' \
            'apps/Sports-Info/README.md' \
            'README.md' \
            'index.html'
          git commit -m "Sports Info 2.5.21 fix stale team logos"
          git push origin HEAD:Master
