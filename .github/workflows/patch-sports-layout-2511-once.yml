name: Patch Sports Info 2.5.11 table once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/patch-sports-layout-2511-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Apply table alignment patch
        run: python .github/scripts/patch_sports_layout_2511.py

      - name: Syntax check
        run: node --check 'apps/Sports-Info/Sports Info.js'

      - name: Synchronize package and release metadata
        run: python .github/scripts/build_sports_info_package.py

      - name: Validate release and table layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          src = Path('apps/Sports-Info/Sports Info.js').read_text(encoding='utf-8')
          pkg = json.loads(Path('apps/Sports-Info/Sports Info.scriptable').read_text(encoding='utf-8'))
          assert 'const APP_VERSION = "2.5.11";' in src
          assert pkg['script'] == src
          table = src[src.index('async function table('):src.index('function autoRefreshMinutes')]
          assert 'const t=txt(c,label,8,p.muted,true)' in table
          assert 'c.addSpacer(17)' not in table
          assert 'h.addSpacer();' in table
          assert 'r.addSpacer();' in table
          assert 'football:[["team","TÝM",116]' in src
          assert "Sports Info',version:'2.5.11'" in Path('index.html').read_text(encoding='utf-8')
          print('Sports Info 2.5.11 table validation OK')
          PY

      - name: Commit release
        run: |
          git config user.name 'CaseyCZ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'apps/Sports-Info/Sports Info.js' 'apps/Sports-Info/Sports Info.scriptable' 'apps/Sports-Info/README.md' README.md index.html
          git commit -m 'Sports Info 2.5.11 align table edges'
          git push origin Master
