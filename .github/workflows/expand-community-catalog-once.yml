name: Expand community catalog once
on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/expand-community-catalog-once.yml'
      - '.github/scripts/expand_community_catalog_once.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate catalog
        run: python .github/scripts/expand_community_catalog_once.py
      - name: Commit website integration
        run: |
          git config user.name "CaseyCZ automation"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Expand community catalog to 84 more apps"
          git push
