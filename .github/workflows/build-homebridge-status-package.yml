name: Build Homebridge Status package

on:
  push:
    branches: [Master]
    paths:
      - 'apps/Homebridge-Status/Homebridge Status.js'
      - '.github/scripts/build_homebridge_status_package.py'
      - '.github/workflows/build-homebridge-status-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Validate JavaScript syntax
        run: |
          cp 'apps/Homebridge-Status/Homebridge Status.js' /tmp/HomebridgeStatus.mjs
          node --check /tmp/HomebridgeStatus.mjs

      - name: Build package and synchronize catalog card
        run: python .github/scripts/build_homebridge_status_package.py

      - name: Sync README and version metadata
        run: python .github/scripts/sync_release_metadata.py

      - name: Validate package parity
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          app=Path('apps/Homebridge-Status')
          src=(app/'Homebridge Status.js').read_text(encoding='utf-8')
          pkg=json.loads((app/'Homebridge Status.scriptable').read_text(encoding='utf-8'))
          site=Path('assets/js/index-page.js').read_text(encoding='utf-8')
          vm=re.search(r'const APP_VERSION\s*=\s*"([^"]+)"',src)
          assert vm, 'APP_VERSION missing'
          version=vm.group(1)
          assert pkg['script']==src
          assert json.loads((app/'version.json').read_text(encoding='utf-8'))['version']==version
          assert f'v{version}' in (app/'README.md').read_text(encoding='utf-8')
          assert f'v{version}' in (app/'README_EN.md').read_text(encoding='utf-8')
          marker=f'<strong>Homebridge Status</strong></td><td><code>v{version}</code>'
          assert marker in Path('README.md').read_text(encoding='utf-8')
          assert marker in Path('README_EN.md').read_text(encoding='utf-8')
          assert f"{{name:'Homebridge Status',version:'{version}'" in site
          assert "install:'./apps/Homebridge-Status/Homebridge%20Status.scriptable'" in site
          assert 'w.setPadding(14,10,11,10)' in src, 'Small changed unexpectedly'
          assert 'w.setPadding(11,10,9,10)' in src, 'Medium changed unexpectedly'
          assert 'w.setPadding(18,30,15,30)' in src, 'Large center padding missing'
          assert 'addLargeCenteredStatus' in src
          assert 'addLargeDetailsPanel' in src
          assert 'addLargePairRow' in src
          assert '/api/status/network' in src and '/api/status/server-information' in src and '/api/status/homebridge/child-bridges' in src
          assert '/api/status/rpi/throttled' in src
          assert 'fallbackUrl' in src
          assert 'accessoryRectangular' in src and 'accessoryInline' in src and 'accessoryCircular' in src
          print(f'Homebridge Status v{version}: package and CZ/EN README metadata synchronized; catalog card synchronized')
          PY

      - name: Commit synchronized release files
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add \
            'apps/Homebridge-Status/Homebridge Status.scriptable' \
            README.md README_EN.md assets/js/index-page.js \
            apps/*/README.md apps/*/README_EN.md apps/*/version.json
          if git diff --cached --quiet; then
            echo "Homebridge Status release surfaces already synchronized"
            exit 0
          fi
          git commit -m "Sync Homebridge Status release surfaces"
          git push origin HEAD:Master
