name: Fix landscape navigation

on:
  push:
    branches: [Master]
    paths:
      - 'tools/fix_landscape_nav.py'
      - '.github/workflows/fix-landscape-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Apply landscape navigation fix
        run: python tools/fix_landscape_nav.py
      - name: Validate catalog
        run: node tools/audit-community-catalog.cjs
      - name: Commit and clean helper
        run: |
          rm -f tools/fix_landscape_nav.py .github/workflows/fix-landscape-nav.yml
          git config user.name CaseyCZ
          git config user.email 25530709+CaseyCZ@users.noreply.github.com
          git add index.html guide.html credits.html ios-hub-visual.css tools/fix_landscape_nav.py .github/workflows/fix-landscape-nav.yml
          git commit -m "Fix landscape navigation like iOS Hub"
          git pull --rebase origin Master
          git push origin HEAD:Master
