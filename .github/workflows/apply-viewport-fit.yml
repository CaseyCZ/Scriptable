name: Apply viewport-fit

on:
  push:
    branches: [Master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Match iOS Hub viewport
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('index.html'), Path('guide.html'), Path('credits.html')]
          old = 'content="width=device-width,initial-scale=1"'
          new = 'content="width=device-width,initial-scale=1,viewport-fit=cover"'
          for path in files:
              text = path.read_text()
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'viewport marker not found in {path}')
              path.write_text(text.replace(old, new, 1))
          PY
          grep -n 'viewport-fit=cover' index.html guide.html credits.html
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/apply-viewport-fit.yml
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add index.html guide.html credits.html .github/workflows/apply-viewport-fit.yml
          git commit -m "Match iOS Hub viewport behavior"
          git push origin Master
