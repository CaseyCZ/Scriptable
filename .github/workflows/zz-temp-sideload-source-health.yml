name: Temporary Sideload Watch v0.2.14 source health UI

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/zz-temp-sideload-source-health.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Patch Sideload Watch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          app=Path('apps/Sideload-Watch')
          p=app/'Sideload Watch.js'
          s=p.read_text(encoding='utf-8')
          if 'const APP_VERSION = "0.2.14";' not in s:
              s=s.replace('// Sideload Watch v0.2.13','// Sideload Watch v0.2.14',1)
              s=s.replace('const APP_VERSION = "0.2.13";','const APP_VERSION = "0.2.14";',1)

              # Track source IDs as well as display names for failed watched sources.
              s=s.replace('const current=[],failedSources=[];','const current=[],failedSources=[],failedSourceIds=[];',1)
              old='''      const [url,items]=entries[i];\n      const names=[...new Set(items.map(item=>state.lastCurrent[watchKey(item)]?.sourceName||item.sourceId||"").filter(Boolean))];'''
              new='''      const [url,items]=entries[i];\n      failedSourceIds.push(...items.map(item=>String(item.sourceId||"")).filter(Boolean));\n      const names=[...new Set(items.map(item=>state.lastCurrent[watchKey(item)]?.sourceName||item.sourceId||"").filter(Boolean))];'''
              if old not in s: raise SystemExit('failed source block marker missing')
              s=s.replace(old,new,1)
              old='''  const uniqueFailed=[...new Set(failedSources)];\n  const offline=uniqueFailed.length>0;\n  return{updates,total:updates.length,current,checkedAt:new Date(),offline,cached:offline,cacheOnly:false,failedSources:uniqueFailed}'''
              new='''  const uniqueFailed=[...new Set(failedSources)];\n  const uniqueFailedIds=[...new Set(failedSourceIds)];\n  const offline=uniqueFailed.length>0;\n  return{updates,total:updates.length,current,checkedAt:new Date(),offline,cached:offline,cacheOnly:false,failedSources:uniqueFailed,failedSourceIds:uniqueFailedIds}'''
              if old not in s: raise SystemExit('failed source return marker missing')
              s=s.replace(old,new,1)
              s=s.replace('offline:true,cached:true,cacheOnly:true,failedSources:[],error:error?String(error):null','offline:true,cached:true,cacheOnly:true,failedSources:[],failedSourceIds:[],error:error?String(error):null',1)
              s=s.replace('offline:false,cached:false,cacheOnly:false,failedSources:[],demo:true','offline:false,cached:false,cacheOnly:false,failedSources:[],failedSourceIds:[],demo:true',1)

              # Source-list health styling.
              old='.catalogRefreshBtn:disabled{opacity:.55}.catalogRefreshBtn.spinning{animation:catalogSpin .7s linear infinite}@keyframes catalogSpin{to{transform:rotate(360deg)}}.sourceIcon{width:34px;height:34px;border-radius:9px;background:#0f1f46;display:grid;place-items:center;flex:0 0 34px;font-size:17px}.empty'
              new='.catalogRefreshBtn:disabled{opacity:.55}.catalogRefreshBtn.spinning{animation:catalogSpin .7s linear infinite}@keyframes catalogSpin{to{transform:rotate(360deg)}}.sourceHealthPill{font-size:11px;font-weight:800;color:#fecaca;background:#3a1720;border:1px solid #7f1d1d;padding:5px 8px;border-radius:999px;white-space:nowrap}.sourceErrorIcon{color:#ff453a;font-size:17px;font-weight:800;line-height:1}.sourceIcon{width:34px;height:34px;border-radius:9px;background:#0f1f46;display:grid;place-items:center;flex:0 0 34px;font-size:17px}.empty'
              if old not in s: raise SystemExit('CSS marker missing')
              s=s.replace(old,new,1)

              old='<div class="topbar"><button class="back" onclick="showScreen(\'home\')">‹ ${esc(L.back)}</button><div class="topbarActions"><button id="catalogRefreshBtn" class="catalogRefreshBtn" type="button" title="${esc(L.refreshCatalog)}" aria-label="${esc(L.refreshCatalog)}" onclick="refreshCatalogTop()">↻</button><span id="watchedPill" class="countPill">${watchedCount} ${esc(L.selected)}</span></div></div>'
              new='<div class="topbar"><button class="back" onclick="showScreen(\'home\')">‹ ${esc(L.back)}</button><div class="topbarActions"><span id="sourceHealthPill" class="sourceHealthPill" hidden></span><button id="catalogRefreshBtn" class="catalogRefreshBtn" type="button" title="${esc(L.refreshCatalog)}" aria-label="${esc(L.refreshCatalog)}" onclick="refreshCatalogTop()">↻</button><span id="watchedPill" class="countPill">${watchedCount} ${esc(L.selected)}</span></div></div>'
              if old not in s: raise SystemExit('sources topbar marker missing')
              s=s.replace(old,new,1)

              # WebView health state + helpers.
              old='''let catalog=${JSON.stringify(initialCatalog)};\nlet currentSourceId=null;\nwindow.__nativeQueue=[];'''
              new='''let catalog=${JSON.stringify(initialCatalog)};\nlet currentSourceId=null;\nlet failedSourceIds=new Set();\nlet sourceCacheOnly=false;\nwindow.__nativeQueue=[];'''
              if old not in s: raise SystemExit('web state marker missing')
              s=s.replace(old,new,1)

              old='''function sourceObj(id){return(catalog.sources||[]).find(x=>x.id===id)}\nfunction refreshCounts(){'''
              new='''function sourceObj(id){return(catalog.sources||[]).find(x=>x.id===id)}\nfunction sourceFailed(src){return failedSourceIds.has(String(src?.id||""))}\nfunction updateSourceHealthUI(){const p=document.getElementById('sourceHealthPill');if(!p)return;if(sourceCacheOnly){p.hidden=false;p.textContent='⚠︎ '+${JSON.stringify('Cache')};return}const n=failedSourceIds.size;p.hidden=n===0;p.textContent=n?'⚠︎ '+n:''}\nfunction refreshCounts(){'''
              if old not in s: raise SystemExit('source helper marker missing')
              s=s.replace(old,new,1)

              old="const rows=(catalog.sources||[]).filter(s=>!q||norm(s.name+' '+s.id).includes(q));"
              new="const rows=(catalog.sources||[]).filter(s=>!q||norm(s.name+' '+s.id).includes(q)).slice().sort((a,b)=>String(a.name||a.id||'').localeCompare(String(b.name||b.id||''),state.language||'en',{sensitivity:'base'}));"
              if old not in s: raise SystemExit('source rows marker missing')
              s=s.replace(old,new,1)

              old='''    const right=document.createElement('div');right.className='navRight';\n    if(n){const pill=document.createElement('span');pill.className='countPill';pill.textContent=String(n);right.appendChild(pill)}'''
              new='''    const right=document.createElement('div');right.className='navRight';\n    if(sourceFailed(src)){const warn=document.createElement('span');warn.className='sourceErrorIcon';warn.textContent='⚠︎';warn.title=src.name;right.appendChild(warn)}\n    if(n){const pill=document.createElement('span');pill.className='countPill';pill.textContent=String(n);right.appendChild(pill)}'''
              if old not in s: raise SystemExit('source right marker missing')
              s=s.replace(old,new,1)

              old="if(id==='sources')renderSources()"
              new="if(id==='sources'){updateSourceHealthUI();renderSources()}"
              if old not in s: raise SystemExit('showScreen sources marker missing')
              s=s.replace(old,new,1)

              old="if(m.action==='catalog'){catalog=m.catalog||{sources:[]};document.getElementById('catalogMode').textContent=m.online?${JSON.stringify(L.online)}:${JSON.stringify(L.cached)};document.getElementById('catalogCount').textContent=(catalog.sources||[]).length;renderSources();if(currentSourceId&&sourceObj(currentSourceId))renderApps();finishCatalogRefresh();const e=document.getElementById('toolStatus');if(e)e.textContent=m.text||''}"
              new="if(m.action==='catalog'){catalog=m.catalog||{sources:[]};document.getElementById('catalogMode').textContent=m.online?${JSON.stringify(L.online)}:${JSON.stringify(L.cached)};document.getElementById('catalogCount').textContent=(catalog.sources||[]).length;renderSources();if(currentSourceId&&sourceObj(currentSourceId))renderApps();finishCatalogRefresh();const e=document.getElementById('toolStatus');if(e)e.textContent=m.text||''}\n  if(m.action==='sourceHealth'){failedSourceIds=new Set((m.failedSourceIds||[]).map(String));sourceCacheOnly=!!m.cacheOnly;updateSourceHealthUI();renderSources()}"
              if old not in s: raise SystemExit('native catalog marker missing')
              s=s.replace(old,new,1)

              # Send source health shortly after settings opens, without delaying the WebView.
              old='''  const sleep=ms=>new Promise(resolve=>Timer.schedule(ms,false,resolve));\n\n  while(!dismissed){'''
              new='''  const sleep=ms=>new Promise(resolve=>Timer.schedule(ms,false,resolve));\n  ;(async()=>{try{const h=await getLiveStatus(cur);await send(web,{action:"sourceHealth",failedSourceIds:h.failedSourceIds||[],cacheOnly:!!h.cacheOnly})}catch(e){console.log("Source health: "+e)}})();\n\n  while(!dismissed){'''
              if old not in s: raise SystemExit('settings initial health marker missing')
              s=s.replace(old,new,1)

              old='''          cur=enrichWatchedSources(cur,r.data);saveSettings(cur);\n          await send(web,{action:"catalog",catalog:r.data,online:r.online,text:tx(cur,"catalogUpdated")})'''
              new='''          cur=enrichWatchedSources(cur,r.data);saveSettings(cur);\n          await send(web,{action:"catalog",catalog:r.data,online:r.online,text:tx(cur,"catalogUpdated")});\n          const h=await getLiveStatus(cur);await send(web,{action:"sourceHealth",failedSourceIds:h.failedSourceIds||[],cacheOnly:!!h.cacheOnly})'''
              if old not in s: raise SystemExit('refresh catalog health marker missing')
              s=s.replace(old,new,1)

              p.write_text(s,encoding='utf-8')

          # Sync .scriptable package directly from source.
          src=p.read_text(encoding='utf-8')
          pkg_path=app/'Sideload Watch.scriptable'
          pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg['script']=src
          pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2),encoding='utf-8')
          (app/'version.json').write_text(json.dumps({'version':'0.2.14'},indent=2)+"\n",encoding='utf-8')
          PY

      - name: Validate
        run: |
          cp 'apps/Sideload-Watch/Sideload Watch.js' /tmp/SideloadWatch.mjs
          node --check /tmp/SideloadWatch.mjs
          python - <<'PY'
          import json,re
          from pathlib import Path
          app=Path('apps/Sideload-Watch')
          src=(app/'Sideload Watch.js').read_text(encoding='utf-8')
          pkg=json.loads((app/'Sideload Watch.scriptable').read_text(encoding='utf-8'))
          ver=json.loads((app/'version.json').read_text(encoding='utf-8'))['version']
          assert 'const APP_VERSION = "0.2.14";' in src and ver=='0.2.14'
          assert pkg['script']==src
          assert 'failedSourceIds' in src
          assert "localeCompare(String(b.name||b.id||'')" in src
          assert 'sourceErrorIcon' in src and 'sourceHealthPill' in src
          assert "m.action==='sourceHealth'" in src
          print('Sideload Watch v0.2.14 source sorting + health UI OK')
          PY

      - name: Commit app files
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add 'apps/Sideload-Watch/Sideload Watch.js' 'apps/Sideload-Watch/Sideload Watch.scriptable' 'apps/Sideload-Watch/version.json'
          if git diff --cached --quiet; then
            echo 'Already patched'
            exit 0
          fi
          git commit -m 'Improve Sideload Watch source health UI'
          git push origin HEAD:Master
