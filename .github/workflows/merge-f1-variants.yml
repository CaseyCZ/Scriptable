name: Merge F1 catalog variants

on:
  push:
    branches: [Master]
    paths:
      - "tools/merge_f1_variants.py"
      - ".github/workflows/merge-f1-variants.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Merge F1 variants
        run: python tools/merge_f1_variants.py
      - name: Validate JavaScript
        run: |
          node --check community-extra.js
          node tools/audit-community-catalog.cjs
      - name: Commit catalog changes
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add index.html community-extra.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Merge F1 widget variants into one project"
          git push origin HEAD:Master
