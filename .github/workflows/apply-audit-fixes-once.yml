name: Apply audited app fixes once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/apply-audit-fixes-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Apply audited fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              assert count == 1, f'{label}: expected 1 match, got {count}'
              return text.replace(old, new, 1)

          # ---------------- LockScreen Generator 2.9.5 ----------------
          p = Path('apps/LockScreenGenerator/LockScreenGenerator.js')
          lock = p.read_text(encoding='utf-8')
          lock = replace_once(lock, '// LockScreenGenerator.js\n', '// LockScreenGenerator.js\n', 'LockScreen header')
          lock = replace_once(lock, 'const APP_VERSION = "2.9.4";', 'const APP_VERSION = "2.9.5";', 'LockScreen version')
          lock = replace_once(lock,
              'async function main(){let settings=loadSettings();',
              'async function main(){let settings=await loadSettings();',
              'LockScreen await loadSettings')
          old = 'function loadSettings(){const fm=FileManager.iCloud(),path=fm.joinPath(fm.documentsDirectory(),SETTINGS_FILE);let saved={};try{if(fm.fileExists(path)){if(!fm.isFileDownloaded(path))fm.downloadFileFromiCloud(path);saved=JSON.parse(fm.readString(path))}}catch(_){saved={}}const merged={...DEFAULT_SETTINGS,...saved};merged.sectionStyle=deepMergeStyle(saved.sectionStyle);merged.lastNameDays=saved.lastNameDays||{};merged.lastF1=saved.lastF1||[];let order=Array.isArray(saved.sectionOrder)?[...saved.sectionOrder]:[...DEFAULT_SETTINGS.sectionOrder];for(const key of Object.keys(MODULES))if(!order.includes(key))order.push(key);merged.sectionOrder=order.filter(key=>MODULES[key]);merged.settingsVersion=7;return merged}'
          new = 'async function loadSettings(){const fm=FileManager.iCloud(),path=fm.joinPath(fm.documentsDirectory(),SETTINGS_FILE);let saved={};try{if(fm.fileExists(path)){if(!fm.isFileDownloaded(path))await fm.downloadFileFromiCloud(path);saved=JSON.parse(fm.readString(path))}}catch(_){saved={}}const merged={...DEFAULT_SETTINGS,...saved};merged.sectionStyle=deepMergeStyle(saved.sectionStyle);merged.lastNameDays=saved.lastNameDays||{};merged.lastF1=saved.lastF1||[];let order=Array.isArray(saved.sectionOrder)?[...saved.sectionOrder]:[...DEFAULT_SETTINGS.sectionOrder];for(const key of Object.keys(MODULES))if(!order.includes(key))order.push(key);merged.sectionOrder=order.filter(key=>MODULES[key]);merged.settingsVersion=7;return merged}'
          lock = replace_once(lock, old, new, 'LockScreen iCloud settings')
          old = 'function installScriptUpdate(code){const path=module.filename;if(!path)throw new Error("Current script path unavailable");const cloud=FileManager.iCloud(),local=FileManager.local();let fm=local;try{if(cloud.fileExists(path))fm=cloud;else if(local.fileExists(path))fm=local;else throw new Error("Current script file not found")}catch(e){if(local.fileExists(path))fm=local;else throw e}try{if(fm===cloud&&!fm.isFileDownloaded(path))fm.downloadFileFromiCloud(path)}catch(_){}const current=fm.readString(path),backup=/\\.js$/i.test(path)?path.replace(/\\.js$/i,"_backup.js"):path+"_backup.js";fm.writeString(backup,current);fm.writeString(path,code);return backup}'
          new = 'async function installScriptUpdate(code){const path=module.filename;if(!path)throw new Error("Current script path unavailable");const cloud=FileManager.iCloud(),local=FileManager.local();let fm=local;try{if(cloud.fileExists(path))fm=cloud;else if(local.fileExists(path))fm=local;else throw new Error("Current script file not found")}catch(e){if(local.fileExists(path))fm=local;else throw e}try{if(fm===cloud&&!fm.isFileDownloaded(path))await fm.downloadFileFromiCloud(path)}catch(_){}const current=fm.readString(path),backup=/\\.js$/i.test(path)?path.replace(/\\.js$/i,"_backup.js"):path+"_backup.js";fm.writeString(backup,current);fm.writeString(path,code);return backup}'
          lock = replace_once(lock, old, new, 'LockScreen updater iCloud')
          lock = replace_once(lock, 'installScriptUpdate(pendingUpdateCode);', 'await installScriptUpdate(pendingUpdateCode);', 'LockScreen await updater')
          old = 'async function fetchSports(settings,targetDate){try{const league=(settings.sportsLeague||"NHL").toLowerCase(),sport=league==="nba"?"basketball":league==="nfl"?"football":league==="mlb"?"baseball":"hockey",data=await timedRequest(`${apiBase(settings.apiSportsBase,"https://site.api.espn.com/apis/site/v2/sports")}/${sport}/${league}/scoreboard`).loadJSON(),team=(settings.sportsTeam||"").toLowerCase(),match=(data.events||[]).find(e=>{const d=new Date(e.date),same=d.getFullYear()===targetDate.getFullYear()&&d.getMonth()===targetDate.getMonth()&&d.getDate()===targetDate.getDate();return same&&(!team||e.name.toLowerCase().includes(team))});return match?`🏆 ${match.shortName||match.name} (${match.status?.type?.detail||""})`:""}catch(_){return""}}'
          new = 'async function fetchSports(settings,targetDate){try{const league=(settings.sportsLeague||"NHL").toLowerCase(),sport=league==="nba"?"basketball":league==="nfl"?"football":league==="mlb"?"baseball":"hockey",date=`${targetDate.getFullYear()}${String(targetDate.getMonth()+1).padStart(2,"0")}${String(targetDate.getDate()).padStart(2,"0")}`,data=await timedRequest(`${apiBase(settings.apiSportsBase,"https://site.api.espn.com/apis/site/v2/sports")}/${sport}/${league}/scoreboard?dates=${date}`).loadJSON(),team=(settings.sportsTeam||"").toLowerCase(),match=(data.events||[]).find(e=>{const d=new Date(e.date),same=d.getFullYear()===targetDate.getFullYear()&&d.getMonth()===targetDate.getMonth()&&d.getDate()===targetDate.getDate();return same&&(!team||String(e.name||"").toLowerCase().includes(team))});return match?`🏆 ${match.shortName||match.name} (${match.status?.type?.detail||""})`:""}catch(_){return""}}'
          lock = replace_once(lock, old, new, 'LockScreen sports date')
          old = 'async function fetchFitness(settings){const fm=FileManager.iCloud(),p=fm.joinPath(fm.documentsDirectory(),STEPS_FILE);if(!fm.fileExists(p))return"";try{if(!fm.isFileDownloaded(p))fm.downloadFileFromiCloud(p);const steps=parseInt(fm.readString(p).trim());if(isNaN(steps))return"";const goal=settings.stepsGoal||10000,pct=Math.min(100,Math.round(steps/goal*100)),n=Math.round(pct/10);return`🏃 ${(LOCALIZATION[settings.language]||LOCALIZATION.cs).fitness}: ${steps.toLocaleString()} / ${goal.toLocaleString()} (${pct}%) [${"█".repeat(n)}${"░".repeat(10-n)}]`}catch(_){return""}}'
          new = 'async function fetchFitness(settings){const fm=FileManager.iCloud(),p=fm.joinPath(fm.documentsDirectory(),STEPS_FILE);if(!fm.fileExists(p))return"";try{if(!fm.isFileDownloaded(p))await fm.downloadFileFromiCloud(p);const steps=parseInt(fm.readString(p).trim());if(isNaN(steps))return"";const goal=settings.stepsGoal||10000,pct=Math.min(100,Math.round(steps/goal*100)),n=Math.round(pct/10);return`🏃 ${(LOCALIZATION[settings.language]||LOCALIZATION.cs).fitness}: ${steps.toLocaleString()} / ${goal.toLocaleString()} (${pct}%) [${"█".repeat(n)}${"░".repeat(10-n)}]`}catch(_){return""}}'
          lock = replace_once(lock, old, new, 'LockScreen fitness iCloud')
          old = 'function getWorldClocks(value){const zones={"new york":"America/New_York","london":"Europe/London","tokyo":"Asia/Tokyo","prague":"Europe/Prague","praha":"Europe/Prague","berlin":"Europe/Berlin","sydney":"Australia/Sydney"},out=[];for(const raw of(value||"").split(",")){const city=raw.trim();if(!city)continue;const zone=zones[city.toLowerCase()];try{const s=new Intl.DateTimeFormat("en-GB",{timeZone:zone||undefined,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());out.push(`${city}: ${s}`)}catch(_){}}return out}'
          new = 'function getWorldClocks(value){const zones={"new york":"America/New_York","london":"Europe/London","tokyo":"Asia/Tokyo","prague":"Europe/Prague","praha":"Europe/Prague","berlin":"Europe/Berlin","sydney":"Australia/Sydney"},out=[];for(const raw of(value||"").split(",")){const city=raw.trim();if(!city)continue;const zone=zones[city.toLowerCase()]||(city.includes("/")?city:"");if(!zone)continue;try{const s=new Intl.DateTimeFormat("en-GB",{timeZone:zone,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());out.push(`${city}: ${s}`)}catch(_){}}return out}'
          lock = replace_once(lock, old, new, 'LockScreen world clocks')
          p.write_text(lock, encoding='utf-8')

          # ---------------- Sports Info 2.5.9 ----------------
          p = Path('apps/Sports-Info/Sports Info.js')
          sports = p.read_text(encoding='utf-8')
          sports = replace_once(sports, '// Sports Info v2.5.8', '// Sports Info v2.5.9', 'Sports header version')
          sports = replace_once(sports, 'const APP_VERSION = "2.5.8";', 'const APP_VERSION = "2.5.9";', 'Sports version')
          sports = replace_once(sports, 'const API_TIMEOUT = 7;\n', 'const API_TIMEOUT = 7;\nconst CACHE_MAX_AGE = 6 * 60 * 60 * 1000;\n', 'Sports cache TTL constant')
          old = 'function cacheRead(k){try{if(!fm.fileExists(cachePath))return null;const c=JSON.parse(fm.readString(cachePath));return c.key===k?c:null}catch(_){return null}}'
          new = 'function cacheRead(k){try{if(!fm.fileExists(cachePath))return null;const c=JSON.parse(fm.readString(cachePath));if(c.key!==k)return null;const age=Date.now()-Number(c.ts||0);if(!Number.isFinite(age)||age<0||age>CACHE_MAX_AGE)return null;return c}catch(_){return null}}'
          sports = replace_once(sports, old, new, 'Sports cache TTL')

          old = '''function eventWindow(s,needs){
            const slow=s.sportId==="football"||s.sportId==="floorball",past=Math.max(slow?14:7,needs.recent*(slow?10:4)),future=Math.max(slow?28:10,needs.upcoming*(slow?14:7));
            return range(-past,future)
          }
          async function data(s){
            const key=`${s.sportId}|${s.leagueId}|${s.teamId||"all"}`;
            try{
              const needs=eventNeeds(s),window=eventWindow(s,needs),all=unique(await scoreboardFor(s,window,needs));
              let table=[];if(s.showTable)try{table=await standingsFor(s)}catch(_){}
              if(s.showTable&&s.showLogos&&table.length&&table.some(x=>!x.logo)){try{const teams=await teamsFor(s),logos=new Map(teams.filter(x=>x?.id&&x?.logo).map(x=>[String(x.id),x.logo]));table=table.map(x=>Object.assign({},x,{logo:x.logo||logos.get(String(x.id||""))||""}))}catch(_){}}
              if(!all.length&&!table.length)throw new Error("No data");
              const ev=all.filter(e=>!(s.teamId||s.teamName)||eventMatches(e,s)),now=Date.now(),live=ev.filter(e=>e.state==="in"),done=ev.filter(e=>e.completed||e.state==="post").sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,needs.recent),next=ev.filter(e=>e.state!=="in"&&!(e.completed||e.state==="post")&&new Date(e.date).getTime()>now-4*3600000).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,needs.upcoming);
              const d={source:"online",at:Date.now(),live,done,next,current:(s.showLive?live[0]:null)||next[0]||done[0]||null,form:(s.teamId||s.teamName)?done.slice(0,5).map(e=>result(e,s)).filter(Boolean):[],table};cacheWrite(key,d);return d
            }catch(e){console.log(e);const c=cacheRead(key);return c?.data?Object.assign({},c.data,{source:"cache",at:c.ts||c.data.at}):{source:"error",at:Date.now(),live:[],done:[],next:[],current:null,form:[],table:[]}}
          }'''.replace('          ','')
          new = '''function eventWindow(s,needs,level=0){
            const slow=s.sportId==="football"||s.sportId==="floorball",past=Math.max(slow?14:7,needs.recent*(slow?10:4)),baseFuture=Math.max(slow?28:10,needs.upcoming*(slow?14:7));
            const future=level<=0?baseFuture:level===1?Math.max(baseFuture,30):Math.max(baseFuture,60);
            return range(-past,future)
          }
          async function data(s){
            const key=`${s.sportId}|${s.leagueId}|${s.teamId||"all"}`;
            try{
              const needs=eventNeeds(s);let all=unique(await scoreboardFor(s,eventWindow(s,needs,0),needs));
              if(s.showNext){
                for(let level=1;level<=2;level++){
                  const scoped=all.filter(e=>!(s.teamId||s.teamName)||eventMatches(e,s)),now=Date.now(),nextCount=scoped.filter(e=>e.state!=="in"&&!(e.completed||e.state==="post")&&new Date(e.date).getTime()>now-4*3600000).length;
                  if(nextCount>=needs.upcoming)break;
                  try{all=unique([...all,...await scoreboardFor(s,eventWindow(s,needs,level),needs)])}catch(_){break}
                }
              }
              let table=[];if(s.showTable)try{table=await standingsFor(s)}catch(_){}
              if(s.showTable&&s.showLogos&&table.length&&table.some(x=>!x.logo)){try{const teams=await teamsFor(s),logos=new Map(teams.filter(x=>x?.id&&x?.logo).map(x=>[String(x.id),x.logo]));table=table.map(x=>Object.assign({},x,{logo:x.logo||logos.get(String(x.id||""))||""}))}catch(_){}}
              if(!all.length&&!table.length)throw new Error("No data");
              const ev=all.filter(e=>!(s.teamId||s.teamName)||eventMatches(e,s)),now=Date.now(),live=ev.filter(e=>e.state==="in"),done=ev.filter(e=>e.completed||e.state==="post").sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,needs.recent),next=ev.filter(e=>e.state!=="in"&&!(e.completed||e.state==="post")&&new Date(e.date).getTime()>now-4*3600000).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,needs.upcoming);
              const d={source:"online",at:Date.now(),live,done,next,current:(s.showLive?live[0]:null)||next[0]||done[0]||null,form:(s.teamId||s.teamName)?done.slice(0,5).map(e=>result(e,s)).filter(Boolean):[],table};cacheWrite(key,d);return d
            }catch(e){console.log(e);const c=cacheRead(key);return c?.data?Object.assign({},c.data,{source:"cache",at:c.ts||c.data.at}):{source:"error",at:Date.now(),live:[],done:[],next:[],current:null,form:[],table:[]}}
          }'''.replace('          ','')
          sports = replace_once(sports, old, new, 'Sports adaptive window')

          old = 'function sportsApiRows(d){const groups=d?.standings||d?.data?.standings||d?.data||[],out=[],seen=new Set();const walk=x=>{if(!x)return;if(Array.isArray(x)){for(const y of x)walk(y);return}const t=x.team||x.competitor||{};const id=String(t.id||x.teamId||"");if(id&&t.name&&!seen.has(id)){seen.add(id);out.push({rank:Number(x.position||x.rank||out.length+1),id,name:t.name,short:t.shortName||t.nameCode||t.abbreviation||t.name,played:String(x.matches??x.played??x.gamesPlayed??""),points:String(x.points??x.pts??"")})}for(const k of["rows","groups","standings"])if(x[k])walk(x[k])};walk(groups);return out}'
          new = 'function sportsApiRows(d){const groups=d?.standings||d?.data?.standings||d?.data||[],out=[],seen=new Set();const walk=x=>{if(!x)return;if(Array.isArray(x)){for(const y of x)walk(y);return}const t=x.team||x.competitor||{},id=String(t.id||x.teamId||"");if(id&&t.name&&!seen.has(id)){seen.add(id);const wins=x.wins??x.won??x.win??"",draws=x.draws??x.drawn??x.ties??"",losses=x.losses??x.lost??x.loss??"",gf=x.scoresFor??x.goalsFor??x.pointsFor??x.runsFor??x.for??"",ga=x.scoresAgainst??x.goalsAgainst??x.pointsAgainst??x.runsAgainst??x.against??"";out.push({rank:Number(x.position||x.rank||out.length+1),id,name:t.name,short:t.shortName||t.nameCode||t.abbreviation||t.name,played:String(x.matches??x.played??x.gamesPlayed??""),wins:String(wins),won:String(wins),draws:String(draws),drawn:String(draws),losses:String(losses),lost:String(losses),otWins:String(x.otWins??x.overtimeWins??""),otLosses:String(x.otLosses??x.overtimeLosses??x.otl??""),points:String(x.points??x.pts??""),pct:String(x.percentage??x.pct??x.winPercentage??""),gb:String(x.gamesBehind??x.gb??""),gf:String(gf),ga:String(ga),diff:String(x.scoreDiff??x.goalDifference??x.pointDifferential??x.runDifferential??x.diff??"")})}for(const k of["rows","groups","standings"])if(x[k])walk(x[k])};walk(groups);return out}'
          sports = replace_once(sports, old, new, 'SportsAPI standings fields')

          old = 'function sofaRows(d){const rows=[];for(const g of d?.standings||[]){for(const x of g.rows||[]){const t=x.team||{};rows.push({rank:Number(x.position||rows.length+1),id:String(t.id||""),name:t.name||"",short:t.shortName||t.nameCode||t.name||"",played:String(x.matches??x.played??""),points:String(x.points??"")})}}const seen=new Set();return rows.filter(x=>x.id&&x.name&&!seen.has(x.id)&&seen.add(x.id))}'
          new = 'function sofaRows(d){const rows=[];for(const g of d?.standings||[]){for(const x of g.rows||[]){const t=x.team||{},wins=x.wins??x.won??"",draws=x.draws??x.drawn??x.ties??"",losses=x.losses??x.lost??"",gf=x.scoresFor??x.goalsFor??x.pointsFor??x.runsFor??"",ga=x.scoresAgainst??x.goalsAgainst??x.pointsAgainst??x.runsAgainst??"";rows.push({rank:Number(x.position||rows.length+1),id:String(t.id||""),name:t.name||"",short:t.shortName||t.nameCode||t.name||"",played:String(x.matches??x.played??""),wins:String(wins),won:String(wins),draws:String(draws),drawn:String(draws),losses:String(losses),lost:String(losses),otWins:String(x.otWins??x.overtimeWins??""),otLosses:String(x.otLosses??x.overtimeLosses??x.otl??""),points:String(x.points??""),pct:String(x.percentage??x.pct??x.winPercentage??""),gb:String(x.gamesBehind??x.gb??""),gf:String(gf),ga:String(ga),diff:String(x.scoreDiff??x.goalDifference??x.pointDifferential??x.runDifferential??x.diff??"")})}}const seen=new Set();return rows.filter(x=>x.id&&x.name&&!seen.has(x.id)&&seen.add(x.id))}'
          sports = replace_once(sports, old, new, 'SofaScore standings fields')

          old = 'async function updater(s){try{const src=await getString(UPDATE_SOURCE_URL);if(!src||src.length<UPDATE_MIN_BYTES)throw new Error("Bad source");const m=src.match(/const APP_VERSION\\s*=\\s*"([^"]+)"/);if(!m)throw new Error("No version");const v=m[1];if(cmp(v,APP_VERSION)<=0)return{ok:true,text:`${tx(s,"current")} v${APP_VERSION}`};const a=new Alert();a.title=APP_NAME;a.message=`${tx(s,"available")}: v${v}`;a.addAction(tx(s,"apply"));a.addCancelAction(tx(s,"cancel"));if(await a.presentAlert()!==0)return{ok:true,text:`v${APP_VERSION} → v${v}`};const target=module.filename,b=fm.joinPath(fm.documentsDirectory(),`SportsInfo_backup_v${APP_VERSION}.js`);try{fm.writeString(b,fm.readString(target))}catch(_){}fm.writeString(target,src);return{ok:true,text:tx(s,"updatedOk")}}catch(e){console.log(e);return{ok:false,text:tx(s,"updateFail")}}}'
          new = 'async function updater(s){try{const src=await getString(UPDATE_SOURCE_URL);if(!src||src.length<UPDATE_MIN_BYTES)throw new Error("Bad source");const m=src.match(/const APP_VERSION\\s*=\\s*"([^"]+)"/);if(!m)throw new Error("No version");const v=m[1];if(cmp(v,APP_VERSION)<=0)return{ok:true,text:`${tx(s,"current")} v${APP_VERSION}`};const a=new Alert();a.title=APP_NAME;a.message=`${tx(s,"available")}: v${v}`;a.addAction(tx(s,"apply"));a.addCancelAction(tx(s,"cancel"));if(await a.presentAlert()!==0)return{ok:true,text:`v${APP_VERSION} → v${v}`};const target=module.filename;if(!target)throw new Error("Current script path unavailable");const cloud=FileManager.iCloud(),local=FileManager.local();let targetFm=local;if(cloud.fileExists(target)){targetFm=cloud;if(!cloud.isFileDownloaded(target))await cloud.downloadFileFromiCloud(target)}else if(!local.fileExists(target))throw new Error("Current script file not found");const b=/\\.js$/i.test(target)?target.replace(/\\.js$/i,`_backup_v${APP_VERSION}.js`):target+`_backup_v${APP_VERSION}.js`;try{targetFm.writeString(b,targetFm.readString(target))}catch(_){}targetFm.writeString(target,src);return{ok:true,text:tx(s,"updatedOk")}}catch(e){console.log(e);return{ok:false,text:tx(s,"updateFail")}}}'
          sports = replace_once(sports, old, new, 'Sports updater storage')
          p.write_text(sports, encoding='utf-8')

          # Old one-shot probe is no longer part of production.
          probe = Path('.github/workflows/probe-livesport-standings-once.yml')
          if probe.exists():
              probe.unlink()

      - name: Synchronize release surfaces
        run: |
          python .github/scripts/build_scriptable_package.py
          python .github/scripts/build_sports_info_package.py

      - name: Syntax check
        run: |
          cp 'apps/LockScreenGenerator/LockScreenGenerator.js' /tmp/LockScreenGenerator.mjs
          cp 'apps/Sports-Info/Sports Info.js' /tmp/SportsInfo.mjs
          node --check /tmp/LockScreenGenerator.mjs
          node --check /tmp/SportsInfo.mjs

      - name: Undefined-variable audit
        run: |
          cat >/tmp/eslint.config.mjs <<'EOF'
          export default [{
            files:['**/*.js'],
            languageOptions:{ecmaVersion:'latest',sourceType:'module',globals:{
              FileManager:'readonly',Device:'readonly',Alert:'readonly',Calendar:'readonly',CalendarEvent:'readonly',Reminder:'readonly',Location:'readonly',Request:'readonly',Safari:'readonly',WebView:'readonly',Timer:'readonly',Data:'readonly',QuickLook:'readonly',Script:'readonly',config:'readonly',module:'readonly',args:'readonly',URLScheme:'readonly',Pasteboard:'readonly',ListWidget:'readonly',Color:'readonly',Font:'readonly',Size:'readonly',Rect:'readonly',SFSymbol:'readonly',DrawContext:'readonly',DateFormatter:'readonly',console:'readonly'
            }},rules:{'no-undef':'error'}
          }]
          EOF
          npx --yes eslint@9 --config /tmp/eslint.config.mjs 'apps/LockScreenGenerator/LockScreenGenerator.js' 'apps/Sports-Info/Sports Info.js'

      - name: Regression and release audit
        shell: python
        run: |
          from pathlib import Path
          import json,re
          lock=Path('apps/LockScreenGenerator/LockScreenGenerator.js').read_text(encoding='utf-8')
          sports=Path('apps/Sports-Info/Sports Info.js').read_text(encoding='utf-8')
          site=Path('index.html').read_text(encoding='utf-8')
          root=Path('README.md').read_text(encoding='utf-8')
          assert 'const APP_VERSION = "2.9.5";' in lock
          assert 'let settings=await loadSettings()' in lock
          assert 'async function loadSettings()' in lock and 'await fm.downloadFileFromiCloud(path)' in lock
          assert 'await installScriptUpdate(pendingUpdateCode)' in lock
          assert '/scoreboard?dates=${date}' in lock
          assert 'if(!zone)continue' in lock
          assert 'const APP_VERSION = "2.5.9";' in sports
          assert 'CACHE_MAX_AGE' in sports and 'age>CACHE_MAX_AGE' in sports
          assert 'function eventWindow(s,needs,level=0)' in sports and 'Math.max(baseFuture,60)' in sports
          assert 'wins:String(wins)' in sports and 'pct:String(x.percentage??x.pct??x.winPercentage??"")' in sports
          assert 'const cloud=FileManager.iCloud(),local=FileManager.local();let targetFm=local' in sports
          assert not Path('.github/workflows/probe-livesport-standings-once.yml').exists()
          for name,path,ver in [
            ('LockScreen Generator','apps/LockScreenGenerator/LockScreenGenerator.scriptable','2.9.5'),
            ('Sports Info','apps/Sports-Info/Sports Info.scriptable','2.5.9')]:
              src=lock if name.startswith('Lock') else sports
              pkg=json.loads(Path(path).read_text(encoding='utf-8'))
              assert pkg['script']==src and pkg['name']==name
              assert f"name:'{name}',version:'{ver}'" in site
              assert f'**{name}** | ✅ v{ver}' in root
          print('All audited fixes and release surfaces OK')

      - name: Commit fixes
        run: |
          git config user.name 'CaseyCZ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix audited runtime and data issues'
          git push origin HEAD:Master
