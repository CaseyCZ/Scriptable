name: Fix Sports Info 2.5.16 buttons once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/fix-sports-buttons-2516-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Patch Sports Info 2.5.16
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/Sports-Info/Sports Info.js')
          s = p.read_text(encoding='utf-8')

          assert 'const APP_VERSION = "2.5.15";' in s, 'expected Sports Info 2.5.15'
          assert 'z.layout.large.tableAlign=ta.valuefor(const k of[' in s, 'broken settings token not found'

          s = s.replace('// Sports Info v2.5.15', '// Sports Info v2.5.16', 1)
          s = s.replace('const APP_VERSION = "2.5.15";', 'const APP_VERSION = "2.5.16";', 1)
          s = s.replace('z.layout.large.tableAlign=ta.valuefor(const k of[', 'z.layout.large.tableAlign=ta.value;for(const k of[', 1)

          assert 'z.layout.large.tableAlign=ta.valuefor(const k of[' not in s
          assert 'z.layout.large.tableAlign=ta.value;for(const k of[' in s
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript and build release
        run: |
          cp 'apps/Sports-Info/Sports Info.js' /tmp/SportsInfo.mjs
          node --check /tmp/SportsInfo.mjs
          python .github/scripts/build_sports_info_package.py
          python - <<'PY'
          import json
          from pathlib import Path

          app = Path('apps/Sports-Info')
          src = (app/'Sports Info.js').read_text(encoding='utf-8')
          pkg = json.loads((app/'Sports Info.scriptable').read_text(encoding='utf-8'))
          app_readme = (app/'README.md').read_text(encoding='utf-8')
          root_readme = Path('README.md').read_text(encoding='utf-8')
          site = Path('index.html').read_text(encoding='utf-8')

          assert 'const APP_VERSION = "2.5.16";' in src
          assert pkg['script'] == src
          assert 'z.layout.large.tableAlign=ta.valuefor(const k of[' not in src
          assert 'z.layout.large.tableAlign=ta.value;for(const k of[' in src
          assert '**Sports Info v2.5.16 — Production**' in app_readme
          assert '| 🏆 **Sports Info** | ✅ v2.5.16 |' in root_readme
          assert "{name:'Sports Info',version:'2.5.16'" in site
          print('Sports Info 2.5.16 button fix validated')
          PY

      - name: Commit fix
        run: |
          git config user.name "CaseyCZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            'apps/Sports-Info/Sports Info.js' \
            'apps/Sports-Info/Sports Info.scriptable' \
            'apps/Sports-Info/README.md' \
            'README.md' \
            'index.html'
          git commit -m "Fix Sports Info buttons in 2.5.16"
          git push origin HEAD:Master
