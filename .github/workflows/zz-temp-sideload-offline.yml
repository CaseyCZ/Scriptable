name: Temporary Sideload Watch v0.2.13 patch

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/zz-temp-sideload-offline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Patch Sideload Watch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('apps/Sideload-Watch/Sideload Watch.js')
          s=p.read_text(encoding='utf-8')
          if 'const APP_VERSION = "0.2.13";' not in s:
              if 'const APP_VERSION = "0.2.12";' not in s:
                  raise SystemExit('Expected Sideload Watch v0.2.12 source')
              s=s.replace('// Sideload Watch v0.2.12','// Sideload Watch v0.2.13',1)
              s=s.replace('const APP_VERSION = "0.2.12";','const APP_VERSION = "0.2.13";',1)

              old='''  return{\n    updates,total:updates.length,current,\n    checkedAt:state.updatedAt?new Date(state.updatedAt):null,\n    offline:true,cached:true,error:error?String(error):null\n  }'''
              new='''  return{\n    updates,total:updates.length,current,\n    checkedAt:state.updatedAt?new Date(state.updatedAt):null,\n    offline:true,cached:true,cacheOnly:true,failedSources:[],error:error?String(error):null\n  }'''
              if old not in s: raise SystemExit('cachedStatus return not found')
              s=s.replace(old,new,1)

              old='''  const results=await Promise.allSettled([...groups.entries()].map(async([url,items])=>{\n    const payload=await requestSourceJSON(url,3.5);\n    const apps=Array.isArray(payload?.apps)?payload.apps:[];\n    return{url,items,apps,sourceName:String(payload?.name||"")}\n  }));\n\n  const current=[],failedSourceIds=new Set();\n  for(const result of results){\n    if(result.status!=="fulfilled"){\n      continue\n    }'''
              new='''  const entries=[...groups.entries()];\n  const results=await Promise.allSettled(entries.map(async([url,items])=>{\n    const payload=await requestSourceJSON(url,3.5);\n    const apps=Array.isArray(payload?.apps)?payload.apps:[];\n    return{url,items,apps,sourceName:String(payload?.name||"")}\n  }));\n\n  const current=[],failedSources=[];\n  for(let i=0;i<results.length;i++){\n    const result=results[i];\n    if(result.status!=="fulfilled"){\n      const [url,items]=entries[i];\n      const names=[...new Set(items.map(item=>state.lastCurrent[watchKey(item)]?.sourceName||item.sourceId||"").filter(Boolean))];\n      if(names.length)failedSources.push(...names);\n      else{\n        try{failedSources.push(new URL(url).hostname.replace(/^www\\./,""))}\n        catch(_){failedSources.push("source")}\n      }\n      continue\n    }'''
              if old not in s: raise SystemExit('getLiveStatus result block not found')
              s=s.replace(old,new,1)

              old='''  const updates=current.filter(app=>state.seen[app.key]&&state.seen[app.key]!==app.version);\n  const offline=results.some(r=>r.status!=="fulfilled");\n  return{updates,total:updates.length,current,checkedAt:new Date(),offline,cached:offline}\n}'''
              new='''  const updates=current.filter(app=>state.seen[app.key]&&state.seen[app.key]!==app.version);\n  const uniqueFailed=[...new Set(failedSources)];\n  const offline=uniqueFailed.length>0;\n  return{updates,total:updates.length,current,checkedAt:new Date(),offline,cached:offline,cacheOnly:false,failedSources:uniqueFailed}\n}'''
              if old not in s: raise SystemExit('getLiveStatus return not found')
              s=s.replace(old,new,1)

              old='''  return{updates:demo,total:demo.length,checkedAt:new Date(),offline:false,demo:true}\n}'''
              new='''  return{updates:demo,total:demo.length,checkedAt:new Date(),offline:false,cached:false,cacheOnly:false,failedSources:[],demo:true}\n}'''
              if old not in s: raise SystemExit('demoStatus return not found')
              s=s.replace(old,new,1)

              marker='''function colors(settings){'''
              helper='''function offlineFooterText(status,settings){\n  const language=settings.language||lang();\n  if(status.cacheOnly){\n    return({cs:"⚠︎ použita cache",en:"⚠︎ cache used",de:"⚠︎ Cache verwendet",es:"⚠︎ caché usada"}[language]||"⚠︎ cache used")\n  }\n  const names=Array.isArray(status.failedSources)?status.failedSources.filter(Boolean):[];\n  if(names.length===1)return "⚠︎ "+names[0];\n  if(names.length>1){\n    const word={cs:"zdroje",en:"sources",de:"Quellen",es:"fuentes"}[language]||"sources";\n    return `⚠︎ ${names.length} ${word}`\n  }\n  return "⚠︎ "+(T[language]?.offline||"offline")\n}\n'''
              if marker not in s: raise SystemExit('colors marker not found')
              s=s.replace(marker,helper+marker,1)

              old='''    if(status.offline){\n      const off=footer.addText("⚠︎ "+W.offline);off.font=Font.mediumSystemFont(L.footer);off.textColor=c.red\n    }else if(settings.showTime!==false){'''
              new='''    if(status.offline){\n      const off=footer.addText(offlineFooterText(status,settings));off.font=Font.mediumSystemFont(L.footer);off.textColor=c.red;off.lineLimit=1;off.minimumScaleFactor=.6\n    }else if(settings.showTime!==false){'''
              if old not in s: raise SystemExit('footer offline block not found')
              s=s.replace(old,new,1)

              p.write_text(s,encoding='utf-8')

          src=p.read_text(encoding='utf-8')
          pkg_path=Path('apps/Sideload-Watch/Sideload Watch.scriptable')
          pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg['script']=src
          pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('apps/Sideload-Watch/version.json').write_text(json.dumps({'version':'0.2.13'},indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate
        run: |
          cp 'apps/Sideload-Watch/Sideload Watch.js' /tmp/SideloadWatch.mjs
          node --check /tmp/SideloadWatch.mjs
          python - <<'PY'
          from pathlib import Path
          import json
          src=Path('apps/Sideload-Watch/Sideload Watch.js').read_text(encoding='utf-8')
          pkg=json.loads(Path('apps/Sideload-Watch/Sideload Watch.scriptable').read_text(encoding='utf-8'))
          ver=json.loads(Path('apps/Sideload-Watch/version.json').read_text(encoding='utf-8'))
          assert 'const APP_VERSION = "0.2.13";' in src
          assert pkg['script']==src
          assert ver['version']=='0.2.13'
          assert 'failedSources' in src and 'cacheOnly' in src and 'offlineFooterText' in src
          assert '⚠︎ použita cache' in src
          print('Sideload Watch v0.2.13 source diagnostics OK')
          PY

      - name: Commit app files
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add 'apps/Sideload-Watch/Sideload Watch.js' 'apps/Sideload-Watch/Sideload Watch.scriptable' 'apps/Sideload-Watch/version.json'
          git commit -m 'Improve Sideload Watch offline source status'
          git push origin HEAD:Master
