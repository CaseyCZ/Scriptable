name: Clean community duplicates

on:
  workflow_dispatch:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/clean-community-duplicates.yml'

permissions:
  contents: write
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Remove duplicate community entries and add runtime guard
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const indexPath = 'index.html';
          const extraPath = 'community-extra.js';
          let index = fs.readFileSync(indexPath, 'utf8');
          const extraSource = fs.readFileSync(extraPath, 'utf8');

          const arrayMatch = index.match(/const communityApps=\[(.*?)\];\s*communityApps\.push\(\.\.\.\(window\.communityExtraApps\|\|\[\]\)\);/s);
          if (!arrayMatch) throw new Error('communityApps block or push marker not found');

          const builtCtx = {};
          vm.runInNewContext(`communityApps=[${arrayMatch[1]}]`, builtCtx, { timeout: 2000 });
          const builtins = builtCtx.communityApps || [];

          const extraCtx = { window: {} };
          vm.runInNewContext(extraSource, extraCtx, { timeout: 2000 });
          const extras = extraCtx.window.communityExtraApps || [];

          function canonicalUrl(value) {
            if (!value) return '';
            try {
              const u = new URL(String(value));
              u.hash = '';
              u.search = '';
              u.hostname = u.hostname.toLowerCase();
              if (u.hostname === 'raw.githubusercontent.com') {
                const parts = u.pathname.split('/').filter(Boolean);
                if (parts.length >= 4) {
                  parts[0] = parts[0].toLowerCase();
                  parts[1] = parts[1].toLowerCase();
                  if (parts[2] === 'refs' && parts[3] === 'heads' && parts.length >= 6) {
                    parts.splice(2, 2);
                  }
                  u.pathname = '/' + parts.join('/');
                }
              }
              return u.toString().replace(/\/$/, '');
            } catch (_) {
              return String(value).trim();
            }
          }

          function normalizedText(value) {
            return String(value || '')
              .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
          }

          function nameKey(app) {
            return normalizedText(app.author) + '|' + normalizedText(app.name);
          }

          const seenUrls = new Map();
          const seenNames = new Map();
          for (const app of builtins) {
            const url = canonicalUrl(app.file);
            if (url) seenUrls.set(url, `index.html: ${app.author}/${app.name}`);
            const nk = nameKey(app);
            if (nk !== '|') seenNames.set(nk, `index.html: ${app.author}/${app.name}`);
          }

          const kept = [];
          const removed = [];
          for (const app of extras) {
            const url = canonicalUrl(app.file);
            const nk = nameKey(app);
            const duplicateOf = (url && seenUrls.get(url)) || (nk !== '|' && seenNames.get(nk));
            if (duplicateOf) {
              removed.push({ name: app.name, author: app.author, file: app.file, duplicateOf });
              continue;
            }
            kept.push(app);
            if (url) seenUrls.set(url, `community-extra.js: ${app.author}/${app.name}`);
            if (nk !== '|') seenNames.set(nk, `community-extra.js: ${app.author}/${app.name}`);
          }

          function q(value) { return JSON.stringify(value); }
          const byAuthor = new Map();
          for (const app of kept) {
            const key = app.author || 'Unknown';
            if (!byAuthor.has(key)) byAuthor.set(key, []);
            byAuthor.get(key).push(app);
          }

          let out = `// Curated community catalog extension for CaseyCZ Scriptable Apps.\n// Original code remains hosted by the original authors. This file stores metadata only.\nconst communityItem=(name,category,author,icon,file,filename,source,preview,tags,cs,en)=>({\n  name,category,author,icon,file,filename,source,preview,tags,\n  description:{cs,en},\n  features:{\n    cs:['Původní komunitní projekt','Stahování přímo od autora','Nastavení a požadavky v dokumentaci autora'],\n    en:['Original community project','Direct download from the author','Setup and requirements in the author documentation']\n  }\n});\n\nwindow.communityExtraApps=[\n`;
          for (const [author, apps] of byAuthor) {
            out += `// ${author} — ${apps.length}\n`;
            for (const app of apps) {
              out += `communityItem(${q(app.name)},${q(app.category)},${q(app.author)},${q(app.icon)},${q(app.file)},${q(app.filename)},${q(app.source)},${q(app.preview)},${JSON.stringify(app.tags || [])},${q(app.description?.cs || '')},${q(app.description?.en || '')}),\n`;
            }
            out += '\n';
          }
          out += '];\n';
          fs.writeFileSync(extraPath, out);

          const guard = `function canonicalCommunityUrl(value){if(!value)return '';try{const u=new URL(String(value));u.hash='';u.search='';u.hostname=u.hostname.toLowerCase();if(u.hostname==='raw.githubusercontent.com'){const p=u.pathname.split('/').filter(Boolean);if(p.length>=4){p[0]=p[0].toLowerCase();p[1]=p[1].toLowerCase();if(p[2]==='refs'&&p[3]==='heads'&&p.length>=6)p.splice(2,2);u.pathname='/'+p.join('/')}}return u.toString().replace(/\\/$/,'')}catch(_){return String(value).trim()}}\n    function normalizedCommunityIdentity(app){const clean=v=>String(v||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();return clean(app.author)+'|'+clean(app.name)}\n    const communitySeenUrls=new Set(communityApps.map(app=>canonicalCommunityUrl(app.file)).filter(Boolean));\n    const communitySeenNames=new Set(communityApps.map(normalizedCommunityIdentity).filter(key=>key!=='|'));\n    for(const app of (window.communityExtraApps||[])){const url=canonicalCommunityUrl(app.file),nameKey=normalizedCommunityIdentity(app);if((url&&communitySeenUrls.has(url))||(nameKey!=='|'&&communitySeenNames.has(nameKey)))continue;if(url)communitySeenUrls.add(url);if(nameKey!=='|')communitySeenNames.add(nameKey);communityApps.push(app)}`;
          index = index.replace('communityApps.push(...(window.communityExtraApps||[]));', guard);
          fs.writeFileSync(indexPath, index);

          console.log(`Built-in community entries: ${builtins.length}`);
          console.log(`Extra entries before cleanup: ${extras.length}`);
          console.log(`Removed duplicates: ${removed.length}`);
          console.log(`Extra entries after cleanup: ${kept.length}`);
          for (const item of removed) console.log(`DUPLICATE: ${item.author}/${item.name} -> ${item.duplicateOf}`);
          NODE

          node --check community-extra.js
          grep -q 'communitySeenUrls' index.html

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html community-extra.js
          if ! git diff --cached --quiet; then
            git commit -m 'Remove duplicate community projects'
            git push origin HEAD:Master
          fi

      - name: Remove one-time workflow
        run: |
          git pull --rebase origin Master
          git rm .github/workflows/clean-community-duplicates.yml
          git commit -m 'Remove one-time duplicate cleanup workflow'
          git push origin HEAD:Master

      - name: Deploy website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref Master
