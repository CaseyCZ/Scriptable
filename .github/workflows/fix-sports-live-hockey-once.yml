name: Fix Sports Live hockey once

on:
  push:
    paths:
      - '.github/workflows/fix-sports-live-hockey-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Match Sports Info fail-open data handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/Sports-Live/Sports-Live,js')
          s = p.read_text(encoding='utf-8')
          old_prepare = 'const [events,rows]=await Promise.all([eventsFor(s),tableFor(s)]),all=events.filter(e=>eventMatchesTeam(e,s)).sort((a,b)=>new Date(a.date)-new Date(b.date)),now=Date.now();'
          new_prepare = 'const events=await eventsFor(s);let rows=[];try{rows=await tableFor(s)}catch(e){console.log(e)}const all=events.filter(e=>eventMatchesTeam(e,s)).sort((a,b)=>new Date(a.date)-new Date(b.date)),now=Date.now();'
          if old_prepare not in s:
              raise SystemExit('Old prepareData Promise.all block not found')
          s = s.replace(old_prepare, new_prepare, 1)
          s = s.replace('// Sports Live v0.2.1', '// Sports Live v0.2.2', 1)
          s = s.replace('const APP_VERSION = "0.2.1";', 'const APP_VERSION = "0.2.2";', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate Sports Live
        run: |
          node --check 'apps/Sports-Live/Sports-Live,js'
          grep -F 'const APP_VERSION = "0.2.2";' 'apps/Sports-Live/Sports-Live,js'
          grep -F 'try{rows=await tableFor(s)}catch(e){console.log(e)}' 'apps/Sports-Live/Sports-Live,js'
          grep -F 'function norm(v){try{return String(v||"").normalize("NFD")' 'apps/Sports-Live/Sports-Live,js'

      - name: Remove one-time workflow
        run: git rm .github/workflows/fix-sports-live-hockey-once.yml

      - name: Commit and push
        run: |
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add -A
          git commit -m "Fix hockey data handling in Sports Live"
          git push origin Master
