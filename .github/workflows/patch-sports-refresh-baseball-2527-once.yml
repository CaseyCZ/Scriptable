name: Patch Sports Info 2.5.27 refresh/baseball once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/patch-sports-refresh-baseball-2527-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Apply Sports Info 2.5.27 patch
        run: python .github/scripts/patch_sports_refresh_baseball_2527_once.py

      - name: Validate main JavaScript syntax
        run: |
          cp 'apps/Sports-Info/Sports Info.js' /tmp/SportsInfo.mjs
          node --check /tmp/SportsInfo.mjs

      - name: Build package and release surfaces
        run: python .github/scripts/build_sports_info_package.py

      - name: Render and validate settings WebView JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('apps/Sports-Info/Sports Info.js','utf8');
          const marker='let SETTINGS=await firstLanguage(loadSettings());';
          const i=src.indexOf(marker); if(i<0)throw new Error('main marker missing');
          const fm={documentsDirectory:()=>'/tmp',cacheDirectory:()=>'/tmp',joinPath:(a,b)=>a+'/'+b,fileExists:()=>false,readString:()=>'',writeString:()=>{},remove:()=>{},readImage:()=>null,writeImage:()=>{},listContents:()=>[]};
          const ctx={console,FileManager:{local:()=>fm,iCloud:()=>fm},Device:{locale:()=> 'cs-CZ',isUsingDarkAppearance:()=>true,screenSize:()=>({width:430,height:932})},config:{runsInWidget:false},args:{queryParameters:{}},module:{filename:'/tmp/Sports Info.js'}};
          vm.createContext(ctx);
          vm.runInContext(src.slice(0,i)+'\nglobalThis.__AUDIT_HTML=html(merge({...DEFAULTS,language:"cs"}));',ctx);
          fs.writeFileSync('/tmp/sports-settings.html',ctx.__AUDIT_HTML);
          const m=ctx.__AUDIT_HTML.match(/<script>([\s\S]*?)<\/script>/); if(!m)throw new Error('settings script missing');
          fs.writeFileSync('/tmp/sports-settings-ui.js',m[1]);
          NODE
          node --check /tmp/sports-settings-ui.js

      - name: Audit settings UI wiring
        run: python .github/scripts/audit_sports_info_ui.py

      - name: Test iPhone table geometry and package parity
        run: node .github/scripts/test_sports_info_layout.cjs

      - name: Validate refresh and current-sport contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          app=Path('apps/Sports-Info')
          src=(app/'Sports Info.js').read_text(encoding='utf-8')
          pkg=json.loads((app/'Sports Info.scriptable').read_text(encoding='utf-8'))
          assert '\r' not in src, 'Sports Info.js must be LF normalized'
          assert 'const APP_VERSION = "2.5.27";' in src
          assert 'config.runsInWidget?12000:24000' in src
          assert 'if(config.runsInWidget)return null;' in src
          assert 'URLScheme.forRunningScript()' in src
          assert 'sportsTap=1&sportsFamily=' in src
          assert 'const TAP_FAMILY=' in src
          assert 'await widget(SETTINGS,TAP_FAMILY)' in src
          assert "resetTeam();commitNow()" in src
          assert "document.getElementById('leagueId').addEventListener('change',()=>{resetTeam();commitNow()})" in src
          assert "document.getElementById('teamId').addEventListener('change',commitNow)" in src
          assert "x.addEventListener('change',commitNow)" in src
          assert 'String(r.source||"").toUpperCase()' in src
          assert 'w.refreshAfterDate=new Date(Date.now()+autoRefreshMinutes(s,d)*60000)' in src
          assert pkg['script']==src, 'package script mismatch'
          assert pkg['name']=='Sports Info' and pkg.get('always_run_in_app') is False
          assert '**Sports Info v2.5.27 — Production**' in (app/'README.md').read_text(encoding='utf-8')
          assert '| 🏆 **Sports Info** | ✅ v2.5.27 |' in Path('README.md').read_text(encoding='utf-8')
          assert "{name:'Sports Info',version:'2.5.27'" in Path('index.html').read_text(encoding='utf-8')
          print('PASS Sports Info 2.5.27 refresh/current sport contracts')
          PY

      - name: Commit Sports Info 2.5.27 release
        run: |
          git config user.name "CaseyCZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            'apps/Sports-Info/Sports Info.js' \
            'apps/Sports-Info/Sports Info.scriptable' \
            'apps/Sports-Info/README.md' \
            'README.md' \
            'index.html'
          git commit -m "Sports Info 2.5.27 fix refresh and selected sport"
          git push origin HEAD:Master
