name: Move community status inline

on:
  workflow_dispatch:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/move-community-status-inline.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Put availability beside author
        run: |
          python3 <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = "const author=external?`<div class=\"author\">${tr('Autor','Author')}: ${app.author}</div>`:'';const availability=external?communityStatusBadge(app):'';"
          new = "const author=external?`<div class=\"authorStatusRow\"><div class=\"author\">${tr('Autor','Author')}: ${app.author}</div>`:'';const availability=external?communityStatusBadge(app)+`</div>`:'';"
          if old not in text:
              raise SystemExit('card author/status pattern not found')
          text = text.replace(old, new, 1)
          text = text.replace('ios-hub-visual.css?v=20261008-filters1', 'ios-hub-visual.css?v=20261008-authorstatus1', 1)
          index.write_text(text, encoding='utf-8')

          css = Path('ios-hub-visual.css')
          styles = css.read_text(encoding='utf-8')
          marker = '/* Community card author + availability on one line */'
          if marker not in styles:
              styles += '''\n\n/* Community card author + availability on one line */\n.authorStatusRow{display:flex;align-items:center;gap:6px;min-width:0;margin-top:4px;white-space:nowrap}\n.authorStatusRow .author{margin-top:0;min-width:0;max-width:100%;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.authorStatusRow .communityAvailability{margin-top:0;flex:0 0 auto}\n'''
          css.write_text(styles, encoding='utf-8')
          PY

          grep -q 'authorStatusRow' index.html
          grep -q 'authorStatusRow' ios-hub-visual.css

      - name: Commit and clean up
        run: |
          git config user.name 'CaseyCZ'
          git config user.email '25530709+CaseyCZ@users.noreply.github.com'
          git rm .github/workflows/move-community-status-inline.yml
          git add index.html ios-hub-visual.css
          git commit -m 'Show community status beside author'
          git push origin Master

      - name: Deploy website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref Master
