name: Handle redirected HTML scrapers

on:
  push:
    branches: [Master]
    paths:
      - ".github/workflows/patch-runtime-redirect-scraper.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Patch checker
        run: python tools/_patch_redirect_scraper.py

      - name: Commit patch and remove helpers
        run: |
          rm .github/workflows/patch-runtime-redirect-scraper.yml
          rm tools/_patch_redirect_scraper.py
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add tools/update_community_status.py .github/workflows/patch-runtime-redirect-scraper.yml tools/_patch_redirect_scraper.py
          git commit -m "Handle redirected HTML scraper dependencies"
          git push origin HEAD:Master
