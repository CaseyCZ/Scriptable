name: Temporary Sideload Watch medium vertical tune

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/zz-temp-sideload-medium-down.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master

      - name: Patch Sideload Watch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          app=Path('apps/Sideload-Watch')
          p=app/'Sideload Watch.js'
          s=p.read_text(encoding='utf-8')

          s=s.replace('// Sideload Watch v0.2.22','// Sideload Watch v0.2.23',1)
          s=s.replace('const APP_VERSION = "0.2.22";','const APP_VERSION = "0.2.23";',1)

          old='w.addSpacer(large?10:8);\n      const columns=w.addStack();'
          new='w.addSpacer(large?10:28);\n      const columns=w.addStack();'
          if old not in s:
              raise SystemExit('medium spacer marker missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          (app/'version.json').write_text(json.dumps({'version':'0.2.23'},indent=2)+'\n',encoding='utf-8')

          pkg_path=app/'Sideload Watch.scriptable'
          if pkg_path.exists():
              pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
              pkg['script']=s
              pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate
        run: |
          cp 'apps/Sideload-Watch/Sideload Watch.js' /tmp/sideload.mjs
          node --check /tmp/sideload.mjs
          grep -q 'const APP_VERSION = "0.2.23";' 'apps/Sideload-Watch/Sideload Watch.js'
          grep -q 'w.addSpacer(large?10:28)' 'apps/Sideload-Watch/Sideload Watch.js'

      - name: Commit app files
        run: |
          git config user.name 'CaseyCZ'
          git config user.email '25530709+CaseyCZ@users.noreply.github.com'
          git add 'apps/Sideload-Watch/Sideload Watch.js' 'apps/Sideload-Watch/version.json' 'apps/Sideload-Watch/Sideload Watch.scriptable'
          git commit -m 'Move Sideload Watch medium summary lower'
          git push origin HEAD:Master
