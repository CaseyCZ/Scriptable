name: Enhance Sports Info 2.5 once
on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/enhance-sports-info-250-once.yml'
      - '.github/scripts/enhance_sports_info_250_once.py'
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master
      - name: Apply Sports Info 2.5 patch
        run: python .github/scripts/enhance_sports_info_250_once.py
      - name: Validate JavaScript
        run: |
          cp 'apps/Sports-Info/Sports Info.js' /tmp/SportsInfo.mjs
          node --check /tmp/SportsInfo.mjs
      - name: Build Scriptable package
        run: python .github/scripts/build_sports_info_package.py
      - name: Validate release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('apps/Sports-Info/Sports Info.js').read_text(encoding='utf-8')
          pkg=json.loads(Path('apps/Sports-Info/Sports Info.scriptable').read_text(encoding='utf-8'))
          assert 'const APP_VERSION = "2.5.0";' in src
          assert pkg['script']==src and pkg['name']=='Sports Info'
          for marker in ['ofCompetition:159','oneFootballBundle','oneFootballHealth','OneFootball + ESPN + FotMob','maxRows=Math.min(all.length,d.current?8:16)','eventMatches(e,s)','apiOneFootballFeedBase']:
              assert marker in src, marker
          assert 'apps/Football-Info' not in Path('.github/workflows/build-sports-info-package.yml').read_text(encoding='utf-8')
          print('Sports Info 2.5.0 validation OK')
          PY
      - name: Commit release
        run: |
          git config user.name "CaseyCZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add 'apps/Sports-Info/Sports Info.js' 'apps/Sports-Info/Sports Info.scriptable' 'apps/Sports-Info/README.md' README.md index.html
          if git diff --cached --quiet; then
            echo "No release changes"
            exit 0
          fi
          git commit -m "Improve Sports Info football data"
          git push origin HEAD:Master
