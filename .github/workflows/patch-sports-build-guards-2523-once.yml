name: Patch Sports Info 2.5.23 permanent guards once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/patch-sports-build-guards-2523-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Apply permanent 2.5.23 guards
        run: python .github/scripts/patch_sports_build_guards_2523_once.py

      - name: Verify guard markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/build-sports-info-package.yml').read_text(encoding='utf-8')
          for x in [
              "!['left','center','right'].includes(L.tableAlign)",
              "document.querySelectorAll('#layoutLargeTable input[type=number]')",
              "let slack=target-(teamWidth+4+statsWidth)",
              "teamMin=96,teamMax=150",
              "if(config.runsInWidget)",
              "const target=module.filename",
          ]:
              assert x in s, x
          print('2.5.23 permanent guards present')
          PY

      - name: Commit permanent guards
        run: |
          git config user.name "CaseyCZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/build-sports-info-package.yml
          git commit -m "Guard Sports Info 2.5.23 AUTO layout"
          git push origin HEAD:Master
