name: Probe SofaScore floorball API

on:
  push:
    paths:
      - '.github/workflows/probe-sofascore-floorball.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect standings feeds
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'
          curl -sS -L \
            -H "User-Agent: $UA" \
            -H 'Accept: text/html,application/xhtml+xml,*/*;q=0.8' \
            -H 'Accept-Language: en-US,en;q=0.9,cs;q=0.8' \
            -H 'Referer: https://www.livesport.com/' \
            'https://www.livesport.com/floorball/czech-republic/livesport-superliga/standings/' \
            -o /tmp/standings.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/standings.html').read_text('utf-8','ignore')
          feeds=re.findall(r'cjs\.initialFeeds\["([^"]+)"\]\s*=\s*\{\s*data:\s*`([\s\S]*?)`',s)
          print('FEED COUNT',len(feeds))
          for name,data in feeds:
              print('\n=== FEED',name,'len',len(data),'===')
              print(data[:1800].replace('\n',' '))
          for term in ['table','standings','overall','home','away','TI÷','TN÷','participantId','participantName','teamId','teamName']:
              print('\nTERM',term,'COUNT',s.count(term))
              start=0
              for _ in range(3):
                  i=s.find(term,start)
                  if i<0: break
                  print(s[max(0,i-350):i+1000].replace('\n',' ')[:1400])
                  start=i+len(term)
          PY
