name: Expand beginner guide once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/expand-beginner-guide-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Expand guide for beginners
        run: |
          node tools/expand-guide-once.cjs
          node tools/audit-web-csp.cjs
          grep -q '<div class="step">8</div>' guide.html
          grep -q 'const PAGE_SIZE=30;' assets/js/index-page.js

      - name: Commit guide update
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add guide.html
          if git diff --cached --quiet; then
            echo "Guide already expanded"
            exit 0
          fi
          git commit -m "Expand getting started guide for beginners"
          git push origin HEAD:Master
