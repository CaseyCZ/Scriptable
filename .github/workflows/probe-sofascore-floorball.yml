name: Probe SofaScore floorball API

on:
  push:
    paths:
      - '.github/workflows/probe-sofascore-floorball.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect modern standings feeds
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36'
          urls=(
            'https://global.flashscore.ninja/1/x/feed/tx_UJqgfqC7_jT09Tape'
            'https://global.flashscore.ninja/1/x/feed/to_UJqgfqC7_jT09Tape_1'
          )
          n=0
          for url in "${urls[@]}"; do
            n=$((n+1)); out="/tmp/feed$n.txt"
            echo "=== $url ==="
            code=$(curl -sS -L \
              -H "User-Agent: $UA" \
              -H 'Accept: */*' \
              -H 'Accept-Language: cs-CZ,cs;q=0.9,en;q=0.8' \
              -H 'Referer: https://www.livesport.cz/' \
              -H 'Origin: https://www.livesport.cz' \
              -H 'x-fsign: SW9D1eZo' \
              -o "$out" -w '%{http_code}' "$url")
            echo "HTTP $code SIZE $(wc -c < "$out")"
            python3 - "$out" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); b=p.read_bytes(); print('FIRST_BYTES',repr(b[:300]));
          try:s=b.decode('utf-8')
          except Exception:s=b.decode('latin1','replace')
          print('TEXT_HEAD',s[:12000])
          print('COUNTS', {x:s.count(x) for x in ['~','¬','÷','TI÷','TN÷','AE÷','AF÷','participant','Vítkovice','Střešovice','Mladá Boleslav']})
          PY
          done
