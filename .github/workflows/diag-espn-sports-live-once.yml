name: Diagnose Sports Live ESPN once

on:
  push:
    paths:
      - '.github/workflows/diag-espn-sports-live-once.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Test ESPN team and schedule endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, datetime

          base='https://site.api.espn.com/apis/site/v2/sports'
          leagues=[('hockey','nhl'),('basketball','nba'),('baseball','mlb')]
          today=datetime.date.today()
          start=(today-datetime.timedelta(days=30)).strftime('%Y%m%d')
          end=(today+datetime.timedelta(days=90)).strftime('%Y%m%d')

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)

          for sport,league in leagues:
              print('\n===',sport,league,'===')
              teams=get(f'{base}/{sport}/{league}/teams?limit=500')
              arr=teams.get('sports',[{}])[0].get('leagues',[{}])[0].get('teams',[])
              print('teams:',len(arr))
              first=(arr[0].get('team') if arr else {}) or {}
              tid=str(first.get('id',''))
              print('first team:',tid,first.get('displayName'))

              board=get(f'{base}/{sport}/{league}/scoreboard?dates={start}-{end}&limit=1000')
              events=board.get('events',[])
              print('league scoreboard events:',len(events))
              scoped=[]
              for e in events:
                  comp=(e.get('competitions') or [{}])[0]
                  for c in comp.get('competitors',[]):
                      if str((c.get('team') or {}).get('id',''))==tid:
                          scoped.append(e); break
              print('first team events in scoreboard:',len(scoped))
              print('sample scoreboard dates:',[e.get('date') for e in scoped[:5]])

              urls=[
                  f'{base}/{sport}/{league}/teams/{tid}/schedule',
                  f'{base}/{sport}/{league}/teams/{tid}/schedule?season={today.year}',
              ]
              for u in urls:
                  try:
                      d=get(u)
                      ev=d.get('events',[])
                      print('team schedule:',u,'events=',len(ev),'sample=',[e.get('date') for e in ev[:5]])
                  except Exception as ex:
                      print('team schedule ERROR:',u,repr(ex))
          PY
