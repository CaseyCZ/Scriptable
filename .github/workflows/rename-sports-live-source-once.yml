name: Rename Sports Live source once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/rename-sports-live-source-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Rename source and update references
        run: |
          python - <<'PY'
          from pathlib import Path

          app=Path('apps/Sports-Live')
          old=app/'Sports-Live,js'
          new=app/'Sports Live.js'
          if old.exists():
              old.rename(new)
          assert new.exists(), 'Sports Live.js missing after rename'

          replacements={
              'Sports-Live%2Cjs':'Sports%20Live.js',
              'Sports-Live,js':'Sports Live.js',
              './Sports Live.js':'./Sports%20Live.js',
              "./apps/Sports-Live/Sports Live.js":"./apps/Sports-Live/Sports%20Live.js",
          }
          targets=[new, app/'README.md', app/'README_EN.md', Path('assets/js/index-page.js')]
          for path in targets:
              text=path.read_text(encoding='utf-8')
              for before,after in replacements.items():
                  text=text.replace(before,after)
              path.write_text(text,encoding='utf-8')
          PY

      - name: Rebuild Scriptable package
        run: python .github/scripts/build_sports_live_package.py

      - name: Validate renamed source
        run: |
          cp 'apps/Sports-Live/Sports Live.js' /tmp/SportsLive.mjs
          node --check /tmp/SportsLive.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          app=Path('apps/Sports-Live')
          src=(app/'Sports Live.js').read_text(encoding='utf-8')
          pkg=json.loads((app/'Sports Live.scriptable').read_text(encoding='utf-8'))
          site=Path('assets/js/index-page.js').read_text(encoding='utf-8')
          assert not (app/'Sports-Live,js').exists()
          assert pkg['script']==src
          assert pkg['name']=='Sports Live'
          assert 'https://raw.githubusercontent.com/CaseyCZ/Scriptable/Master/apps/Sports-Live/Sports%20Live.js' in src
          assert 'Sports-Live,js' not in src and 'Sports-Live%2Cjs' not in src
          assert "file:'./apps/Sports-Live/Sports%20Live.js'" in site
          assert "install:'./apps/Sports-Live/Sports%20Live.scriptable'" in site
          for p in [app/'README.md',app/'README_EN.md']:
              text=p.read_text(encoding='utf-8')
              assert './Sports%20Live.js' in text
              assert 'Sports-Live,js' not in text and 'Sports-Live%2Cjs' not in text
          print('Sports Live source rename and package parity: OK')
          PY
          if git grep -n -E 'Sports-Live,js|Sports-Live%2Cjs' -- apps/Sports-Live assets/js/index-page.js; then
            echo 'Old Sports Live source reference remains in release surfaces'
            exit 1
          fi

      - name: Commit rename
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add -A -- apps/Sports-Live assets/js/index-page.js
          if git diff --cached --quiet; then
            echo "Sports Live source already renamed"
            exit 0
          fi
          git commit -m "Rename Sports Live source and sync package"
          git push origin HEAD:Master
