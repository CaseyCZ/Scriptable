name: Probe Livesport standings once
on:
  push:
    branches: [Master]
    paths: ['.github/workflows/probe-livesport-standings-once.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe standings config and feeds
        shell: python
        run: |
          import re, urllib.request, json
          urls = {
            'hockey':'https://www.livesport.com/hockey/czech-republic/extraliga/standings/',
            'basketball':'https://www.livesport.com/basketball/czech-republic/nbl/standings/',
            'floorball':'https://www.livesport.com/floorball/czech-republic/livesport-superliga/standings/',
            'baseball':'https://www.livesport.com/baseball/czech-republic/extraliga/standings/',
          }
          H={'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1','Accept-Language':'en-US,en;q=0.9'}
          for name,url in urls.items():
            req=urllib.request.Request(url,headers=H)
            with urllib.request.urlopen(req,timeout=20) as r: html=r.read().decode('utf-8','replace')
            print('\n###',name,'bytes',len(html))
            for key in ['tournament_id','season_id','feed_sign','tournamentId','seasonId','tournamentStageId','sportId']:
              vals=[]
              for pat in [rf'"{key}"\s*:\s*"?([^",}}]+)',rf'{key}\s*[=:]\s*["\']([^"\']+)']:
                vals += re.findall(pat,html,re.I)
              print(key, list(dict.fromkeys(vals))[:10])
            for pat in [r'/standings/([A-Za-z0-9_-]+)/', r'/table/([A-Za-z0-9_-]+)/', r'([A-Za-z0-9]{8})_table_overall']:
              vals=re.findall(pat,html)
              if vals: print('pat',pat,list(dict.fromkeys(vals))[:20])
            # compact contexts around potentially useful config tokens
            for token in ['feed_sign','tournament_id','season_id','tournamentStageId','standings/']:
              i=html.find(token)
              if i>=0: print('CTX',token,re.sub(r'\s+',' ',html[max(0,i-180):i+300])[:500])
