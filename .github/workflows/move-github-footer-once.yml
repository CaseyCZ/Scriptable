name: Move GitHub to footer once

on:
  push:
    paths:
      - '.github/workflows/move-github-footer-once.yml'
      - '.github/scripts/move_github_footer_once.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Apply footer sync
        run: python .github/scripts/move_github_footer_once.py

      - name: Validate inline JavaScript
        run: node --check .github/scripts/validate-inline.js
        continue-on-error: true

      - name: Remove one-time helpers
        run: git rm .github/workflows/move-github-footer-once.yml .github/scripts/move_github_footer_once.py

      - name: Commit and push
        run: |
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add -A
          git commit -m "Match Scriptable footer to iOS Hub"
          git push origin Master
