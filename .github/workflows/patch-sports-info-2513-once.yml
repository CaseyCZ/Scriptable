name: Patch Sports Info 2.5.13 once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/patch-sports-info-2513-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Apply dynamic table patch
        run: python .github/scripts/patch_sports_info_2513.py

      - name: Syntax check
        run: node --check 'apps/Sports-Info/Sports Info.js'

      - name: Synchronize package and release metadata
        run: python .github/scripts/build_sports_info_package.py

      - name: Validate universal dynamic table
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          src = Path('apps/Sports-Info/Sports Info.js').read_text(encoding='utf-8')
          pkg = json.loads(Path('apps/Sports-Info/Sports Info.scriptable').read_text(encoding='utf-8'))
          assert 'const APP_VERSION = "2.5.13";' in src
          assert 'function dynamicTableLayout(rows,cols,showLogos)' in src
          assert 'function tableTextWidth(value,size=10,bold=false)' in src
          assert 'const TOTAL=300' in src
          assert 'const maxTeam=Math.max(86,TOTAL-statsWidth)' in src
          assert 't.minimumScaleFactor=1' in src
          assert 'football:[["team","TÝM"],["played","Z"]' in src
          assert 'hockey:[["team","TÝM"],["played","Z"]' in src
          assert 'basketball:[["team","TÝM"],["played","Z"]' in src
          assert 'floorball:[["team","TÝM"],["played","Z"]' in src
          assert 'baseball:[["team","TÝM"],["played","Z"]' in src
          assert pkg['script'] == src
          assert "Sports Info',version:'2.5.13'" in Path('index.html').read_text(encoding='utf-8')
          print('Sports Info 2.5.13 universal dynamic table validation OK')
          PY

      - name: Commit release
        run: |
          git config user.name 'CaseyCZ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'apps/Sports-Info/Sports Info.js' 'apps/Sports-Info/Sports Info.scriptable' 'apps/Sports-Info/README.md' README.md index.html
          git commit -m 'Sports Info 2.5.13 use dynamic standings columns for all sports'
          git push origin Master
