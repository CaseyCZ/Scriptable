  <text x="105" y="206" font-size="19" fill="#ff917e" font-family="Arial,sans-serif" font-weight="700">Počítač / hráč 2</text>
  <text x="105" y="288" font-size="15" fill="#a4cbdb" font-family="Arial,sans-serif">🔵 DOLE</text>
  <text x="105" y="313" font-size="19" fill="#61d6ff" font-family="Arial,sans-serif" font-weight="700">Hráč 1</text>
  <rect x="342" y="25" width="244" height="370" rx="16" fill="url(#pitch)" stroke="#348463" stroke-width="3"/>
  <g fill="#ffffff" opacity=".035">
    <rect x="366" y="28" width="44" height="363"/><rect x="455" y="28" width="44" height="363"/><rect x="542" y="28" width="41" height="363"/>
  </g>
  <g fill="none" stroke="#d4ffe1" stroke-width="2.5" opacity=".62">
    <rect x="354" y="37" width="220" height="346"/>
    <path d="M354 210 H574"/>
    <circle cx="464" cy="210" r="42"/>
    <rect x="414" y="37" width="100" height="44"/><rect x="441" y="37" width="46" height="16"/>
