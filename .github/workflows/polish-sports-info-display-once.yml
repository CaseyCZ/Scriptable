name: Polish Sports Info display once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/polish-sports-info-display-once.yml'
      - '.github/scripts/polish_sports_info_display_once.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master
      - name: Apply display polish
        run: python .github/scripts/polish_sports_info_display_once.py
      - name: Validate JavaScript
        run: |
          cp 'apps/Sports-Info/Sports Info.js' /tmp/SportsInfo.mjs
          node --check /tmp/SportsInfo.mjs
      - name: Build Scriptable package
        run: python .github/scripts/build_sports_info_package.py
      - name: Validate release
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          src=Path('apps/Sports-Info/Sports Info.js').read_text(encoding='utf-8')
          pkg=json.loads(Path('apps/Sports-Info/Sports Info.scriptable').read_text(encoding='utf-8'))
          assert 'const APP_VERSION = "2.4.0";' in src
          assert pkg['script']==src and pkg['name']=='Sports Info'
          for marker in ['value="custom"','panelColor','textColor','mutedColor','liveColor','winColor','teamLabel(t,family)','lineCell(','await matchCard(w,d.current,s,p,family)']:
              assert marker in src, marker
          assert 'apps/Football-Info' not in Path('.github/workflows/build-sports-info-package.yml').read_text(encoding='utf-8')
          print('Sports Info 2.4.0 display polish OK')
          PY
      - name: Commit release
        run: |
          git config user.name "CaseyCZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add 'apps/Sports-Info/Sports Info.js' 'apps/Sports-Info/Sports Info.scriptable' 'apps/Sports-Info/README.md' README.md index.html
          if git diff --cached --quiet; then
            echo "No release changes"
            exit 0
          fi
          git commit -m "Polish Sports Info widget display"
          git push origin HEAD:Master
