name: Patch Sports Info tables once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/patch-sports-info-tables-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sports-info-tables-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest Master
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Patch Sports Info
        run: python .github/scripts/patch_sports_info_253.py

      - name: Validate JavaScript
        run: |
          cp 'apps/Sports-Info/Sports Info.js' /tmp/SportsInfo.mjs
          node --check /tmp/SportsInfo.mjs

      - name: Sync package and release surfaces
        run: python .github/scripts/build_sports_info_package.py

      - name: Commit release
        run: |
          git config user.name "CaseyCZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Sports Info v2.5.3 sport-specific standings and fixture times"
          git push origin HEAD:Master

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload current site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy current Master content
        uses: actions/deploy-pages@v4
