name: Patch Sports Info Livesport standings

on:
  push:
    paths:
      - '.github/workflows/probe-sofascore-floorball.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Patch Sports Info
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path=Path('apps/Sports-Info/Sports Info.js')
          text=path.read_text(encoding='utf-8')

          def once(old,new,label):
              global text
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              text=text.replace(old,new,1)

          once('// Sports Info v2.5.39','// Sports Info v2.5.40','version comment')
          once('const APP_VERSION = "2.5.39";','const APP_VERSION = "2.5.40";','app version')
          once(
              '{id:"floorball.cz",provider:"floorball",lsPath:"/floorball/czech-republic/livesport-superliga/",sofaId:829,sofaSport:"floorball",sportsApiQuery:"Superliga Czechia",flag:"🇨🇿",cs:"Livesport Superliga",en:"Czech Livesport Superliga",de:"Tschechische Livesport Superliga",es:"Livesport Superliga Checa"}',
              '{id:"floorball.cz",provider:"livesport",lsPath:"/floorball/czech-republic/livesport-superliga/",flag:"🇨🇿",cs:"Livesport Superliga",en:"Czech Livesport Superliga",de:"Tschechische Livesport Superliga",es:"Livesport Superliga Checa"}',
              'Czech floorball mapping'
          )

          marker='async function livesportBundle(s){'
          start=text.index(marker)
          end=text.index('\n\nconst SPORTSAPI_MEM={};',start)
          replacement=r'''async function livesportDynamicTable(s,html){
  const feed=lsFeed(html,"summary-results")||lsFeed(html,"summary-fixtures"),head=String(feed||"").split("¬~AA÷")[0],meta=lsFields(head),tournament=meta.ZE||"",stage=meta.ZC||"";
  if(!tournament||!stage)throw new Error("Livesport table ids missing");
  const headers=Object.assign({},LIVESPORT_HEADERS,{"Accept":"*/*","Accept-Language":"cs-CZ,cs;q=0.9,en;q=0.8","Referer":"https://www.livesport.cz/","Origin":"https://www.livesport.cz","x-fsign":"SW9D1eZo"});
  const raw=await requestText(`https://global.flashscore.ninja/1/x/feed/to_${encodeURIComponent(tournament)}_${encodeURIComponent(stage)}_1`,headers),rows=lsRows(raw);
  if(!rows.length)throw new Error("Livesport standings returned 0 rows");
  return rows
}
async function livesportBundle(s){
  const m=league(s),key=`ls:${m.id}`;
  if(LIVESPORT_MEM[key])return LIVESPORT_MEM[key];
  if(!m.lsPath)throw new Error("No Livesport mapping");
  const base=`https://www.livesport.com${m.lsPath}`,pages=await Promise.allSettled([requestText(base,LIVESPORT_HEADERS),requestText(base+"standings/",LIVESPORT_HEADERS)]),html=pages[0].status==="fulfilled"?pages[0].value:"",standHtml=pages[1].status==="fulfilled"?pages[1].value:"",events=unique([...lsEvents(lsFeed(html,"summary-results")),...lsEvents(lsFeed(html,"summary-fixtures"))]);
  let table=[];
  for(const f of lsAllFeeds(standHtml)){const r=lsRows(f.data);if(r.length>table.length)table=r}
  if(!table.length)try{table=await livesportDynamicTable(s,html||standHtml)}catch(e){console.log(`Livesport standings: ${String(e?.message||e)}`)}
  if(!table.length&&m.sofaId)try{table=(await sofaBundle(s)).table||[]}catch(_){}
  if(!events.length&&!table.length)throw new Error("Livesport returned no data");
  const map=new Map();
  for(const x of table)if(x.id)map.set(x.id,{id:x.id,name:x.name,short:x.short,logo:""});
  for(const e of events)for(const t of[e.home,e.away])if(t.id)map.set(t.id,{id:t.id,name:t.name,short:t.short,logo:t.logo});
  const out={events,teams:[...map.values()].sort((a,b)=>a.name.localeCompare(b.name)),table};
  LIVESPORT_MEM[key]=out;
  return out
}'''
          text=text[:start]+replacement+text[end:]

          old='if(m.provider==="livesport"){const d=await limited(()=>livesportBundle(s),9000,"Livesport");return `Livesport OK · ${d.events.length} events`}'
          new='if(m.provider==="livesport"){const d=await limited(()=>livesportBundle(s),9000,"Livesport");return `Livesport OK · ${d.events.length} events · ${d.table.length} rows`}'
          once(old,new,'Livesport diagnostics')

          path.write_text(text,encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          cp 'apps/Sports-Info/Sports Info.js' /tmp/SportsInfo.mjs
          node --check /tmp/SportsInfo.mjs

      - name: Verify patch markers
        shell: bash
        run: |
          grep -F 'const APP_VERSION = "2.5.40";' 'apps/Sports-Info/Sports Info.js'
          grep -F 'id:"floorball.cz",provider:"livesport"' 'apps/Sports-Info/Sports Info.js'
          grep -F 'global.flashscore.ninja/1/x/feed/to_' 'apps/Sports-Info/Sports Info.js'
          grep -F 'Livesport OK · ${d.events.length} events · ${d.table.length} rows' 'apps/Sports-Info/Sports Info.js'

      - name: Live-check Czech floorball standings feed
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'
          curl -sS -L -H "User-Agent: $UA" -H 'Accept-Language: en-US,en;q=0.9,cs;q=0.8' -H 'Referer: https://www.livesport.com/' 'https://www.livesport.com/floorball/czech-republic/livesport-superliga/' -o /tmp/league.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/league.html').read_text('utf-8','ignore')
          m=re.search(r'cjs\.initialFeeds\["summary-results"\]\s*=\s*\{\s*data:\s*`([\s\S]*?)`',s) or re.search(r'cjs\.initialFeeds\["summary-fixtures"\]\s*=\s*\{\s*data:\s*`([\s\S]*?)`',s)
          if not m: raise SystemExit('summary feed missing')
          feed=m.group(1); head=feed.split('¬~AA÷')[0]
          f={}
          for p in head.split('¬'):
              if '÷' in p:
                  k,v=p.split('÷',1); f[k]=v
          print(f"ZE={f.get('ZE')} ZC={f.get('ZC')}")
          if not f.get('ZE') or not f.get('ZC'): raise SystemExit('table ids missing')
          Path('/tmp/table_url').write_text(f"https://global.flashscore.ninja/1/x/feed/to_{f['ZE']}_{f['ZC']}_1")
          PY
          url=$(cat /tmp/table_url)
          curl -sS -L -H "User-Agent: $UA" -H 'Accept: */*' -H 'Accept-Language: cs-CZ,cs;q=0.9,en;q=0.8' -H 'Referer: https://www.livesport.cz/' -H 'Origin: https://www.livesport.cz' -H 'x-fsign: SW9D1eZo' "$url" -o /tmp/table.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/table.txt').read_text('utf-8','ignore')
          rows=[]
          for raw in s.split('~'):
              f={}
              for p in raw.split('¬'):
                  if '÷' in p:
                      k,v=p.split('÷',1); f[k]=v
              if f.get('TI') and f.get('TN'):
                  rows.append((f.get('TR'),f.get('TN'),f.get('TM'),f.get('TP')))
          print('TABLE ROWS',len(rows),rows[:14])
          if len(rows)<12: raise SystemExit(f'expected at least 12 standings rows, got {len(rows)}')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/Sports-Info/Sports Info.js'
          git commit -m 'Fix Livesport standings and Czech floorball source'
          git push origin HEAD:Master
