name: Merge community variants once

on:
  push:
    paths:
      - '.github/workflows/merge-community-variants-once.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Merge related catalog cards into variants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          path = Path('community-extra.js')
          lines = path.read_text(encoding='utf-8').splitlines()

          groups = [
              ('Adafruit IO Scriptable Widget', [('adafruit io scriptable widget','Standard'), ('adafruit io scriptable widget guage','Gauge')]),
              ('RoutineHub Stats', [('RoutineHub Stats Medium','Medium'), ('RoutineHub Stats Small','Small')]),
              ('APsystems EZ1 Widget', [('home screen','Home Screen'), ('lock screen','Lock Screen')]),
              ('Home Assistant Widgets', [('Home Assistant','Home Screen'), ('Home Assistant Lock','Lock Screen')]),
              ('Air Quality Widget', [('Air Quali fix','Fixed'), ('Air Quali locbased','Location based')]),
              ('Tankstellenpreise', [('tankstellenpreise.js','Classic'), ('tankstellenpreisev2_beta by Necriso','v2 Beta')]),
              ('Günstigste Tankstelle', [('guenstigsteTankstelle by Necriso','Germany'), ('guenstigsteTankstelleAT by Necriso','Austria')]),
              ('Discourse Forum Widget', [('Tumult Forum 2','Tumult'), ('Discourse Forum 2','Discourse'), ('Scriptable Forum 2','Scriptable Forum')]),
              ('UK COVID Dashboard', [('uk covid widget','Cases'), ('uk covid vaccinations widget','Vaccinations')]),
          ]

          def name_of(line):
              m = re.search(r'communityItem\("([^"]+)"', line)
              return m.group(1) if m else None

          def fields(line):
              vals = re.findall(r'"((?:\\.|[^"\\])*)"', line)
              if len(vals) < 8:
                  raise RuntimeError(f'Cannot parse catalog row: {line[:120]}')
              return vals

          by_name = {name_of(line): i for i, line in enumerate(lines) if name_of(line)}
          removals = set()

          for display_name, members in groups:
              missing = [name for name, _ in members if name not in by_name]
              if missing:
                  raise RuntimeError(f'Missing expected catalog rows for {display_name}: {missing}')
              primary_name = members[0][0]
              primary_idx = by_name[primary_name]
              primary = lines[primary_idx]
              variants = []
              for name, label in members:
                  row = lines[by_name[name]]
                  vals = fields(row)
                  variants.append({'label': label, 'file': vals[4], 'filename': vals[5]})
              renamed = primary.replace(f'communityItem("{primary_name}"', f'communityItem({json.dumps(display_name, ensure_ascii=False)}', 1)
              if not renamed.rstrip().endswith('),'):
                  raise RuntimeError(f'Unexpected row ending for {primary_name}')
              base = renamed.rstrip()[:-1]
              lines[primary_idx] = 'Object.assign(' + base + ',{variants:' + json.dumps(variants, ensure_ascii=False, separators=(',', ':')) + '}),'
              for name, _ in members[1:]:
                  removals.add(by_name[name])

          helper = 'scriptable-news-Widget.js'
          if helper in by_name:
              removals.add(by_name[helper])

          lines = [line for i, line in enumerate(lines) if i not in removals]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'Merged {len(groups)} related families; removed {len(removals)} redundant cards.')
          PY

          node tools/audit-community-catalog.cjs
          node tools/build-credits.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community-extra.js
          git rm .github/workflows/merge-community-variants-once.yml
          git commit -m "Group related community scripts as variants"
          git push origin HEAD:Master
