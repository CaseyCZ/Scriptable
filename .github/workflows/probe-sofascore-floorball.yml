name: Probe SofaScore floorball API

on:
  push:
    paths:
      - '.github/workflows/probe-sofascore-floorball.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture standings network
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q selenium
          which google-chrome || which chromium || true
          python3 - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          o=Options()
          o.add_argument('--headless=new')
          o.add_argument('--no-sandbox')
          o.add_argument('--disable-dev-shm-usage')
          o.add_argument('--window-size=1280,1200')
          o.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})
          d=webdriver.Chrome(options=o)
          try:
              url='https://www.livesport.cz/florbal/czech-republic/livesport-superliga/tabulka/'
              d.get(url)
              time.sleep(8)
              print('TITLE',d.title)
              print('BODY_HAS_TABLE', 'Vítkovice' in d.page_source, '32:5' in d.page_source, len(d.page_source))
              seen=[]
              for row in d.get_log('performance'):
                  try:m=json.loads(row['message'])['message']
                  except Exception:continue
                  if m.get('method')!='Network.requestWillBeSent':continue
                  req=m.get('params',{}).get('request',{})
                  u=req.get('url','')
                  if '/x/feed/' in u or 'flashscore.ninja' in u or 'stand' in u.lower():
                      if u not in seen:
                          seen.append(u)
                          print('REQ',u)
                          h=req.get('headers',{})
                          print('HEADERS',json.dumps({k:v for k,v in h.items() if k.lower() in ['x-fsign','referer','origin','user-agent']},ensure_ascii=False))
              print('REQUEST_COUNT',len(seen))
              for row in d.get_log('browser'):
                  print('BROWSER',row)
          finally:
              d.quit()
          PY
