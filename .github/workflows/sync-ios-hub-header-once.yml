name: Sync iOS Hub header once

on:
  push:
    paths:
      - '.github/workflows/sync-ios-hub-header-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Replace Scriptable header with iOS Hub structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          header = '''<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#top" aria-label="Scriptable Apps">
        <span class="brand-mark">JS</span>
        <span>Scriptable Apps<small>Scriptable · Widgets</small></span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="#ourApps"><span data-cs="Naše aplikace" data-en="Our apps">Naše aplikace</span></a>
        <a href="#community"><span data-cs="Komunita" data-en="Community">Komunita</span></a>
        <a href="https://scriptable.app" target="_blank" rel="noopener">Scriptable</a>
        <a href="https://github.com/CaseyCZ/Scriptable" target="_blank" rel="noopener">GitHub</a>
      </nav>
      <div class="nav-actions">
        <div class="settings-menu">
          <button id="settingsBtn" class="icon-btn settings-button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsPanel" aria-label="Settings" title="Settings">⚙</button>
          <div id="settingsPanel" class="settings-panel" role="dialog" aria-hidden="true">
            <div class="settings-title"><span data-cs="Nastavení" data-en="Settings">Nastavení</span></div>

            <div class="settings-label"><span data-cs="VZHLED" data-en="APPEARANCE">VZHLED</span></div>
            <div class="settings-theme-seg">
              <button id="themeDark" type="button">☾ <span data-cs="Tmavý" data-en="Dark">Tmavý</span></button>
              <button id="themeLight" type="button">☀ <span data-cs="Světlý" data-en="Light">Světlý</span></button>
            </div>

            <div class="settings-label"><span data-cs="JAZYK" data-en="LANGUAGE">JAZYK</span></div>
            <div class="settings-language-list">
              <button id="langCs" type="button"><span class="flag">CZ</span><span>Čeština</span></button>
              <button id="langEn" type="button"><span class="flag">EN</span><span>English</span></button>
            </div>

            <div class="settings-label">LAYOUT</div>
            <div class="settings-layout-seg">
              <button id="layoutGrid" type="button" title="Grid">▦</button>
              <button id="layoutList" type="button" title="List">☷</button>
            </div>

            <div class="settings-label"><span data-cs="NAHLÁSIT PROBLÉM" data-en="REPORT ISSUE">NAHLÁSIT PROBLÉM</span></div>
            <a class="settings-report-link" href="https://github.com/CaseyCZ/Scriptable/issues/new/choose" target="_blank" rel="noopener"><span aria-hidden="true">🐞</span><span data-cs="Nahlásit problém" data-en="Report issue">Nahlásit problém</span></a>
          </div>
        </div>
        <a class="compact-btn nav-app-primary" href="https://apps.apple.com/app/scriptable/id1405459188" target="_blank" rel="noopener"><span aria-hidden="true"></span><span data-cs="Scriptable" data-en="Scriptable">Scriptable</span></a>
      </div>
    </div>
  </header>

  <div class="wrap">
    <main id="top">'''

          pattern = re.compile(r'<body>\s*<div class="wrap">\s*<header class="topbar">.*?</header>\s*<main>', re.S)
          text, count = pattern.subn(header, text, count=1)
          if count != 1:
              raise SystemExit(f'header replacement count={count}')

          text = re.sub(r'ios-hub-visual\.css\?v=[^"\']+', 'ios-hub-visual.css?v=20261005-1to1', text, count=1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/sync-ios-hub-header-once.yml

      - name: Commit and push
        run: |
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add -A
          git commit -m "Match Scriptable header to iOS Hub 1:1"
          git push origin Master
