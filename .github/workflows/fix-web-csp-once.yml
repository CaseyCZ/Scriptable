name: Fix web CSP interactions once

on:
  push:
    paths:
      - '.github/workflows/fix-web-csp-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Repair CSP-safe web interactions
        run: |
          python3 tools/fix-csp-once.py
          node --check assets/js/index-page.js
          node --check assets/js/guide-page.js
          node --check assets/js/credits-page.js
          node --check assets/js/privacy-page.js
          node tools/audit-web-csp.cjs
          node tools/audit-community-catalog.cjs

      - name: Commit repaired website
        run: |
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git restore .github/workflows/pages.yml
          git add index.html assets/js/index-page.js tools/audit-web-csp.cjs
          git rm tools/fix-csp-once.py .github/workflows/fix-web-csp-once.yml
          git commit -m "Fix CSP-safe web interactions and add regression audit"
          git push origin HEAD:Master
