name: Sync iOS Hub visual style once

on:
  push:
    paths:
      - '.github/workflows/sync-ios-hub-visual-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Patch website
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if 'ios-hub-visual.css' not in text:
              text = text.replace('</head>', '  <link rel="stylesheet" href="ios-hub-visual.css?v=20261005">\n</head>', 1)
          text = text.replace('Scriptable Apps<small>by CaseyCZ</small>', 'Scriptable Apps<small>Scriptable · Widgets</small>')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/sync-ios-hub-visual-once.yml

      - name: Commit visual sync
        run: |
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add index.html
          git commit -m "Align Scriptable visual style with iOS Hub"
          git push origin Master
