name: Apply three-state community health checks

on:
  push:
    branches: [Master]
    paths:
      - ".github/workflows/apply-health-states.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Apply health-state patch
        run: python tools/_patch_health_states.py

      - name: Commit patch and remove helpers
        run: |
          rm .github/workflows/apply-health-states.yml
          rm tools/_patch_health_states.py
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add tools/update_community_status.py assets/js/index-page.js index.html .github/workflows/apply-health-states.yml tools/_patch_health_states.py
          git commit -m "Add three-state community health checks"
          git push origin HEAD:Master
