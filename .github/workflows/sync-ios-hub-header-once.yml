name: Sync iOS Hub header once

on:
  push:
    paths:
      - '.github/workflows/sync-ios-hub-header-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Sync header, translations and support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          html = html.replace('<meta id="themeColor" name="theme-color" content="#0b1020">', '<meta id="themeColor" name="theme-color" content="#070b14">', 1)

          replacements = {
            '<a href="#ourApps"><span data-cs="Naše aplikace" data-en="Our apps">Naše aplikace</span></a>': '<a href="#ourApps"><span data-cs="Naše aplikace" data-en="Our apps" data-de="Unsere Apps" data-es="Nuestras apps" data-fr="Nos apps">Naše aplikace</span></a>',
            '<a href="#community"><span data-cs="Komunita" data-en="Community">Komunita</span></a>': '<a href="#community"><span data-cs="Komunita" data-en="Community" data-de="Community" data-es="Comunidad" data-fr="Communauté">Komunita</span></a>',
            '<div class="settings-title"><span data-cs="Nastavení" data-en="Settings">Nastavení</span></div>': '<div class="settings-title"><span data-cs="Nastavení" data-en="Settings" data-de="Einstellungen" data-es="Ajustes" data-fr="Paramètres">Nastavení</span></div>',
            '<div class="settings-label"><span data-cs="VZHLED" data-en="APPEARANCE">VZHLED</span></div>': '<div class="settings-label"><span data-cs="VZHLED" data-en="APPEARANCE" data-de="DARSTELLUNG" data-es="APARIENCIA" data-fr="APPARENCE">VZHLED</span></div>',
            '<button id="themeDark" type="button">☾ <span data-cs="Tmavý" data-en="Dark">Tmavý</span></button>': '<button id="themeDark" type="button">☾ <span data-cs="Tmavý" data-en="Dark" data-de="Dunkel" data-es="Oscuro" data-fr="Sombre">Tmavý</span></button>',
            '<button id="themeLight" type="button">☀ <span data-cs="Světlý" data-en="Light">Světlý</span></button>': '<button id="themeLight" type="button">☀ <span data-cs="Světlý" data-en="Light" data-de="Hell" data-es="Claro" data-fr="Clair">Světlý</span></button>',
            '<div class="settings-label"><span data-cs="JAZYK" data-en="LANGUAGE">JAZYK</span></div>': '<div class="settings-label"><span data-cs="JAZYK" data-en="LANGUAGE" data-de="SPRACHE" data-es="IDIOMA" data-fr="LANGUE">JAZYK</span></div>',
            '<div class="settings-label">LAYOUT</div>': '<div class="settings-label"><span data-cs="ROZLOŽENÍ" data-en="LAYOUT" data-de="LAYOUT" data-es="DISEÑO" data-fr="MISE EN PAGE">ROZLOŽENÍ</span></div>',
            '<div class="settings-label"><span data-cs="NAHLÁSIT PROBLÉM" data-en="REPORT ISSUE">NAHLÁSIT PROBLÉM</span></div>': '<div class="settings-label"><span data-cs="NAHLÁSIT PROBLÉM" data-en="REPORT ISSUE" data-de="PROBLEM MELDEN" data-es="INFORMAR DE UN PROBLEMA" data-fr="SIGNALER UN PROBLÈME">NAHLÁSIT PROBLÉM</span></div>',
            '<a class="settings-report-link" href="https://github.com/CaseyCZ/Scriptable/issues/new/choose" target="_blank" rel="noopener"><span aria-hidden="true">🐞</span><span data-cs="Nahlásit problém" data-en="Report issue">Nahlásit problém</span></a>': '<a class="settings-report-link" href="https://github.com/CaseyCZ/Scriptable/issues/new/choose" target="_blank" rel="noopener"><span aria-hidden="true">🐞</span><span data-cs="Nahlásit problém" data-en="Report issue" data-de="Problem melden" data-es="Informar de un problema" data-fr="Signaler un problème">Nahlásit problém</span></a>',
          }
          for old, new in replacements.items():
            if old not in html:
              raise SystemExit(f'Missing expected index fragment: {old[:80]}')
            html = html.replace(old, new, 1)

          old_languages = '''            <div class="settings-language-list">
              <button id="langCs" type="button"><span class="flag">CZ</span><span>Čeština</span></button>
              <button id="langEn" type="button"><span class="flag">EN</span><span>English</span></button>
            </div>'''
          new_languages = '''            <div class="settings-language-list">
              <button id="langCs" type="button" data-language="cs"><img src="assets/flags/cz.svg" alt=""><span>Čeština</span></button>
              <button id="langEn" type="button" data-language="en"><img src="assets/flags/gb.svg" alt=""><span>English</span></button>
              <button id="langDe" type="button" data-language="de"><img src="assets/flags/de.svg" alt=""><span>Deutsch</span></button>
              <button id="langEs" type="button" data-language="es"><img src="assets/flags/es.svg" alt=""><span>Español</span></button>
              <button id="langFr" type="button" data-language="fr"><img src="assets/flags/fr.svg" alt=""><span>Français</span></button>
            </div>'''
          if old_languages not in html:
            raise SystemExit('Language block not found')
          html = html.replace(old_languages, new_languages, 1)

          old_primary = '<a class="compact-btn nav-app-primary" href="https://apps.apple.com/app/scriptable/id1405459188" target="_blank" rel="noopener"><span aria-hidden="true"></span><span data-cs="Scriptable" data-en="Scriptable">Scriptable</span></a>'
          new_primary = '<button class="compact-btn nav-support-primary" type="button" data-support-open><img class="compact-brand-icon" src="https://cdn.buymeacoffee.com/buttons/bmc-new-btn-logo.svg" alt="" referrerpolicy="no-referrer"><span class="support-label" data-cs="Podpořit" data-en="Support" data-de="Unterstützen" data-es="Apoyar" data-fr="Soutenir">Podpořit</span></button>'
          if old_primary not in html:
            raise SystemExit('Primary header action not found')
          html = html.replace(old_primary, new_primary, 1)

          support_modal = '''

  <div id="supportModal" class="support-backdrop" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="supportTitle">
    <div class="support-dialog">
      <button class="support-close" type="button" data-support-close aria-label="Close">×</button>
      <div class="badge" data-cs="PODPOŘIT PROJEKT" data-en="SUPPORT THE PROJECT" data-de="PROJEKT UNTERSTÜTZEN" data-es="APOYAR EL PROYECTO" data-fr="SOUTENIR LE PROJET">PODPOŘIT PROJEKT</div>
      <h2 id="supportTitle" data-cs="Podpoř další vývoj." data-en="Support further development." data-de="Unterstütze die weitere Entwicklung." data-es="Apoya el desarrollo futuro." data-fr="Soutenez le développement futur.">Podpoř další vývoj.</h2>
      <p data-cs="Pokud ti Scriptable Apps šetří čas, můžeš podpořit další vývoj přes Buy Me a Coffee." data-en="If Scriptable Apps saves you time, you can support further development through Buy Me a Coffee." data-de="Wenn dir Scriptable Apps Zeit spart, kannst du die weitere Entwicklung über Buy Me a Coffee unterstützen." data-es="Si Scriptable Apps te ahorra tiempo, puedes apoyar el desarrollo futuro mediante Buy Me a Coffee." data-fr="Si Scriptable Apps vous fait gagner du temps, vous pouvez soutenir son développement via Buy Me a Coffee.">Pokud ti Scriptable Apps šetří čas, můžeš podpořit další vývoj přes Buy Me a Coffee.</p>
      <a href="https://www.buymeacoffee.com/caseycz" target="_blank" rel="noopener"><img class="support-qr" src="https://caseycz.github.io/support-qr.svg" alt="Buy Me a Coffee QR code"></a>
      <a class="btn primary" style="width:100%" href="https://www.buymeacoffee.com/caseycz" target="_blank" rel="noopener"><span data-cs="Otevřít Buy Me a Coffee" data-en="Open Buy Me a Coffee" data-de="Buy Me a Coffee öffnen" data-es="Abrir Buy Me a Coffee" data-fr="Ouvrir Buy Me a Coffee">Otevřít Buy Me a Coffee</span></a>
    </div>
  </div>'''
          marker = '\n  <script src="./community-extra.js"></script>'
          if marker not in html:
            raise SystemExit('Script marker not found')
          html = html.replace(marker, support_modal + marker, 1)

          html = html.replace("    const savedLang=localStorage.getItem('siteLang');\n    let lang=['cs','en'].includes(savedLang)?savedLang:((navigator.language||'').toLowerCase().startsWith('cs')?'cs':'en');",
                              "    const SUPPORTED_LANGS=['cs','en','de','es','fr'];\n    const savedLang=localStorage.getItem('siteLang');\n    const browserLang=(navigator.language||'en').slice(0,2).toLowerCase();\n    let lang=SUPPORTED_LANGS.includes(savedLang)?savedLang:(SUPPORTED_LANGS.includes(browserLang)?browserLang:'en');", 1)

          old_set_language = "    function setLanguage(next){lang=next;localStorage.setItem('siteLang',lang);document.documentElement.lang=lang;document.querySelectorAll('[data-cs]').forEach(el=>el.textContent=el.dataset[lang]);const search=document.getElementById('communitySearch');if(search)search.placeholder=search.dataset[lang==='cs'?'placeholderCs':'placeholderEn'];document.getElementById('langCs').classList.toggle('active',lang==='cs');document.getElementById('langEn').classList.toggle('active',lang==='en');renderAll()}"
          new_set_language = "    function setLanguage(next){lang=SUPPORTED_LANGS.includes(next)?next:'en';localStorage.setItem('siteLang',lang);document.documentElement.lang=lang;document.querySelectorAll('[data-cs]').forEach(el=>{el.textContent=el.getAttribute('data-'+lang)||el.getAttribute('data-en')||el.getAttribute('data-cs')||el.textContent});const search=document.getElementById('communitySearch');if(search)search.placeholder=search.getAttribute('data-placeholder-'+lang)||search.getAttribute('data-placeholder-en')||search.getAttribute('data-placeholder-cs')||'';document.querySelectorAll('[data-language]').forEach(btn=>btn.classList.toggle('active',btn.dataset.language===lang));renderAll()}"
          if old_set_language not in html:
            raise SystemExit('setLanguage function not found')
          html = html.replace(old_set_language, new_set_language, 1)

          html = html.replace("    function categoryLabel(category){const x=CATEGORY_LABELS[category]||{cs:category,en:category};return x[lang]||category}",
                              "    function categoryLabel(category){const x=CATEGORY_LABELS[category]||{cs:category,en:category};return x[lang]||x.en||x.cs||category}", 1)

          old_card = "function cardHtml(app,index,external){const rawFeatures=(app.features&&app.features[lang])||[];const visibleFeatures=external?researchedFeatures(app,rawFeatures):rawFeatures;"
          new_card = "function cardHtml(app,index,external){const rawFeatures=(app.features&&app.features[lang])||app.features?.en||app.features?.cs||[];const visibleFeatures=external?researchedFeatures(app,rawFeatures):rawFeatures;"
          if old_card not in html:
            raise SystemExit('cardHtml feature fallback not found')
          html = html.replace(old_card, new_card, 1)
          html = html.replace("<div class=\"appTitle\"><h3 title=\"${app.name}\">${app.name}</h3><p>${app.description[lang]}</p>${author}",
                              "<div class=\"appTitle\"><h3 title=\"${app.name}\">${app.name}</h3><p>${app.description?.[lang]||app.description?.en||app.description?.cs||''}</p>${author}", 1)

          old_events = "    document.getElementById('langCs').addEventListener('click',()=>setLanguage('cs'));document.getElementById('langEn').addEventListener('click',()=>setLanguage('en'));"
          new_events = "    document.querySelectorAll('[data-language]').forEach(btn=>btn.addEventListener('click',()=>setLanguage(btn.dataset.language)));"
          if old_events not in html:
            raise SystemExit('Language event listeners not found')
          html = html.replace(old_events, new_events, 1)

          old_settings_events = "    document.getElementById('settingsBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('settingsPanel').classList.toggle('open')});document.getElementById('settingsPanel').addEventListener('click',e=>e.stopPropagation());document.addEventListener('click',()=>document.getElementById('settingsPanel').classList.remove('open'));"
          new_settings_events = "    document.getElementById('settingsBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('settingsPanel').classList.toggle('open')});document.getElementById('settingsPanel').addEventListener('click',e=>e.stopPropagation());document.addEventListener('click',()=>document.getElementById('settingsPanel').classList.remove('open'));\n    let supportReturnFocus=null;function openSupport(){const modal=document.getElementById('supportModal');supportReturnFocus=document.activeElement instanceof HTMLElement?document.activeElement:null;modal?.classList.add('open');document.body.classList.add('modal-open');modal?.setAttribute('aria-hidden','false');requestAnimationFrame(()=>modal?.querySelector('[data-support-close]')?.focus())}function closeSupport(){const modal=document.getElementById('supportModal');const wasOpen=modal?.classList.contains('open');modal?.classList.remove('open');document.body.classList.remove('modal-open');modal?.setAttribute('aria-hidden','true');if(wasOpen&&supportReturnFocus){const target=supportReturnFocus;supportReturnFocus=null;requestAnimationFrame(()=>target.focus?.())}}document.querySelectorAll('[data-support-open]').forEach(btn=>btn.addEventListener('click',openSupport));document.querySelectorAll('[data-support-close]').forEach(btn=>btn.addEventListener('click',closeSupport));document.getElementById('supportModal')?.addEventListener('click',e=>{if(e.target.id==='supportModal')closeSupport()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSupport()});"
          if old_settings_events not in html:
            raise SystemExit('Settings event block not found')
          html = html.replace(old_settings_events, new_settings_events, 1)

          html = html.replace("document.getElementById('themeColor').content=theme==='dark'?'#0b1020':'#f8fafc'", "document.getElementById('themeColor').content=theme==='dark'?'#070b14':'#eef3f8'", 1)

          index.write_text(html, encoding='utf-8')

          css_path = Path('ios-hub-visual.css')
          css = css_path.read_text(encoding='utf-8')
          old_topbar = ".topbar{position:sticky;top:0;z-index:100;border-bottom:1px solid color-mix(in srgb,var(--border) 75%,transparent);background:color-mix(in srgb,var(--page) 78%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}"
          new_topbar = ".topbar{position:sticky;top:0;z-index:100;display:block;padding:0;gap:0;border-bottom:1px solid color-mix(in srgb,var(--border) 75%,transparent);background:color-mix(in srgb,var(--page) 78%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}"
          if old_topbar not in css:
            raise SystemExit('Topbar CSS not found')
          css = css.replace(old_topbar, new_topbar, 1)
          css = css.replace('.nav-app-primary{background:linear-gradient(135deg,var(--action2),var(--action))!important;border-color:var(--action)!important;color:#fff!important;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 22%,transparent)}\n.nav-app-primary:hover{border-color:color-mix(in srgb,#fff 55%,var(--accent))!important}',
                            '.nav-support-primary{background:linear-gradient(135deg,var(--action2),var(--action))!important;border-color:var(--action)!important;color:#fff!important;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 22%,transparent)}\n.nav-support-primary:hover{border-color:color-mix(in srgb,#fff 55%,var(--accent))!important}\n.compact-brand-icon{width:14px;height:14px;display:block;object-fit:contain}\n.settings-language-list img{width:22px;height:15px;border-radius:2px;display:block;object-fit:cover}', 1)

          insert_before = '\n/* iOS Hub hero / content sizing */'
          support_css = '''

/* Same support dialog as iOS Hub */
.support-backdrop{position:fixed;inset:0;z-index:1300;display:none;place-items:center;padding:20px;background:rgba(2,6,23,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.support-backdrop.open{display:grid}
.support-dialog{position:relative;width:min(420px,100%);padding:22px;border:1px solid var(--border);border-radius:24px;background:linear-gradient(180deg,var(--panel),var(--input));box-shadow:0 30px 100px rgba(0,0,0,.45);text-align:center}
.support-close{position:absolute;right:14px;top:14px;width:36px;height:36px;border:1px solid var(--border);border-radius:11px;background:var(--panel2);color:var(--muted);font-size:20px;cursor:pointer}
.support-dialog h2{margin:14px 42px 8px;letter-spacing:-.04em}
.support-dialog p{color:var(--muted);font-size:12px;line-height:1.5}
.support-qr{width:min(260px,100%);display:block;margin:16px auto;padding:9px;border-radius:18px;background:#fff;border:1px solid var(--border)}
body.modal-open{overflow:hidden}
'''
          if insert_before not in css:
            raise SystemExit('CSS insertion marker not found')
          css = css.replace(insert_before, support_css + insert_before, 1)
          css = css.replace('  .nav-app-primary{width:38px;padding:0;font-size:0}\n  .nav-app-primary::before{content:"";font-size:15px}\n  .nav-app-primary>span{display:none}',
                            '  .nav-support-primary{width:38px;padding:0}\n  .nav-support-primary .support-label{display:none}\n  .compact-brand-icon{width:15px;height:15px}', 1)
          css_path.write_text(css, encoding='utf-8')

          flags = {
            'assets/flags/cz.svg': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20"><path fill="#fff" d="M0 0h30v10H0z"/><path fill="#d7141a" d="M0 10h30v10H0z"/><path fill="#11457e" d="M0 0l12 10L0 20z"/></svg>',
            'assets/flags/gb.svg': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30"><clipPath id="a"><path d="M0 0v30h60V0z"/></clipPath><path fill="#012169" d="M0 0h60v30H0z"/><g clip-path="url(#a)"><path stroke="#fff" stroke-width="6" d="M0 0l60 30m0-30L0 30"/><path stroke="#C8102E" stroke-width="4" d="M0 0l60 30m0-30L0 30"/></g><path stroke="#fff" stroke-width="10" d="M30 0v30M0 15h60"/><path stroke="#C8102E" stroke-width="6" d="M30 0v30M0 15h60"/></svg>',
            'assets/flags/de.svg': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20"><path d="M0 0h30v6.667H0z"/><path fill="#dd0000" d="M0 6.667h30v6.666H0z"/><path fill="#ffce00" d="M0 13.333h30V20H0z"/></svg>',
            'assets/flags/es.svg': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20"><path fill="#aa151b" d="M0 0h30v20H0z"/><path fill="#f1bf00" d="M0 5h30v10H0z"/></svg>',
            'assets/flags/fr.svg': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20"><path fill="#0055a4" d="M0 0h10v20H0z"/><path fill="#fff" d="M10 0h10v20H10z"/><path fill="#ef4135" d="M20 0h10v20H20z"/></svg>',
          }
          for name, content in flags.items():
            p = Path(name)
            p.parent.mkdir(parents=True, exist_ok=True)
            p.write_text(content, encoding='utf-8')
          PY

      - name: Validate header changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('ios-hub-visual.css').read_text(encoding='utf-8')
          checks=[
            'data-support-open', 'id="supportModal"', 'data-language="fr"',
            'assets/flags/de.svg', 'buymeacoffee.com/caseycz'
          ]
          for item in checks:
            assert item in html, item
          assert 'padding:0;gap:0' in css
          assert '.nav-support-primary' in css
          assert '.support-backdrop' in css
          start=html.rfind('<script>')
          end=html.find('</script>',start)
          assert start>=0 and end>start
          Path('/tmp/scriptable-inline.js').write_text(html[start+8:end],encoding='utf-8')
          PY
          node --check /tmp/scriptable-inline.js

      - name: Remove one-time workflow
        run: git rm .github/workflows/sync-ios-hub-header-once.yml

      - name: Commit and push
        run: |
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add -A
          git commit -m "Match Scriptable header to iOS Hub"
          git push origin Master
