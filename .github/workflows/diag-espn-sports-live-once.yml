name: Diagnose Sports Live ESPN once

on:
  push:
    paths:
      - '.github/workflows/diag-espn-sports-live-once.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Test ESPN single-day scoreboards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, datetime
          base='https://site.api.espn.com/apis/site/v2/sports'
          leagues=[('hockey','nhl'),('basketball','nba'),('baseball','mlb')]
          today=datetime.date.today()
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
          for sport,league in leagues:
              print('\n===',sport,league,'===')
              for off in [-7,-3,0,3,7,14,30]:
                  day=(today+datetime.timedelta(days=off)).strftime('%Y%m%d')
                  u=f'{base}/{sport}/{league}/scoreboard?dates={day}&limit=100'
                  try:
                      d=get(u); print(day,'events=',len(d.get('events',[])))
                  except Exception as ex:
                      print(day,'ERROR',repr(ex))
          PY
