name: Probe SofaScore floorball API

on:
  push:
    paths:
      - '.github/workflows/probe-sofascore-floorball.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        shell: bash
        run: |
          set -u
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'
          fetch(){
            local url="$1" out="$2"
            curl -sS -L \
              -H "User-Agent: $UA" \
              -H 'Accept-Language: en-US,en;q=0.9,cs;q=0.8' \
              "$url" -o "$out"
            echo "URL $url"
            echo "SIZE $(wc -c < "$out")"
            python3 - "$out" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text('utf-8','ignore')
          for term in ['cjs.initialFeeds','summary-results','summary-fixtures','Chodov','Mlada Boleslav','Mladá Boleslav','Stresovice','standings','event__participant','participant','__NEXT_DATA__','pq_graphql']:
              print(term, s.count(term))
              i=s.find(term)
              if i>=0: print(s[max(0,i-400):i+900].replace('\n',' ')[:1400])
          PY
          }
          fetch 'https://www.livesport.com/floorball/czech-republic/livesport-superliga/' /tmp/livesport.html
          fetch 'https://www.flashscore.com/floorball/czech-republic/livesport-superliga/' /tmp/flashscore.html
          fetch 'https://www.flashscore.com/floorball/czech-republic/livesport-superliga/standings/' /tmp/standings.html
          fetch 'https://www.flashscore.mobi/floorball/czech-republic/livesport-superliga/' /tmp/mobi.html || true
