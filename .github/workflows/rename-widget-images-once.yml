name: Rename widget images once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/rename-widget-images-once.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Rename widget screenshots
        run: |
          set -euo pipefail
          git mv "apps/IMG_5721.jpeg" "apps/Homebridge-Status/Homebridge Status.jpg"
          git mv "apps/Sports-Live/IMG_5722.jpeg" "apps/Sports-Live/Sports Live.jpg"
          rm .github/workflows/rename-widget-images-once.yml
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add -A
          git commit -m "Rename widget preview images"
          git push origin HEAD:Master
