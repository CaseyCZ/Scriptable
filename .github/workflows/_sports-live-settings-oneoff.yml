name: Sports Live settings one-off

on:
  push:
    branches:
      - Master
    paths:
      - .github/workflows/_sports-live-settings-oneoff.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Apply Sports Live settings patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip
          payload = ""
          open('/tmp/patch.py','wb').write(gzip.decompress(base64.b64decode(payload)))
          PY
          python3 /tmp/patch.py
          node --check "apps/Sports-Live/Sports-Live,js"
      - name: Commit update and remove one-off workflow
        shell: bash
        run: |
          rm -f ".github/workflows/_sports-live-settings-oneoff.yml"
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add "apps/Sports-Live/Sports-Live,js" ".github/workflows/_sports-live-settings-oneoff.yml"
          git commit -m "Unify Sports Live settings with CaseyCZ apps"
          git push origin HEAD:Master
