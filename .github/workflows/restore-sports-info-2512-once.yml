name: Restore Sports Info 2.5.12 once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/restore-sports-info-2512-once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Restore exact Sports Info 2.5.12 source
        run: |
          git show c098f96078502bc82cd112f6d74e8484ecd00089:'apps/Sports-Info/Sports Info.js' > 'apps/Sports-Info/Sports Info.js'

      - name: Validate JavaScript syntax
        run: node --check 'apps/Sports-Info/Sports Info.js'

      - name: Rebuild package and release metadata
        run: python .github/scripts/build_sports_info_package.py

      - name: Validate exact rollback
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          src=Path('apps/Sports-Info/Sports Info.js').read_text(encoding='utf-8')
          pkg=json.loads(Path('apps/Sports-Info/Sports Info.scriptable').read_text(encoding='utf-8'))
          app_readme=Path('apps/Sports-Info/README.md').read_text(encoding='utf-8')
          root=Path('README.md').read_text(encoding='utf-8')
          site=Path('index.html').read_text(encoding='utf-8')
          assert 'const APP_VERSION = "2.5.12";' in src
          assert '// Sports Info v2.5.12' in src
          assert pkg['name']=='Sports Info' and pkg['script']==src
          assert '**Sports Info v2.5.12 — Production**' in app_readme
          assert '| 🏆 **Sports Info** | ✅ v2.5.12 |' in root
          assert "{name:'Sports Info',version:'2.5.12'" in site
          assert "install:'./apps/Sports-Info/Sports%20Info.scriptable'" in site
          print('Sports Info 2.5.12 exact rollback validated')
          PY

      - name: Commit rollback
        run: |
          git config user.name 'CaseyCZ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'apps/Sports-Info/Sports Info.js' 'apps/Sports-Info/Sports Info.scriptable' 'apps/Sports-Info/README.md' README.md index.html
          git commit -m 'Restore Sports Info 2.5.12'
          git push origin HEAD:Master
