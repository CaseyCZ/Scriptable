name: Patch Sports Info 2.5.10 layout once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/patch-sports-layout-2510-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Apply layout patch
        run: python .github/scripts/patch_sports_layout_2510.py

      - name: Syntax check
        run: node --check 'apps/Sports-Info/Sports Info.js'

      - name: Synchronize package and release metadata
        run: python .github/scripts/build_sports_info_package.py

      - name: Validate release and layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          src = Path('apps/Sports-Info/Sports Info.js').read_text(encoding='utf-8')
          pkg = json.loads(Path('apps/Sports-Info/Sports Info.scriptable').read_text(encoding='utf-8'))
          assert 'const APP_VERSION = "2.5.10";' in src
          assert pkg['script'] == src
          assert 'b.setPadding(family==="small"?8:10,family==="small"?0:10' in src
          assert 'await teamCell(r,e.home,s,p,family,false,64);' in src
          assert 'await teamCell(r,e.away,s,p,family,true,64)' in src
          assert 'football:[["team","TÝM",136]' in src
          assert '["rank","#"' not in src[src.index('const TABLE_PROFILES='):src.index('function standingTeamLabel')]
          assert 'const addGap=' not in src
          assert "Sports Info',version:'2.5.10'" in Path('index.html').read_text(encoding='utf-8')
          print('Sports Info 2.5.10 layout validation OK')
          PY

      - name: Commit release
        run: |
          git config user.name 'CaseyCZ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'apps/Sports-Info/Sports Info.js' 'apps/Sports-Info/Sports Info.scriptable' 'apps/Sports-Info/README.md' README.md index.html
          git commit -m 'Sports Info 2.5.10 align small and standings grid'
          git push origin Master
