name: Apply Sports Info widget logo fix

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/patch-sports-info-widget-logos.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Patch Sports Info v2.5.41
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path=Path('apps/Sports-Info/Sports Info.js')
          text=path.read_text(encoding='utf-8')

          def once(old,new,label):
              global text
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              text=text.replace(old,new,1)

          once('// Sports Info v2.5.40','// Sports Info v2.5.41','version comment')
          once('const APP_VERSION = "2.5.40";','const APP_VERSION = "2.5.41";','APP_VERSION')

          old='async function logo(url,key){if(!url)return null;const p=logoCachePath(url,key);try{if(fm.fileExists(p)){try{return fm.readImage(p)}catch(_){try{fm.remove(p)}catch(__){}}}if(config.runsInWidget)return null;const r=new Request(url);r.timeoutInterval=API_TIMEOUT;const i=await r.loadImage();fm.writeImage(p,i);return i}catch(_){return null}}'
          new='''async function logo(url,key){\n  if(!url)return null;\n  const p=logoCachePath(url,key);\n  try{\n    if(fm.fileExists(p)){try{return fm.readImage(p)}catch(_){try{fm.remove(p)}catch(__){}}}\n    const r=new Request(url);\n    // Home Screen widgets may need to populate a cold logo cache themselves.\n    // Keep that network attempt short so images never consume the widget budget.\n    r.timeoutInterval=config.runsInWidget?3:API_TIMEOUT;\n    const i=await r.loadImage();\n    try{fm.writeImage(p,i)}catch(_){}\n    return i\n  }catch(_){return null}\n}'''
          once(old,new,'logo loader')

          path.write_text(text,encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          cp 'apps/Sports-Info/Sports Info.js' /tmp/SportsInfo.mjs
          node --check /tmp/SportsInfo.mjs

      - name: Verify widget logo behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const APP_VERSION = "2.5.41";' 'apps/Sports-Info/Sports Info.js'
          grep -F 'r.timeoutInterval=config.runsInWidget?3:API_TIMEOUT;' 'apps/Sports-Info/Sports Info.js'
          if grep -F 'if(config.runsInWidget)return null;' 'apps/Sports-Info/Sports Info.js'; then
            echo 'Widget logo download is still blocked' >&2
            exit 1
          fi

      - name: Build package
        run: python .github/scripts/build_sports_info_package.py

      - name: Sync release metadata
        run: python .github/scripts/sync_release_metadata.py

      - name: Audit settings UI wiring
        run: python .github/scripts/audit_sports_info_ui.py

      - name: Test layout regressions
        run: node .github/scripts/test_sports_info_layout.cjs

      - name: Validate package synchronization
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          app=Path('apps/Sports-Info')
          src=(app/'Sports Info.js').read_text(encoding='utf-8')
          pkg=json.loads((app/'Sports Info.scriptable').read_text(encoding='utf-8'))
          version=json.loads((app/'version.json').read_text(encoding='utf-8'))['version']
          assert version == '2.5.41', version
          assert pkg['script'] == src, 'scriptable package is not synchronized'
          assert 'if(config.runsInWidget)return null;' not in src
          assert 'r.timeoutInterval=config.runsInWidget?3:API_TIMEOUT;' in src
          assert re.search(r'const APP_VERSION\s*=\s*"2\.5\.41"',src)
          print('Sports Info v2.5.41 widget logo loader: OK')
          PY

      - name: Commit Sports Info v2.5.41
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CaseyCZ'
          git config user.email '25530709+CaseyCZ@users.noreply.github.com'
          git add \
            'apps/Sports-Info/Sports Info.js' \
            'apps/Sports-Info/Sports Info.scriptable' \
            'apps/Sports-Info/version.json' \
            'apps/Sports-Info/README.md' \
            'apps/Sports-Info/README_EN.md' \
            README.md README_EN.md index.html
          git commit -m 'Allow Home Screen widgets to fetch team logos'
          git push origin HEAD:Master
