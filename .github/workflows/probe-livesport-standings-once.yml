name: Probe Livesport standings once
on:
  push:
    branches: [Master]
    paths: ['.github/workflows/probe-livesport-standings-once.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate standings feeds
        shell: python
        run: |
          import urllib.request, urllib.error
          feeds = {
            'hockey':'https://www.livesport.com/x/feed/ss_1_QR1GYbvD_WOgC3lWQ_table_overall',
            'basketball':'https://www.livesport.com/x/feed/ss_1_WxpjFlH8_OCBVuvF6_table_overall',
            'floorball':'https://www.livesport.com/x/feed/ss_1_QwkNUoNH_UJqgfqC7_table_overall',
            'baseball':'https://www.livesport.com/x/feed/ss_1_IynvQfzT_Szt4Tyx9_table_overall',
          }
          H={'User-Agent':'Mozilla/5.0','x-fsign':'SW9D1eZo','Referer':'https://www.livesport.com/'}
          for name,url in feeds.items():
            print('\n###',name,url)
            try:
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=20) as r:
                raw=r.read().decode('utf-8','replace')
                print('HTTP',r.status,'bytes',len(raw),'head',raw[:400].replace('\n',' '))
                print('team markers',raw.count('participant'),raw.count('team_name_span'),'delim',raw.count('¬'))
            except Exception as e:
              print('ERROR',type(e).__name__,e)
