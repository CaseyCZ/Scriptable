name: Sync header navigation with iOS Hub

on:
  push:
    branches:
      - Master

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Apply navigation patch
        run: python3 .github/patch_header_nav.py
      - name: Validate and commit
        run: |
          node tools/audit-community-catalog.cjs
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git rm .github/workflows/sync-header-nav-ioshub.yml .github/patch_header_nav.py
          git add index.html guide.html credits.html ios-hub-visual.css
          git commit -m "Match header navigation to iOS Hub"
          git pull --rebase origin Master
          git push origin Master
