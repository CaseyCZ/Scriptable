name: Sports Live updater cache one-off

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/_sports-live-update-cache-oneoff.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master

      - name: Patch Sports Live updater
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/Sports-Live/Sports-Live,js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// Sports Live v0.3.2','// Sports Live v0.3.3',1)
          s=s.replace('const APP_VERSION = "0.3.2";','const APP_VERSION = "0.3.3";',1)
          old='async function updater(s){try{const src=await getString(UPDATE_SOURCE_URL);'
          new='async function updater(s){try{const updateUrl=UPDATE_SOURCE_URL+(UPDATE_SOURCE_URL.includes("?")?"&":"?")+"_="+Date.now();const req=new Request(updateUrl);req.timeoutInterval=API_TIMEOUT;req.headers={"Cache-Control":"no-cache","Pragma":"no-cache"};const src=await req.loadString();'
          if old not in s:
              raise SystemExit('updater source fetch pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          cp 'apps/Sports-Live/Sports-Live,js' /tmp/SportsLive.mjs
          node --check /tmp/SportsLive.mjs

      - name: Commit update and cleanup
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git rm .github/workflows/_sports-live-update-cache-oneoff.yml
          git add 'apps/Sports-Live/Sports-Live,js'
          git commit -m "Avoid stale Sports Live update checks"
          git push origin HEAD:Master
