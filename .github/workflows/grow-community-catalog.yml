name: Grow community catalog

on:
  push:
    paths:
      - '.github/workflows/grow-community-catalog.yml'

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Import curated projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64,zlib
          exec(compile(zlib.decompress(base64.b64decode('')).decode('utf-8'),'<catalog-import>','exec'),{})
          PY
      - name: Validate
        run: |
          node --check community-extra.js
          node - <<'NODE'
          global.window={}; require('./community-extra.js');
          const rows=window.communityExtraApps||[];
          const bad=a=>[...new Set(a.filter((x,i)=>a.indexOf(x)!==i))];
          const dn=bad(rows.map(x=>x.name)),df=bad(rows.map(x=>x.file));
          if(dn.length)throw new Error('Duplicate names: '+dn.join(', '));
          if(df.length)throw new Error('Duplicate files: '+df.join(', '));
          if(rows.length<180)throw new Error('Too few projects: '+rows.length);
          console.log('FINAL COMMUNITY TOTAL:',rows.length);
          console.log('UNIQUE AUTHORS:',new Set(rows.map(x=>x.author)).size);
          NODE
          grep -q 'community-extra.js?v=20261008-library3' index.html
          grep -q "shopping:{cs:'Nakupování',en:'Shopping'}" index.html
      - name: Commit and clean
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git rm .github/workflows/grow-community-catalog.yml
          git add community-extra.js index.html
          git commit -m "Grow community Scriptable library"
          git push origin Master
