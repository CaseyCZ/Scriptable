name: Temporary Sideload Watch vertical alignment tune

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/zz-temp-sideload-vertical-tune.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master

      - name: Patch Sideload Watch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          app=Path('apps/Sideload-Watch')
          p=app/'Sideload Watch.js'
          s=p.read_text(encoding='utf-8')

          s=s.replace('// Sideload Watch v0.2.19','// Sideload Watch v0.2.20',1)
          s=s.replace('const APP_VERSION = "0.2.19";','const APP_VERSION = "0.2.20";',1)

          old='''  w.backgroundColor=c.bg;w.setPadding(L.pad,L.pad,L.pad,L.pad);'''
          new='''  w.backgroundColor=c.bg;\n  const twoColumnSummary=(family==="medium"||family==="large")&&settings.mediumLayout!=="center"&&status.total===0;\n  const topPad=twoColumnSummary?(family==="large"?10:7):L.pad;\n  const bottomPad=twoColumnSummary?(family==="large"?10:8):L.pad;\n  w.setPadding(topPad,L.pad,bottomPad,L.pad);'''
          if old not in s: raise SystemExit('padding marker missing')
          s=s.replace(old,new,1)

          old='''      const right=columns.addStack();right.layoutVertically();right.size=new Size(145,0);\n      addCentered(right,summary.tracked,Font.boldSystemFont(large?10:8),c.muted);'''
          new='''      const right=columns.addStack();right.layoutVertically();right.size=new Size(145,0);\n      right.addSpacer(large?8:6);\n      addCentered(right,summary.tracked,Font.boldSystemFont(large?10:8),c.muted);'''
          if old not in s: raise SystemExit('right column marker missing')
          s=s.replace(old,new,1)

          old='''    if(settings.showTime!==false){\n      w.addSpacer(family==="large"?4:2);\n      const timeRow=w.addStack();timeRow.addSpacer();'''
          new='''    if(settings.showTime!==false){\n      if(summaryColumns)w.addSpacer();\n      else w.addSpacer(family==="large"?4:2);\n      const timeRow=w.addStack();timeRow.addSpacer();'''
          if old not in s: raise SystemExit('time marker missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          (app/'version.json').write_text(json.dumps({'version':'0.2.20'},indent=2)+'\n',encoding='utf-8')

          pkg_path=app/'Sideload Watch.scriptable'
          if pkg_path.exists():
              pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
              pkg['script']=s
              pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate
        run: |
          cp 'apps/Sideload-Watch/Sideload Watch.js' /tmp/sideload.mjs
          node --check /tmp/sideload.mjs
          grep -q 'const APP_VERSION = "0.2.20";' 'apps/Sideload-Watch/Sideload Watch.js'
          grep -q 'const twoColumnSummary=' 'apps/Sideload-Watch/Sideload Watch.js'
          grep -q 'right.addSpacer(large?8:6);' 'apps/Sideload-Watch/Sideload Watch.js'
          grep -q 'if(summaryColumns)w.addSpacer();' 'apps/Sideload-Watch/Sideload Watch.js'

      - name: Commit app files
        run: |
          git config user.name 'CaseyCZ'
          git config user.email '25530709+CaseyCZ@users.noreply.github.com'
          git add 'apps/Sideload-Watch/Sideload Watch.js' 'apps/Sideload-Watch/version.json' 'apps/Sideload-Watch/Sideload Watch.scriptable'
          git commit -m 'Tune Sideload Watch vertical alignment'
          git push origin HEAD:Master
