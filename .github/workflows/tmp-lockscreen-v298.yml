name: LockScreen Generator v2.9.8 iCloud output fix
on:
  push:
    branches: [Master]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Patch shortcut output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/LockScreenGenerator/LockScreenGenerator.js')
          s=p.read_text(encoding='utf-8')
          old='const APP_VERSION = "2.9.7";'
          assert old in s, 'expected v2.9.7'
          s=s.replace(old,'const APP_VERSION = "2.9.8";',1)
          old='if(shortcutRun){const local=FileManager.local(),out=local.joinPath(local.temporaryDirectory(),"LockScreenOverlay.png");local.write(out,png);Script.setShortcutOutput(out);Script.complete();return}'
          new='if(shortcutRun){const out=fm.joinPath(fm.documentsDirectory(),"LockScreenOverlay.png");fm.write(out,png);Script.setShortcutOutput(out);Script.complete();return}'
          assert old in s, 'shortcut local output block not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          cp 'apps/LockScreenGenerator/LockScreenGenerator.js' /tmp/LockScreenGenerator.mjs
          node --check /tmp/LockScreenGenerator.mjs
      - name: Commit patch
        run: |
          git config user.name "CaseyCZ automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-lockscreen-v298.yml
          git add 'apps/LockScreenGenerator/LockScreenGenerator.js'
          git commit -m 'LockScreen Generator v2.9.8: use iCloud shortcut output'
          git push origin HEAD:Master
