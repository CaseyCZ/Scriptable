name: LockScreen Generator shortcut overlay migration
on:
  push:
    branches:
      - Master
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Patch LockScreen Generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/LockScreenGenerator/LockScreenGenerator.js')
          src=p.read_text(encoding='utf-8')
          old='''async function main(){let settings=await loadSettings();if(config.runsInApp){const fm=FileManager.iCloud(),settingsPath=fm.joinPath(fm.documentsDirectory(),SETTINGS_FILE),firstRun=!fm.fileExists(settingsPath);if(firstRun){settings.language=await chooseFirstRunLanguage(settings.language);saveSettings(settings)}settings=await openSettingsScreen(settings)}const size=resolveResolution();const image=await buildImage(size,settings);const fm=FileManager.iCloud();const path=fm.joinPath(fm.documentsDirectory(),OUTPUT_FILE);fm.writeImage(path,image);if(config.runsInApp)await QuickLook.present(image);Script.setShortcutOutput(path);Script.complete()}'''
          new='''async function main(){const shortcutOverlay=String(args.shortcutParameter??"").trim().toLowerCase()==="overlay";let settings=await loadSettings();if(config.runsInApp&&!shortcutOverlay){const fm=FileManager.iCloud(),settingsPath=fm.joinPath(fm.documentsDirectory(),SETTINGS_FILE),firstRun=!fm.fileExists(settingsPath);if(firstRun){settings.language=await chooseFirstRunLanguage(settings.language);saveSettings(settings)}settings=await openSettingsScreen(settings)}const size=resolveResolution();const image=await buildImage(size,settings),png=Data.fromPNG(image);const fm=FileManager.iCloud(),path=fm.joinPath(fm.documentsDirectory(),OUTPUT_FILE);fm.write(path,png);const shortcutRun=shortcutOverlay||(!config.runsInApp&&!config.runsInWidget&&!config.runsInNotification&&!config.runsFromHomeScreen);if(shortcutRun){const local=FileManager.local(),out=local.joinPath(local.temporaryDirectory(),"LockScreenOverlay.png");local.write(out,png);Script.setShortcutOutput(out);Script.complete();return}if(config.runsInApp)await QuickLook.present(image);Script.setShortcutOutput(path);Script.complete()}'''
          if old not in src:
              raise SystemExit('main() signature not found')
          src=src.replace('const APP_VERSION = "2.9.6";','const APP_VERSION = "2.9.7";',1)
          src=src.replace(old,new,1)
          p.write_text(src,encoding='utf-8')
          PY
          cp 'apps/LockScreenGenerator/LockScreenGenerator.js' /tmp/LockScreenGenerator.mjs
          node --check /tmp/LockScreenGenerator.mjs
      - name: Commit source update
        shell: bash
        run: |
          git config user.name "CaseyCZ automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-lockscreen-shortcut-overlay.yml
          git add 'apps/LockScreenGenerator/LockScreenGenerator.js'
          git commit -m "LockScreen Generator v2.9.7: return PNG overlay to Shortcuts"
          git push origin HEAD:Master
