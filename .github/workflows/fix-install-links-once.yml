name: Fix install links once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/fix-install-links-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: Master
      - name: Force .scriptable downloads
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='`<a class="btn primary" href="${app.install}">${tr(\'📲 Instalovat\',\'📲 Install\')}</a><a class="btn secondary" href="${app.file}" download>${tr(\'⬇️ .js\',\'⬇️ .js\')}</a>'
          new='`<a class="btn primary" href="${app.install}" download>${tr(\'📲 Instalovat\',\'📲 Install\')}</a><a class="btn secondary" href="${app.file}" download>${tr(\'⬇️ .js\',\'⬇️ .js\')}</a>'
          if old not in s:
              raise SystemExit('install link source not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary checks
        run: |
          rm -f .github/workflows/check-lockscreen-package-once.yml
          rm -f .github/workflows/fix-install-links-once.yml
      - name: Commit
        run: |
          git config user.name 'CaseyCZ automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows
          git commit -m 'Fix .scriptable install downloads' || exit 0
          git push origin Master
