name: Compact Credits like iOS Hub

on:
  push:
    branches: [Master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
      - name: Match iOS Hub compact catalogue credits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('credits.html')
          s=p.read_text()

          # Replace the large author-card grid with a compact iOS-Hub-style pill cloud.
          s=s.replace('<div id="communityCredits" class="credit-cloud"></div>', '<div class="credit-panel"><div id="communityCredits" class="catalog-credit-list"></div></div>')

          css='''.credit-panel{background:color-mix(in srgb,var(--panel) 96%,transparent);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.catalog-credit-list{display:flex;align-items:center;justify-content:center;align-content:flex-start;flex-wrap:wrap;gap:7px 8px}
.catalog-credit-pill{min-width:0;max-width:100%;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:color-mix(in srgb,var(--panel2) 88%,transparent);font-size:10px;line-height:1;font-weight:850;white-space:nowrap;transition:.15s ease}
.catalog-credit-pill:hover{border-color:var(--accent);transform:translateY(-1px)}
.catalog-credit-author{color:var(--text);font-weight:900;overflow:hidden;text-overflow:ellipsis}
.catalog-credit-dot{color:var(--muted)}
.catalog-credit-project{color:var(--accent);font-weight:900;overflow:hidden;text-overflow:ellipsis}
'''
          if '.catalog-credit-list{' not in s:
              s=s.replace('.credits-summary{display:flex;', css+'\n.credits-summary{display:flex;',1)

          # Remove obsolete grid-specific mobile rules from the old card layout.
          s=s.replace('@media(max-width:850px){.credit-cloud{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.credits-grid,.credit-cloud{grid-template-columns:1fr}.credits-content{width:min(100% - 20px,1100px)}}',
                      '@media(max-width:700px){.credits-grid{grid-template-columns:1fr}.credits-content{width:min(100% - 20px,1100px)}.credit-panel{padding:14px}.catalog-credit-list{gap:6px}.catalog-credit-pill{padding:6px 9px;font-size:9.5px}}')

          old=re.compile(r"function renderCommunityCredits\(\)\{if\(!creditsData\)return;const authors=creditsData\.authors\|\|\{\};document\.getElementById\('creditsSummary'\)\.innerHTML=`[\s\S]*?document\.getElementById\('communityCredits'\)\.innerHTML=Object\.entries\(authors\)\.map\(\(\[author,projects\]\)=>`[\s\S]*?\.join\(''\)\}")
          new="""function renderCommunityCredits(){if(!creditsData)return;const authors=creditsData.authors||{};document.getElementById('creditsSummary').innerHTML=`<span class=\"pill\">${creditsData.total} ${esc(t('projektů','projects','Projekte','proyectos','projets'))}</span><span class=\"pill\">${creditsData.authorCount} ${esc(t('autorů','authors','Autoren','autores','auteurs'))}</span>`;const items=[];Object.entries(authors).forEach(([author,projects])=>projects.forEach(project=>items.push({author,...project})));items.sort((a,b)=>a.author.localeCompare(b.author,undefined,{sensitivity:'base'})||a.name.localeCompare(b.name,undefined,{sensitivity:'base'}));document.getElementById('communityCredits').innerHTML=items.map(item=>`<a class=\"catalog-credit-pill\" href=\"${esc(item.source)}\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"${esc(item.author+' · '+item.name)}\"><span class=\"catalog-credit-author\">${esc(item.author)}</span><span class=\"catalog-credit-dot\">·</span><span class=\"catalog-credit-project\">${esc(item.name)}</span></a>`).join('')}"""
          s2,n=old.subn(new,s,count=1)
          if n!=1:
              raise SystemExit(f'renderCommunityCredits replacement count={n}')
          s=s2

          # Basic validation.
          for needle in ['catalog-credit-list','catalog-credit-pill','items.map(item=>','creditsData.total']:
              if needle not in s: raise SystemExit('missing '+needle)
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          node tools/audit-community-catalog.cjs
          grep -q 'catalog-credit-pill' credits.html
          git rm .github/workflows/compact-credits.yml
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add credits.html
          git commit -m "Match Credits catalogue to iOS Hub compact pills"
          git push origin Master
