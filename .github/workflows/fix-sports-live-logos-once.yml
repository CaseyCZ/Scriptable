name: Fix Sports Live logos once

on:
  push:
    paths:
      - '.github/workflows/fix-sports-live-logos-once.yml'
      - '.github/scripts/fix-sports-live-logos-once.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Fix ESPN logos
        run: python .github/scripts/fix-sports-live-logos-once.py

      - name: Validate Sports Live
        run: |
          node --check 'apps/Sports-Live/Sports-Live,js'
          grep -F 'const APP_VERSION = "0.2.5";' 'apps/Sports-Live/Sports-Live,js'
          grep -F 'logos?.[0]?.href||x.team?.logo' 'apps/Sports-Live/Sports-Live,js'

      - name: Remove one-time files
        run: git rm .github/workflows/fix-sports-live-logos-once.yml .github/scripts/fix-sports-live-logos-once.py

      - name: Commit and push
        run: |
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add -A
          git commit -m "Fix ESPN team logos in Sports Live"
          git push origin Master
