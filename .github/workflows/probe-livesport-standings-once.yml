name: Probe Livesport standings once
on:
  push:
    branches: [Master]
    paths: ['.github/workflows/probe-livesport-standings-once.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe representative standings pages
        shell: python
        run: |
          import re, urllib.request
          urls = {
            'hockey':'https://www.livesport.com/hockey/czech-republic/extraliga/standings/',
            'basketball':'https://www.livesport.com/basketball/czech-republic/nbl/standings/',
            'floorball':'https://www.livesport.com/floorball/czech-republic/livesport-superliga/standings/',
            'baseball':'https://www.livesport.com/baseball/czech-republic/extraliga/standings/',
          }
          H={'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1','Accept-Language':'en-US,en;q=0.9'}
          for name,url in urls.items():
            req=urllib.request.Request(url,headers=H)
            with urllib.request.urlopen(req,timeout=20) as r: html=r.read().decode('utf-8','replace')
            rows=len(re.findall(r'ui-table__row',html))
            bodies=len(re.findall(r'ui-table__body',html))
            feeds=sorted(set(re.findall(r'cjs\.initialFeeds\["([^"]+)"\]',html)))
            print(name,'bytes',len(html),'rows',rows,'bodies',bodies,'feeds',feeds[:30])
            for token in ['tableCellParticipant__name','table__cell--points','standings','tournament-table']:
              print(' ',token, token in html)
