name: Sports Live centering one-off

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/_sports-live-center-oneoff.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Center Sports Live medium layout
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/Sports-Live/Sports-Live,js')
          s = p.read_text(encoding='utf-8')

          s2 = s.replace('// Sports Live v0.3.0', '// Sports Live v0.3.1', 1)
          s2 = s2.replace('const APP_VERSION = "0.3.0";', 'const APP_VERSION = "0.3.1";', 1)

          old = 'const teams=w.addStack();await sportTeamCard(teams,left,s,c,true);teams.addSpacer(7);await sportTeamCard(teams,right,s,c,true);w.addSpacer();const footer=w.addStack();footer.centerAlignContent();const score=scoreText(g,s);'
          new = 'const teams=w.addStack();teams.addSpacer();await sportTeamCard(teams,left,s,c,true);teams.addSpacer(7);await sportTeamCard(teams,right,s,c,true);teams.addSpacer();w.addSpacer();const footer=w.addStack();footer.centerAlignContent();footer.addSpacer();const score=scoreText(g,s);'
          if old not in s2:
              raise SystemExit('Medium team-row pattern not found')
          s2 = s2.replace(old, new, 1)

          old2 = 'addText(footer,fmtDate(s,n.gameDate),8,s,false,c.muted)}}return w}'
          new2 = 'addText(footer,fmtDate(s,n.gameDate),8,s,false,c.muted)}}footer.addSpacer();return w}'
          if old2 not in s2:
              raise SystemExit('Medium footer pattern not found')
          s2 = s2.replace(old2, new2, 1)

          if s2 == s:
              raise SystemExit('No changes made')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          cp 'apps/Sports-Live/Sports-Live,js' /tmp/SportsLive.mjs
          node --check /tmp/SportsLive.mjs

      - name: Commit fix and remove one-off workflow
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add 'apps/Sports-Live/Sports-Live,js'
          git rm '.github/workflows/_sports-live-center-oneoff.yml'
          git commit -m "Center Sports Live medium widget"
          git push origin HEAD:Master
