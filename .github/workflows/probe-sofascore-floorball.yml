name: Probe SofaScore floorball API

on:
  push:
    paths:
      - '.github/workflows/probe-sofascore-floorball.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe rendered standings HTML
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://www.livesport.cz/florbal/czech-republic/livesport-superliga/tabulka/'
            'https://www.livesport.com/cz/florbal/cesko/livesport-superliga/tabulka/'
            'https://www.livesport.cz/florbal/czech-republic/livesport-superliga/tabulka/?t=6gJP1e91&ts=YseEWnAC'
          )
          uas=(
            'Mozilla/5.0 (iPhone; CPU iPhone OS like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'
            'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          )
          n=0
          for ua in "${uas[@]}"; do
            for url in "${urls[@]}"; do
              n=$((n+1)); out="/tmp/page$n.html"
              echo "=== UA $ua URL $url ==="
              code=$(curl -sS -L -H "User-Agent: $ua" -H 'Accept-Language: cs-CZ,cs;q=0.9,en;q=0.8' -o "$out" -w '%{http_code}' "$url" || true)
              echo "HTTP $code SIZE $(wc -c < "$out" 2>/dev/null || echo 0)"
              python3 - "$out" <<'PY'
          import sys,re
          from pathlib import Path
          s=Path(sys.argv[1]).read_text('utf-8','ignore')
          for term in ['Vítkovice','Vitkovice','Střešovice','Stresovice','Mladá Boleslav','Mlada Boleslav','ui-table__row','tableCell','col_matches_played','32:5']:
              print(term,s.count(term))
              i=s.find(term)
              if i>=0: print(s[max(0,i-500):i+1200].replace('\n',' ')[:1800])
          PY
            done
          done
