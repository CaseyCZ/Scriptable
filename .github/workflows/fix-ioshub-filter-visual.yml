name: Fix iOS Hub filter visual

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/fix-ioshub-filter-visual.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Apply exact iOS Hub filter visual
        run: |
          python3 <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('ios-hub-visual.css?v=20261005-1to1', 'ios-hub-visual.css?v=20261008-filters1')
          text = text.replace('⚙ Filtry · 🔎 Hledání', '● Stav · 🏷 Kategorie · ↕ Řazení · 🔎 Hledání')
          text = text.replace('⚙ Filters · 🔎 Search', '● Status · 🏷 Category · ↕ Sort · 🔎 Search')
          index.write_text(text, encoding='utf-8')

          css_path = Path('ios-hub-visual.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Scriptable status summary aligned with iOS Hub */'
          if marker not in css:
              css += '''\n\n/* Scriptable status summary aligned with iOS Hub */\n.communityHealth{justify-content:center;margin:10px 0 14px}\n.communityHealth .communityAvailability{margin:0}\n'''
          css_path.write_text(css, encoding='utf-8')
          PY

          grep -q 'ios-hub-visual.css?v=20261008-filters1' index.html
          grep -q '● Stav · 🏷 Kategorie · ↕ Řazení · 🔎 Hledání' index.html
          grep -q 'iOS Hub filter system 1:1' ios-hub-visual.css

      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'CaseyCZ'
          git config user.email '25530709+CaseyCZ@users.noreply.github.com'
          git rm .github/workflows/fix-ioshub-filter-visual.yml
          git add index.html ios-hub-visual.css
          git commit -m 'Match Scriptable filter visual to iOS Hub'
          git push origin Master
          gh workflow run pages.yml --ref Master
