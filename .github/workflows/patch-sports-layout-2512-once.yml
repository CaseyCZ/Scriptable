name: Patch Sports Info 2.5.12 table once

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/patch-sports-layout-2512-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Apply Sports Info table patch
        run: python .github/scripts/patch_sports_layout_2512.py

      - name: Syntax check
        run: node --check 'apps/Sports-Info/Sports Info.js'

      - name: Synchronize package and release metadata
        run: python .github/scripts/build_sports_info_package.py

      - name: Validate Sports Info 2.5.12
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          src = Path('apps/Sports-Info/Sports Info.js').read_text(encoding='utf-8')
          pkg = json.loads(Path('apps/Sports-Info/Sports Info.scriptable').read_text(encoding='utf-8'))
          assert 'const APP_VERSION = "2.5.12";' in src
          assert pkg['script'] == src
          assert 'let capacity=d.current?14:17' in src
          assert 'clamp(capacity,6,17)' in src
          assert 'statsWidth=statCols.reduce' in src
          assert 'const hs=h.addStack();hs.layoutHorizontally();hs.size=new Size(statsWidth,0);' in src
          assert 'const rs=r.addStack();rs.layoutHorizontally();rs.size=new Size(statsWidth,0);' in src
          assert 'tx(s,"updated")' not in src[src.index('async function widget('):src.index('function esc(')]
          assert "Sports Info',version:'2.5.12'" in Path('index.html').read_text(encoding='utf-8')
          print('Sports Info 2.5.12 validation OK')
          PY

      - name: Commit release
        run: |
          git config user.name 'CaseyCZ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'apps/Sports-Info/Sports Info.js' 'apps/Sports-Info/Sports Info.scriptable' 'apps/Sports-Info/README.md' README.md index.html
          git commit -m 'Sports Info 2.5.12 normalize standings layout'
          git push origin Master
