name: Expand community library wave 3

on:
  push:
    paths:
      - '.github/workflows/expand-community-wave3.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Discover and append Scriptable widgets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re, urllib.request, urllib.parse, time

          repos = [
            'ChristophObermeier/iOS-Widgets','AngusTse/ios-scriptable-hknews-widget','tony-aptx4869/scriptable',
            'Sillium/telekom-lock-screen-widget','UsernameYann/Sunflower-Land-Widget-for-iOS','wickenico/exchange-rates.js',
            'tiuub/traewelling-widget','cbpowell/Sense-Scriptable','gnrmarcel/scriptable-xbox',
            'akaFTS/superglance-scriptable-widget','oezingle/Scriptable-Reddit-Widget','PINPAL/ScriptableWidgets',
            'unvsDev/blend','esonwong/scriptable-widget','MacSchierer/ImpfQuoten','benjaminmckinley/Scriptable-Widgets',
            'brianwalborn/football-team-schedule-widget','marco79cgn/cowboy-ios-widget','Ctrl-plus-R/MoonCat-Scriptable-Widget',
            'edisonX-sudo/MetaTraderAccountViewer','dominik-lueke/PokemonOfTheDay','fcelsa/ScriptableMoonPhase',
            'Arxhtects/Scriptable-Basic-Widget','sayantangr/Airtel_Scriptable_Widget','awaescher/home-battery-widget',
            'jaydainn/CFBWidget','junsang3/genshin-resin-counter-widget','tobiasgrtnkrd/Scriptable-Transparent-Widget',
            'waaeel/ios-scriptable-wiener-linien-widgets','archive-sh/F1-Scriptable-Widget','MacSchierer/WarnWetter',
            'okuRaku/random-jisho-word-widget','zSaaiq/iOS-Signing-Status-Widget','Boatkungg/YRC-Canteen-Widget',
            'maxarndt/apsystems-ez1-scriptable-widget','toto/homeassistant-solar-widget-scriptable',
            'fabianpimminger/scriptable-netatmo-widget','transilluminate/download-station-widget','flopp999/Scriptable-NordPool',
            'AhmedHalat/GitHub-Scriptable-Widget','macdis/pollen-widget','wuzeyou/PriceWidgets',
            'yuristru/scriptable_OneDayCalendarWidgetXS','v1lling/scriptable-clubconnector','efficlab/social-media-follower-widget',
            'DanielGallo/GivEnergy-Scriptable-Widget','SmonSE/Notizblog','hendrilee/claude-usage-widget',
            'bluewalk/scriptable-widgets','mtoutkast/scriptable-calendar-widget','BerkeleyPB/Scriptable',
            'AngusTse/ios-scriptable-ausnews-widget','aquova/hass-ios-scriptable-widgets','SapneshNaik/kuvera-ios-widget-scriptable',
            'jakub-stastny/ios.scriptable.widgets.today','0xf0xx0/scriptable-no-background','wizard-ron17/Scriptable-iOS-Widgets',
            'xditya/ios-scriptable-widgets','abbyjeet/scriptable-widgets','markhunte/Discourse-Forum----Latest-Post-iOS-Widget',
            'marvnsch/Scriptable-widget-for-Strava','bradrblack/adafruit-io-scriptable-widget','flopp999/Scriptable-EiB',
            'neidigsi/froniview_scriptable','npadgen/scriptable-uk-covid-dashboard','phatsanphonna/COVID-19-Scriptable',
            'Besenwiesler/corona-widget','rfresh/Scriptable','cristiancode-hermes/scriptable-widgets',
            'McSliverMoon/Scriptable-Widgets-IOS','Suma-xy/iOS-MacOS-Widgets','codegangsta/scriptable_widgets',
            'lukrencijus/scriptable-widgets','tai78nan/ios-scriptable-widget','noiseorigin/scriptable-ios-widget',
            'Roninjc/scriptable','St3v3ncher/scriptable-widgets','heyprashant/Scriptables-widget-ios'
          ]

          token=os.environ.get('GH_TOKEN','')
          api_headers={'Accept':'application/vnd.github+json','User-Agent':'CaseyCZ-Scriptable-Catalog'}
          if token: api_headers['Authorization']='Bearer '+token

          def get_json(url, timeout=20):
            req=urllib.request.Request(url,headers=api_headers)
            with urllib.request.urlopen(req,timeout=timeout) as r:
              return json.load(r)

          def get_text(url, timeout=15):
            req=urllib.request.Request(url,headers={'User-Agent':'CaseyCZ-Scriptable-Catalog','Accept':'text/plain,*/*'})
            with urllib.request.urlopen(req,timeout=timeout) as r:
              data=r.read(450000)
              return data.decode('utf-8','replace')

          def humanize(path):
            s=Path(path).stem
            s=re.sub(r'[_+.]+',' ',s)
            s=re.sub(r'(?<=[a-z0-9])(?=[A-Z])',' ',s)
            s=re.sub(r'[-]+',' ',s)
            s=re.sub(r'\s+',' ',s).strip()
            return s or 'Scriptable Widget'

          def category_for(text):
            t=text.lower()
            checks=[
              ('cars',['car','tesla','ford','bmw','polestar','vehicle','cowboy','vanmoof','renault','charging']),
              ('sport',['sport','football','nfl','nba','nhl','cfb','f1','formula','strava','ski','cycling','fitness','club']),
              ('weather',['weather','rain','forecast','temperature','moon','sunrise','aqi','air quality']),
              ('finance',['stock','crypto','bitcoin','btc','finance','price','exchange','trading','metatrader','currency','nordpool']),
              ('calendar',['calendar','countdown','birthday','agenda','event','date','reminder','schedule']),
              ('news',['news','rss','discourse','headline']),
              ('social',['reddit','twitter','mastodon','instagram','slack','discord','social','follower']),
              ('gaming',['game','gaming','xbox','pokemon','genshin','steam','sunflower']),
              ('health',['health','pollen','covid','incidence','vaccine','sense']),
              ('travel',['travel','train','transit','wiener','bike','traffic','station']),
              ('mobile',['telekom','airtel','mobile','data usage','signing']),
              ('reading',['quote','word','jisho','book','recipe','obsidian']),
              ('art',['wallpaper','transparent','blur','photo','image','color'])]
            for cat,words in checks:
              if any(w in t for w in words): return cat
            return 'tools'

          icons={'cars':'🚗','sport':'🏆','weather':'🌤️','finance':'📈','calendar':'📅','news':'📰','social':'💬','gaming':'🎮','health':'❤️','travel':'🧭','mobile':'📱','reading':'📚','art':'🎨','tools':'🧰'}

          p=Path('community-extra.js')
          text=p.read_text(encoding='utf-8')
          existing_files=set(re.findall(r"communityItem\([^\n]*?['\"](https?://[^'\"]+)['\"]\s*,['\"][^'\"]+['\"]\s*,['\"]https?://",text))
          # More reliable extraction of the fifth argument from each existing row.
          for line in text.splitlines():
            if not line.lstrip().startswith('communityItem('): continue
            urls=re.findall(r'https?://[^\'\"\s,]+',line)
            if urls: existing_files.add(urls[0])
          existing_names=set()
          for m in re.finditer(r"communityItem\((['\"])(.*?)\1\s*,",text): existing_names.add(m.group(2))

          rows=[]; seen_files=set(existing_files); seen_names=set(existing_names); scanned=0; accepted=0
          for repo in repos:
            try:
              meta=get_json('https://api.github.com/repos/'+repo)
              if meta.get('private') or meta.get('disabled'): continue
              branch=meta.get('default_branch') or 'main'
              tree=get_json('https://api.github.com/repos/'+repo+'/git/trees/'+urllib.parse.quote(branch,safe='')+'?recursive=1')
              candidates=[]
              for e in tree.get('tree',[]):
                path=e.get('path',''); low=path.lower(); size=e.get('size') or 0
                if e.get('type')!='blob' or not low.endswith('.js'): continue
                if size and (size<250 or size>420000): continue
                if any(x in low for x in ['/node_modules/','/vendor/','/dist/','.min.js','package-lock','webpack']): continue
                base=Path(low).name
                if base in {'module.js','modules.js','helper.js','helpers.js','utils.js','constants.js','config.js'}: continue
                candidates.append(path)
              # Prefer shallower / primary files, cap per repository to avoid one project dominating the library.
              candidates.sort(key=lambda x:(x.count('/'),len(x),x.lower()))
              repo_count=0
              for path in candidates:
                if repo_count>=10: break
                qpath=urllib.parse.quote(path,safe='/')
                raw=f'https://raw.githubusercontent.com/{repo}/{urllib.parse.quote(branch,safe="")}/{qpath}'
                if raw in seen_files: continue
                scanned+=1
                try: body=get_text(raw)
                except Exception: continue
                if 'ListWidget' not in body: continue
                if not any(k in body for k in ('Script.setWidget','presentSmall(','presentMedium(','presentLarge(','presentAccessory')): continue
                # Avoid obvious libraries/modules even if they contain examples in comments.
                stripped=re.sub(r'/\*.*?\*/','',body,flags=re.S)
                if 'ListWidget' not in stripped: continue
                name=humanize(path)
                if len(name)>54: name=name[:51].rstrip()+'…'
                if name in seen_names: name=f'{name} · {repo.split("/")[0]}'
                if name in seen_names: continue
                category=category_for(repo+' '+path+' '+str(meta.get('description') or ''))
                author=repo.split('/')[0]
                source=f'https://github.com/{repo}/blob/{urllib.parse.quote(branch,safe="")}/{qpath}'
                preview=f'https://opengraph.githubassets.com/1/{repo}'
                tags=[category.capitalize(),repo.split('/')[1][:28]]
                cs=f'Komunitní Scriptable widget z projektu {repo}.'
                en=f'Community Scriptable widget from {repo}.'
                args=[name,category,author,icons[category],raw,Path(path).name,source,preview,tags,cs,en]
                row='communityItem('+','.join(json.dumps(v,ensure_ascii=False,separators=(',',':')) for v in args)+'),'
                rows.append(row); seen_files.add(raw); seen_names.add(name); accepted+=1; repo_count+=1
            except Exception as e:
              print('REPO SKIP',repo,str(e)[:120])

          print('SCANNED_JS=',scanned,'NEW_WIDGETS=',accepted,'REPOS=',len(repos))
          if rows:
            marker='// GitHub discovery wave 3 — 2026-10-08'
            pos=text.rfind('\n];')
            if pos<0: raise SystemExit('community array closing not found')
            text=text[:pos]+'\n\n'+marker+'\n'+'\n'.join(rows)+text[pos:]
            p.write_text(text,encoding='utf-8')
          idx=Path('index.html')
          html=idx.read_text(encoding='utf-8')
          html=re.sub(r'community-extra\.js\?v=[^"\']+', 'community-extra.js?v=20261008-library4', html)
          idx.write_text(html,encoding='utf-8')
          PY
      - name: Validate catalog
        run: |
          node --check community-extra.js
          node - <<'NODE'
          global.window={}; require('./community-extra.js');
          const rows=window.communityExtraApps||[];
          const dups=a=>[...new Set(a.filter((x,i)=>a.indexOf(x)!==i))];
          const dn=dups(rows.map(x=>x.name)), df=dups(rows.map(x=>x.file));
          if(dn.length) throw new Error('Duplicate names: '+dn.join(', '));
          if(df.length) throw new Error('Duplicate URLs: '+df.join(', '));
          if(rows.length<=257) throw new Error('Wave 3 added no projects; total '+rows.length);
          console.log('FINAL COMMUNITY TOTAL:',rows.length);
          console.log('UNIQUE AUTHORS:',new Set(rows.map(x=>x.author)).size);
          NODE
          grep -q 'community-extra.js?v=20261008-library4' index.html
      - name: Commit with race protection
        run: |
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git rm .github/workflows/expand-community-wave3.yml
          git add community-extra.js index.html
          git commit -m "Expand community library wave 3"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin Master || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:Master; then exit 0; fi
            echo "Push raced; retrying $attempt/5"
            sleep 2
          done
          exit 1
