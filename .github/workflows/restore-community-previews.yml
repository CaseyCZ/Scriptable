name: Restore original community previews

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/restore-community-previews.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Restore preview metadata from pre-preview commit
        run: |
          git show 4722311e2dfdd5ae94b3aee4e5a0b862eafd7ca5:community-extra.js > community-extra.js
          node --check community-extra.js
          git diff -- community-extra.js

      - name: Commit restore and clean up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'CaseyCZ'
          git config user.email '25530709+CaseyCZ@users.noreply.github.com'
          git rm .github/workflows/restore-community-previews.yml
          git add community-extra.js
          git commit -m 'Restore original community preview metadata'
          git push origin Master
          gh workflow run pages.yml --ref Master
